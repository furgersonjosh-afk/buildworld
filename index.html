function sampleWheelHeight3D(mode, wx, wz){
  let h = getExactTerrainHeight(mode, wx, wz);
  // 1. Check Analytic 3D Stunt Ramps first (100% reliable, never misses or drives through!)
  if(CH3D && CH3D.analyticRamps && CH3D.analyticRamps.length){
    for(let i=0; i<CH3D.analyticRamps.length; i++){
      const r = CH3D.analyticRamps[i];
      const dx = wx - r.x, dz = wz - r.z;
      const lx =  dx * r.cos - dz * r.sin;
      const lz =  dx * r.sin + dz * r.cos;
      if(Math.abs(lx) <= r.halfL && Math.abs(lz) <= r.halfW){
        let rampY = r.baseY;
        if(r.tabletop){
          const third = r.halfL / 3.0;
          if(Math.abs(lx) <= third){
            rampY = r.baseY + r.h;
          } else {
            const u = (r.halfL - Math.abs(lx)) / (2.0 * third);
            rampY = r.baseY + Math.max(0, Math.min(1, u)) * r.h;
          }
        } else {
          const u = (lx + r.halfL) / (2.0 * r.halfL);
          rampY = r.baseY + Math.max(0, Math.min(1, u)) * r.h;
        }
        if(rampY > h){
          h = rampY;
          CH3D.onRampThisFrame = true;
        }
      }
    }
  }
  // 2. Also check elevated Viaduct Deck / Crush Cars via Raycaster
  if(CH3D && CH3D.rideableMeshes.length){
    const curY = (CH3D.y !== undefined) ? CH3D.y : h;
    CH3D.raycaster.set(new THREE.Vector3(wx, curY + 2.6, wz), new THREE.Vector3(0, -1, 0));
    const hits = CH3D.raycaster.intersectObjects(CH3D.rideableMeshes, true);
    for(let i=0; i<hits.length; i++){
      const ht = hits[i];
      const ny = ht.face ? ht.face.normal.y : 1.0;
      if(ny > 0.35 && ht.point.y >= h - 0.15 && ht.point.y <= curY + 2.1){
        if(ht.point.y > h) h = ht.point.y;
        if(ht.object && ht.object.userData && ht.object.userData.isRamp){
          CH3D.onRampThisFrame = true;
        }
        break;
      }
    }
  }
  return h;
}

const _SPHERE_DROP_GEO = new THREE.SphereGeometry(0.15, 8, 8);

function spawnSphericalSplashBlast(x, y, z, heading, speed, count, isSoap){
  if(!CH3D || !CH3D.mudParticles) return;
  const col1 = isSoap ? 0x38bdf8 : 0x2e1909;
  const col2 = isSoap ? 0xf0f9ff : 0x6e4726;
  for(let i=0;i<count;i++){
    const mat = new THREE.MeshStandardMaterial({
      color: (i%3===0) ? col2 : col1,
      roughness: 0.15,
      metalness: 0.25
    });
    const drop = new THREE.Mesh(_SPHERE_DROP_GEO, mat);
    const sc = 0.75 + Math.random()*0.95;
    drop.scale.set(sc*0.85, sc*1.35, sc*0.85); // Organic teardrop/blob shape (NO CUBES!)
    const side = (i%2===0 ? -1 : 1) * (0.85 + Math.random()*0.45);
    const fOff = (Math.random() - 0.5) * 2.4;
    drop.position.set(
      x + Math.cos(heading)*fOff + Math.sin(heading)*side,
      y + 0.28 + Math.random()*0.35,
      z - Math.sin(heading)*fOff + Math.cos(heading)*side
    );
    CH3D.parkGroup.add(drop);
    const outAng = heading + (side > 0 ? -1.1 : 1.1) + (Math.random()-0.5)*0.7;
    const outSpd = 2.5 + Math.random()*4.5 + Math.abs(speed)*0.28;
    CH3D.mudParticles.push({
      mesh: drop,
      vx: Math.cos(outAng)*outSpd,
      vy: 4.2 + Math.random()*5.2 + Math.min(3.5, Math.abs(speed)*0.22),
      vz: -Math.sin(outAng)*outSpd,
      life: 0.65 + Math.random()*0.35
    });
  }
}

function drawLiveMinimap(mode){
  const cv = document.getElementById("ch3d_minimap");
  if(!cv || !CH3D) return;
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  ctx.fillStyle = mode==="nightcity" ? "#1e293b" : "#132a17";
  ctx.fillRect(0, 0, W, H);

  const scale = 0.62; // 1 meter = 0.62 px (shows ~230m x 150m around player!)
  const toMap = (wx, wz)=>[
    W*0.5 + (wx - CH3D.x)*scale,
    H*0.5 + (wz - CH3D.z)*scale
  ];

  // Draw Track Loop or City Roads
  if(mode === "nightcity"){
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 10;
    const [x0,y0] = toMap(-200, 0), [x1,y1] = toMap(200, 0);
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    [-60, 0, 60].forEach(cx=>{
      const [ax,ay] = toMap(cx, -160), [bx,by] = toMap(cx, 160);
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    });
    // Teal Viaduct Line
    ctx.strokeStyle = "#2dd4bf"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
  } else if(CH3D.trackPoints && CH3D.trackPoints.length){
    ctx.strokeStyle = "#a8764b"; ctx.lineWidth = 6.5;
    ctx.beginPath();
    CH3D.trackPoints.forEach((p, i)=>{
      const [mx, my] = toMap(p.x, p.z);
      if(i===0) ctx.moveTo(mx, my); else ctx.lineTo(mx, my);
    });
    ctx.closePath(); ctx.stroke();
    ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 1.2; ctx.stroke();
  }

  // Draw Mud Puddles (brown circles) & Car Washes (cyan squares)
  ctx.fillStyle = "#5c3415";
  (CH3D.mudZones||[]).forEach(mz=>{
    const [mx, my] = toMap(mz.x, mz.z);
    ctx.beginPath(); ctx.arc(mx, my, Math.max(3, mz.r*scale), 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = "#00f2fe";
  (CH3D.carWashBays||[]).forEach(cw=>{
    const [mx, my] = toMap(cw.x, cw.z);
    ctx.fillRect(mx-4, my-4, 8, 8);
  });

  // Draw Town Buildings
  ctx.fillStyle = "#cbd5e1";
  (CH3D.boxColliders||[]).forEach(bc=>{
    const [mx, my] = toMap(bc.cx, bc.cz);
    ctx.fillRect(mx - bc.hx*scale, my - bc.hz*scale, bc.hx*2*scale, bc.hz*2*scale);
  });

  // Draw AI Rivals (red/yellow dots)
  (CH3D.rivals||[]).forEach(rv=>{
    if(rv.wrecked) return;
    const [mx, my] = toMap(rv.x, rv.z);
    ctx.fillStyle = rv.isBoss ? "#facc15" : "#ef4444";
    ctx.beginPath(); ctx.arc(mx, my, 3.5, 0, Math.PI*2); ctx.fill();
  });

  // Draw Player Directional Orange Arrow in Center
  ctx.save();
  ctx.translate(W*0.5, H*0.5);
  ctx.rotate(-CH3D.heading);
  ctx.fillStyle = "#ff5f00";
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(7, 0); ctx.lineTo(-5, -5); ctx.lineTo(-3, 0); ctx.lineTo(-5, 5);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

function step3DChapterFrame(now){
  if(!CH3D) return;
  if(CH3D.raf) cancelAnimationFrame(CH3D.raf);
  CH3D.raf = requestAnimationFrame(step3DChapterFrame);
  if(!CH3D.last) CH3D.last = now;
  const rawDt = Math.max(0.016, Math.min((now - CH3D.last)/1000, 0.05));
  CH3D.last = now;
  const dt = rawDt * (CH3D.slowMo ? 0.35 : 1.0);

  const ch = CHAPTERS_3D[CH3D.chIdx] || CHAPTERS_3D[0];
  const inp = CH3D.input;
  const st = carStats(CH3D.vType, CH3D.vCfg);
  const laws = getWorldLaws();

  // Spin Car Wash Bristle Roller Brushes & Check if Truck is Driving Through a Car Wash Bay!
  if(CH3D.washBrushes){
    CH3D.washBrushes.forEach((b, i)=>{ b.rotation.y += rawDt * (i%2===0 ? 4.2 : -4.2); });
  }
  if(CH3D.carWashBays){
    for(const cw of CH3D.carWashBays){
      if(Math.hypot(CH3D.x - cw.x, CH3D.z - cw.z) < cw.r){
        if(Math.random() < 0.75){
          spawnSphericalSplashBlast(CH3D.x, CH3D.y + 0.6, CH3D.z, CH3D.heading, 6.0, 5, true);
        }
        if((CH3D.vCfg.mudLevel||0) > 0.02 || (CH3D.vCfg.condition||100) < 100){
          CH3D.vCfg.mudLevel = Math.max(0, (CH3D.vCfg.mudLevel||0) - rawDt * 0.85);
          CH3D.vCfg.condition = Math.min(100, (CH3D.vCfg.condition||100) + rawDt * 45);
          cfg(CH3D.vType).mudLevel = CH3D.vCfg.mudLevel;
          cfg(CH3D.vType).condition = CH3D.vCfg.condition;
          const mEl = $("#ch3dmud"); if(mEl) mEl.textContent = Math.round(CH3D.vCfg.mudLevel*100) + "%";
          const hEl = $("#ch3dhp");  if(hEl) hEl.textContent = Math.round(CH3D.vCfg.condition) + "%";
          if(!CH3D._lastWashToast || now - CH3D._lastWashToast > 2800){
            CH3D._lastWashToast = now;
            CH3D.coins += 25; addCoins(25); addXP(15); SFX.coin();
            $("#ch3dcoins").textContent = CH3D.coins;
            showMsg("💦 CAR WASH SPARKLING CLEAN & REPAIRED! +🪙25", 1300);
          }
        }
      }
    }
  }

  // Check if inside a Mud Puddle or Deep Mud Bog Zone -> REAL MUD SINKING + SPHERICAL MUD SPLASH BLASTS!
  let inMud = false;
  let activeMudZone = null;
  for(const mz of CH3D.mudZones){
    const d = Math.hypot(CH3D.x - mz.x, CH3D.z - mz.z);
    if(d < mz.r){ inMud = true; activeMudZone = mz; break; }
  }
  const targetSink = inMud ? (laws.mudDepth==="swamp" ? -0.52 : (laws.mudDepth==="shallow" ? -0.26 : -0.42)) : 0.0;
  CH3D.mudSink = (CH3D.mudSink||0) + (targetSink - (CH3D.mudSink||0)) * Math.min(1, rawDt * 7.5);

  const depthFactor = laws.mudDepth==="shallow" ? 0.88 : (laws.mudDepth==="swamp" ? 0.52 : 0.72);
  const mudDrag = inMud ? (CH3D.fourWD ? (CH3D.diffLock ? Math.min(0.94, depthFactor+0.18) : depthFactor) : depthFactor*0.65) : 1.0;

  if(inMud && Math.abs(CH3D.speed) > 0.8){
    if(!CH3D._wasInMud && Math.abs(CH3D.speed) > 4.0){
      // Huge initial 28-droplet spherical splash blast when hitting the mud puddle!
      spawnSphericalSplashBlast(CH3D.x, CH3D.y, CH3D.z, CH3D.heading, CH3D.speed, 28, false);
    }
    CH3D.vCfg.mudLevel = Math.min(1.0, (CH3D.vCfg.mudLevel||0) + dt*0.32);
    cfg(CH3D.vType).mudLevel = CH3D.vCfg.mudLevel;
    const mEl = $("#ch3dmud"); if(mEl) mEl.textContent = Math.round(CH3D.vCfg.mudLevel*100) + "%";
    if(Math.random() < 0.85){
      spawnSphericalSplashBlast(CH3D.x, CH3D.y, CH3D.z, CH3D.heading, CH3D.speed, 4, false);
    }
    if(!CH3D._lastMudToast || now - CH3D._lastMudToast > 3200){
      CH3D._lastMudToast = now;
      CH3D.coins += 15; addCoins(15);
      $("#ch3dcoins").textContent = CH3D.coins;
      showMsg("💦 DEEP MUD SINK & SPLASH BLAST! +🪙15", 950);
    }
  }
  CH3D._wasInMud = inMud;

  if(CH3D.mudParticles){
    for(let i=CH3D.mudParticles.length-1; i>=0; i--){
      const mp = CH3D.mudParticles[i];
      mp.life -= dt;
      mp.vy -= 15.5 * dt;
      mp.mesh.position.x += mp.vx * dt;
      mp.mesh.position.y += mp.vy * dt;
      mp.mesh.position.z += mp.vz * dt;
      if(mp.life <= 0){
        CH3D.parkGroup.remove(mp.mesh);
        CH3D.mudParticles.splice(i, 1);
      }
    }
  }

  //Plenty of off-road wheel torque so the truck NEVER gets sluggish or stuck in grass!
  const towing = !!CH3D.hitchedTrailer;
  const towSpdMult = towing ? (CH3D.lowGear ? 0.82 : 0.76) : 1.0;
  const towAccMult = towing ? ((CH3D.lowGear && CH3D.fourWD) ? 1.20 : 0.75) : 1.0;

  const nitroMult  = inp.nitro ? 1.68 : 1.0;
  const lowMultSpd = CH3D.lowGear ? 0.68 : 1.0;
  const lowMultAcc = CH3D.lowGear ? 2.15 : 1.0;
  const fourMult   = CH3D.fourWD  ? 1.28 : 0.92;
  const diffMult   = CH3D.diffLock? 1.22 : 1.0;

  const maxSpd = (16.5 + st.speed * 0.075) * lowMultSpd * nitroMult * mudDrag * towSpdMult * (laws.speedMult||1.0);
  const accel  = (18.5 + st.power * 0.095) * lowMultAcc * fourMult * diffMult * nitroMult * towAccMult * (laws.speedMult||1.0);

  if(inp.gas || inp.nitro) CH3D.speed += accel * dt;
  else if(inp.rev) CH3D.speed -= accel * 0.88 * dt;
  else CH3D.speed *= (1 - (inMud ? 3.5 : 1.8) * dt);

  if(CH3D.winchActive){
    const ax = CH3D.anchorPos.x - CH3D.x, az = CH3D.anchorPos.z - CH3D.z;
    const adist = Math.hypot(ax, az);
    if(adist > 2.0){
      CH3D.x += (ax / adist) * 8.5 * dt;
      CH3D.z += (az / adist) * 8.5 * dt;
      CH3D.heading = Math.atan2(-az, ax);
    } else {
      CH3D.winchActive = false;
      CH3D.winchLine.visible = false;
      const bw = $("#btn_winch"); if(bw){ bw.textContent="🪝 WINCH"; bw.style.background="rgba(226,59,59,.88)"; }
      showMsg("✅ WINCH RECOVERY COMPLETE!", 900);
    }
    const posArr = CH3D.winchLine.geometry.attributes.position;
    posArr.setXYZ(0, CH3D.x + Math.cos(CH3D.heading)*2.1, CH3D.y + 0.85, CH3D.z - Math.sin(CH3D.heading)*2.1);
    posArr.setXYZ(1, CH3D.anchorPos.x, CH3D.anchorPos.y, CH3D.anchorPos.z);
    posArr.needsUpdate = true;
  }

  CH3D.speed = Math.max(-maxSpd*0.55, Math.min(maxSpd, CH3D.speed));
  const mphVal = Math.round(Math.abs(CH3D.speed) * 3.6);
  const mphEl = $("#ch3dmph");
  if(mphEl) mphEl.textContent = mphVal;
  const gearEl = $("#ch3dgear");
  if(gearEl){
    const gNum = CH3D.speed < -0.5 ? "R" : ("G" + Math.min(6, Math.max(1, Math.ceil(mphVal / 14))));
    gearEl.textContent = gNum;
  }

  const steerLimit = CH3D.diffLock ? 0.44 : 0.58;
  const targetSteer = (inp.left ? steerLimit : 0) + (inp.right ? -steerLimit : 0);
  CH3D.steer += (targetSteer - CH3D.steer) * Math.min(1, dt * 10);

  if(Math.abs(CH3D.speed) > 0.15){
    CH3D.heading += CH3D.steer * (CH3D.speed / Math.max(8, maxSpd)) * 2.2 * dt;
  }

  const prevY = CH3D.y;
  let nextX = CH3D.x;
  let nextZ = CH3D.z;
  const totalStepDist = Math.abs(CH3D.speed) * dt;
  const numSubSteps = Math.max(2, Math.min(8, Math.ceil(totalStepDist / 0.45)));
  const subDt = dt / numSubSteps;

  for(let sub=0; sub<numSubSteps; sub++){
    nextX += Math.cos(CH3D.heading) * CH3D.speed * subDt;
    nextZ -= Math.sin(CH3D.heading) * CH3D.speed * subDt;

    // 1. SOFT TREE LEAVES + HARD TREE TRUNK COLLISIONS!
    if(CH3D.trees){
      for(const tr of CH3D.trees){
        const dx = nextX - tr.x, dz = nextZ - tr.z;
        const dist = Math.hypot(dx, dz);
        const hardMin = 1.15 + tr.trunkR; // Hard wooden trunk stem
        const softMax = 1.35 + tr.leafR;  // Soft outer green pine branches/leaves
        if(dist < hardMin && dist > 0.001){
          const nx = dx / dist, nz = dz / dist;
          nextX = tr.x + nx * (hardMin + 0.06);
          nextZ = tr.z + nz * (hardMin + 0.06);
          if(Math.abs(CH3D.speed) > 3.2){
            SFX.crash(); CH3D.shakeTime = 0.22;
            showMsg("💥 Hit Solid Tree Trunk!", 650);
          }
          CH3D.speed *= -0.25;
        } else if(dist < softMax){
          tr.sway = 0.35;
        }
      }
    }

    // 2. SOLID FENCES, POSTS, ROCKS, BOULDERS & VIADUCT COLUMNS
    const truckR = 1.45;
    for(const ob of CH3D.obstacleColliders){
      const dx = nextX - ob.x, dz = nextZ - ob.z;
      const dist = Math.hypot(dx, dz), minD = truckR + ob.r;
      if(dist < minD && dist > 0.001){
        const nx = dx / dist, nz = dz / dist;
        nextX = ob.x + nx * (minD + 0.06);
        nextZ = ob.z + nz * (minD + 0.06);
        if(Math.abs(CH3D.speed) > 3.0){
          SFX.crash();
          CH3D.shakeTime = 0.24;
          CH3D.vCfg.condition = Math.max(25, (CH3D.vCfg.condition||100) - 2);
          cfg(CH3D.vType).condition = CH3D.vCfg.condition;
          const hpEl = $("#ch3dhp"); if(hpEl) hpEl.textContent = Math.round(CH3D.vCfg.condition) + "%";
          showMsg(`💥 Stopped by ${ob.label}!`, 700);
        }
        CH3D.speed *= -0.25;
      }
    }

    // 3. SOLID TOWN BUILDINGS, CONTINUOUS RANCH FENCES, CAR WASH WALLS, GAS PUMPS & WATER TOWER (Oriented Box Colliders!)
    if(CH3D.boxColliders){
      for(const bc of CH3D.boxColliders){
        const dx = nextX - bc.cx, dz = nextZ - bc.cz;
        const lx =  dx * bc.cos - dz * bc.sin;
        const lz =  dx * bc.sin + dz * bc.cos;
        const padX = bc.hx + 1.35, padZ = bc.hz + 1.35;
        if(Math.abs(lx) < padX && Math.abs(lz) < padZ){
          const penX = padX - Math.abs(lx);
          const penZ = padZ - Math.abs(lz);
          let nlx = lx, nlz = lz;
          if(penX < penZ) nlx = (lx >= 0 ? padX + 0.06 : -padX - 0.06);
          else            nlz = (lz >= 0 ? padZ + 0.06 : -padZ - 0.06);
          nextX = bc.cx + nlx * bc.cos + nlz * bc.sin;
          nextZ = bc.cz - nlx * bc.sin + nlz * bc.cos;
          if(Math.abs(CH3D.speed) > 3.0){
            SFX.crash(); CH3D.shakeTime = 0.24;
            showMsg(`💥 Stopped by ${bc.label}!`, 700);
          }
          CH3D.speed *= -0.20;
        }
      }
    }

    // 4. SOLID UNHITCHED TRAILERS (Bulldozer Flatbed & Barn-Find Wreck Dolly — Cannot ghost through parked trailers!)
    if(CH3D.trailers){
      for(const tr of CH3D.trailers){
        if(tr.delivered || CH3D.hitchedTrailer === tr) continue;
        const c = Math.cos(tr.heading || 0), s = Math.sin(tr.heading || 0);
        const tcx = tr.x - c * 2.1, tcz = tr.z + s * 2.1;
        const dx = nextX - tcx, dz = nextZ - tcz;
        const lx =  dx * c - dz * s;
        const lz =  dx * s + dz * c;
        const padX = 2.95, padZ = 1.95;
        if(Math.abs(lx) < padX && Math.abs(lz) < padZ){
          const penX = padX - Math.abs(lx);
          const penZ = padZ - Math.abs(lz);
          let nlx = lx, nlz = lz;
          if(penX < penZ) nlx = (lx >= 0 ? padX + 0.06 : -padX - 0.06);
          else            nlz = (lz >= 0 ? padZ + 0.06 : -padZ - 0.06);
          nextX = tcx + nlx * c + nlz * s;
          nextZ = tcz - nlx * s + nlz * c;
          if(Math.abs(CH3D.speed) > 2.5){
            SFX.crash(); CH3D.shakeTime = 0.20;
            showMsg(`💥 Stopped by ${tr.title} — Tap 🪝 Hitch Load!`, 950);
          }
          CH3D.speed *= -0.20;
        }
      }
    }

    // 5. RAMP SIDE-WALL & ONE-WAY BACK-WALL PROTECTION (Climb up the slope, never clip through vertical sides/backs!)
    if(CH3D.analyticRamps){
      for(const r of CH3D.analyticRamps){
        const dx = nextX - r.x, dz = nextZ - r.z;
        const lx =  dx * r.cos - dz * r.sin;
        const lz =  dx * r.sin + dz * r.cos;
        if(Math.abs(lx) < r.halfL * 0.96 && Math.abs(lz) > r.halfW - 0.25 && Math.abs(lz) < r.halfW + 1.20){
          if(CH3D.y < r.baseY + 0.48){
            const pushedLz = lz >= 0 ? (r.halfW + 1.22) : -(r.halfW + 1.22);
            nextX = r.x + lx * r.cos + pushedLz * r.sin;
            nextZ = r.z - lx * r.sin + pushedLz * r.cos;
            CH3D.speed *= 0.45;
          }
        }
        if(!r.tabletop && Math.abs(lz) < r.halfW + 0.8 && lx > r.halfL * 0.75 && lx < r.halfL + 1.25){
          if(CH3D.y < r.baseY + r.h - 0.55){
            const pushedLx = r.halfL + 1.28;
            nextX = r.x + pushedLx * r.cos + lz * r.sin;
            nextZ = r.z - pushedLx * r.sin + lz * r.cos;
            CH3D.speed *= -0.25;
          }
        }
      }
    }
  }

  // Update tree leaf sway animation once per frame
  if(CH3D.trees){
    for(const tr of CH3D.trees){
      if(tr.sway > 0 && tr.leafGrp){
        tr.sway = Math.max(0, tr.sway - rawDt);
        tr.leafGrp.rotation.z = Math.sin(now*0.035) * tr.sway * 0.32;
        tr.leafGrp.rotation.x = Math.cos(now*0.028) * tr.sway * 0.25;
      } else if(tr.leafGrp){
        tr.leafGrp.rotation.z = 0; tr.leafGrp.rotation.x = 0;
      }
    }
  }

  // 5. STEP & COLLIDE WITH LIVE AI RIVAL 4x4 TRUCKS!
  CH3D.rivals.forEach(rv=>{
    if(rv.crown) rv.crown.rotation.y += rawDt * 2.5;
    if(rv.hitCooldown > 0) rv.hitCooldown -= rawDt;
    if(!rv.wrecked){
      const targetWp = rv.wps[rv.wpIdx % rv.wps.length];
      const dx = targetWp[0] - rv.x, dz = targetWp[1] - rv.z;
      const distWp = Math.hypot(dx, dz);
      if(distWp < 5.5){
        rv.wpIdx = (rv.wpIdx + 1) % rv.wps.length;
      } else {
        const desiredH = Math.atan2(-dz, dx);
        let diffH = desiredH - rv.heading;
        while(diffH > Math.PI) diffH -= Math.PI*2;
        while(diffH < -Math.PI) diffH += Math.PI*2;
        rv.heading += Math.max(-2.4*dt, Math.min(2.4*dt, diffH));
      }
      rv.x += Math.cos(rv.heading) * rv.speed * dt;
      rv.z -= Math.sin(rv.heading) * rv.speed * dt;
      rv.y = getExactTerrainHeight(ch.mode, rv.x, rv.z);
      rv.grp.position.set(rv.x, rv.y, rv.z);
      rv.grp.rotation.y = rv.heading;
      rv.wheels.forEach(w=>{ w.rotation.z -= rv.speed * 1.8 * dt; });
    }

    const rdx = nextX - rv.x, rdz = nextZ - rv.z;
    const rdist = Math.hypot(rdx, rdz);
    if(rdist < 3.4 && rdist > 0.001){
      const nx = rdx / rdist, nz = rdz / rdist;
      nextX = rv.x + nx * 3.48;
      nextZ = rv.z + nz * 3.48;
      const relSpd = Math.abs(CH3D.speed) + (rv.wrecked ? 0 : rv.speed*0.4);
      if(relSpd > 4.5 && rv.hitCooldown <= 0 && !rv.wrecked){
        rv.hitCooldown = 0.55;
        const dmg = Math.round(28 + relSpd * 1.8);
        rv.hp = Math.max(0, rv.hp - dmg);
        rv.hpFg.scale.z = Math.max(0.01, rv.hp / rv.maxHp);
        rv.x -= nx * 1.6; rv.z -= nz * 1.6;
        SFX.crash();
        CH3D.shakeTime = 0.32;
        CH3D.speed *= 0.45;
        if(rv.hp <= 0){
          rv.wrecked = true;
          rv.grp.rotation.x = 0.35;
          rv.grp.rotation.z = 0.22;
          CH3D.wrecksCount = (CH3D.wrecksCount||0) + 1;
          state.rivalsWrecked = (state.rivalsWrecked||0) + 1;
          CH3D.coins += 75; addCoins(75); addXP(45); SFX.level(); confettiBurst(); save();
          $("#ch3dcoins").textContent = CH3D.coins;
          showMsg(`💥 WRECKED ${rv.name}! +🪙75 DERBY BOUNTY!`, 1600);
        } else {
          showMsg(`💥 RAMMED ${rv.name}! (-${dmg} HP)`, 850);
        }
      }
    }
  });

  // NO BARRIERS EVER! Smooth open greenland movement (soft wrap only at ±1,150m edge of 2,400m mesh)
  CH3D.x = Math.max(-1150, Math.min(1150, nextX));
  CH3D.z = Math.max(-1150, Math.min(1150, nextZ));
  CH3D.wheelSpin = (CH3D.wheelSpin + CH3D.speed * 2.1 * dt) % (Math.PI * 2);

  // 4-Wheel Exact Barycentric Terrain + Analytic Ramp Height Sampling + Mud Sinking!
  CH3D.onRampThisFrame = false;
  const chCos = Math.cos(CH3D.heading), chSin = Math.sin(CH3D.heading);
  const wWorld = (lx, lz)=>[CH3D.x + lx*chCos + lz*chSin, CH3D.z - lx*chSin + lz*chCos];
  const pFL = wWorld( 1.42, -0.98), pFR = wWorld( 1.42,  0.98);
  const pRL = wWorld(-1.42, -0.98), pRR = wWorld(-1.42,  0.98);
  const hFL = sampleWheelHeight3D(ch.mode, pFL[0], pFL[1]);
  const hFR = sampleWheelHeight3D(ch.mode, pFR[0], pFR[1]);
  const hRL = sampleWheelHeight3D(ch.mode, pRL[0], pRL[1]);
  const hRR = sampleWheelHeight3D(ch.mode, pRR[0], pRR[1]);
  const hCenter = sampleWheelHeight3D(ch.mode, CH3D.x, CH3D.z);

  const wheelAvgH = (hFL + hFR + hRL + hRR) * 0.25;
  const groundH = Math.max(wheelAvgH, hCenter - 0.02) + (CH3D.mudSink || 0);
  const rawPitch = Math.atan2(((hFL+hFR)*0.5) - ((hRL+hRR)*0.5), 2.84);
  // Correct right-hand-rule roll sign around local +X: positive rotation.x lifts -Z (Left) and lowers +Z (Right),
  // so rawRoll MUST be atan2(hLeft - hRight, trackWidth) so the car tilts WITH the ground slope instead of opposite!
  const rawRoll  = Math.atan2(((hFL+hRL)*0.5) - ((hFR+hRR)*0.5), 1.96);
  const targetPitch = CH3D.onRampThisFrame ? Math.max(-0.42, Math.min(0.42, rawPitch)) : Math.max(-0.18, Math.min(0.18, rawPitch * 0.75));
  const targetRoll  = CH3D.onRampThisFrame ? Math.max(-0.28, Math.min(0.28, rawRoll))  : Math.max(-0.10, Math.min(0.10, rawRoll  * 0.50));

  if(!CH3D.airborne){
    if(CH3D.wasOnRamp && !CH3D.onRampThisFrame && Math.abs(CH3D.speed) > 7.5){
      CH3D.airborne = true;
      CH3D.vy = Math.max(4.8, Math.abs(CH3D.speed) * Math.max(0.24, Math.sin(Math.max(0.20, CH3D.pitch))) * 1.18);
      CH3D.jumpStartPos = {x:CH3D.x, z:CH3D.z};
    } else if(prevY - groundH > 0.65 && Math.abs(CH3D.speed) > 11.0){
      CH3D.airborne = true;
      CH3D.vy = 1.5;
      CH3D.jumpStartPos = {x:CH3D.x, z:CH3D.z};
    } else {
      CH3D.y = groundH;
      CH3D.vy = 0;
    }
  }
  CH3D.wasOnRamp = CH3D.onRampThisFrame;

  if(CH3D.airborne){
    CH3D.vy -= 21.0 * (laws.gravity||1.0) * dt;
    CH3D.y  += CH3D.vy * dt;
    CH3D.pitch *= (1 - 1.2*dt);
    if(CH3D.y <= groundH){
      CH3D.y = groundH;
      CH3D.vy = 0;
      CH3D.airborne = false;
      if(CH3D.jumpStartPos){
        const jumpFt = Math.round(Math.hypot(CH3D.x - CH3D.jumpStartPos.x, CH3D.z - CH3D.jumpStartPos.z) * 3.28);
        if(jumpFt >= 18){
          const bonus = Math.min(80, Math.round(jumpFt * 0.6));
          CH3D.coins += bonus; addCoins(bonus); addXP(15); SFX.coin();
          $("#ch3dcoins").textContent = CH3D.coins;
          showMsg(`🚀 ${jumpFt} FT BIG AIR JUMP! +🪙${bonus}`, 1300);
        }
        CH3D.jumpStartPos = null;
      }
    }
  } else {
    CH3D.y = groundH;
    CH3D.pitch += (targetPitch - CH3D.pitch) * Math.min(1, rawDt * 14);
    CH3D.roll  += (targetRoll  - CH3D.roll)  * Math.min(1, rawDt * 14);
  }
  if(CH3D.y < groundH) CH3D.y = groundH;

  CH3D.carHolder.position.set(CH3D.x, CH3D.y, CH3D.z);
  CH3D.carHolder.rotation.order = "YZX";
  CH3D.carHolder.rotation.y = CH3D.heading;
  CH3D.carHolder.rotation.z = CH3D.pitch;
  CH3D.carHolder.rotation.x = CH3D.roll;

  const rig = CH3D.carHolder.userData && CH3D.carHolder.userData.rig;
  if(rig){
    const vibe = (!CH3D.airborne && Math.abs(CH3D.speed) > 0.5) ? Math.sin(now*0.018)*0.018 : 0;
    const fTrav = CH3D.airborne ? -0.10 : vibe;
    const rTrav = CH3D.airborne ? -0.10 : -vibe;
    const axleTwist = CH3D.airborne ? 0 : Math.max(-0.14, Math.min(0.14, ((hFR - hFL) - (hRR - hRL))*0.35));
    applyRiggedPose(rig, CH3D.steer, CH3D.wheelSpin, fTrav, rTrav, axleTwist, !!CH3D.vCfg.lift);
  }

  // STEP ARTICULATED 3D TRAILER HITCH & DELIVERY DROP ZONE!
  if(CH3D.hitchedTrailer){
    const tr = CH3D.hitchedTrailer;
    const hitchX = CH3D.x - Math.cos(CH3D.heading)*2.25;
    const hitchZ = CH3D.z + Math.sin(CH3D.heading)*2.25;
    const hitchY = getExactTerrainHeight(ch.mode, hitchX, hitchZ);
    const drawbarLen = 3.2;
    const angDiff = CH3D.heading - tr.heading;
    tr.heading += Math.sin(angDiff) * (CH3D.speed / drawbarLen) * dt;
    tr.x = hitchX; tr.z = hitchZ; tr.y = hitchY;
    const rearX = hitchX - Math.cos(tr.heading)*2.9;
    const rearZ = hitchZ + Math.sin(tr.heading)*2.9;
    const rearY = getExactTerrainHeight(ch.mode, rearX, rearZ);
    tr.pitch = Math.atan2(hitchY - rearY, 2.9);

    tr.grp.position.set(tr.x, tr.y, tr.z);
    tr.grp.rotation.order = "YXZ";
    tr.grp.rotation.y = tr.heading;
    tr.grp.rotation.z = tr.pitch;
    tr.wheels.forEach(w=>{ w.rotation.z -= CH3D.speed * 2.2 * dt; });

    CH3D.arrowGrp.visible = true;
    CH3D.arrowGrp.position.set(CH3D.x, CH3D.y + 2.55 + Math.sin(now*0.005)*0.12, CH3D.z);
    CH3D.arrowGrp.rotation.y = Math.atan2(-(CH3D.dropZonePos.z - CH3D.z), CH3D.dropZonePos.x - CH3D.x);

    if(Math.hypot(CH3D.x - CH3D.dropZonePos.x, CH3D.z - CH3D.dropZonePos.z) < 5.5){
      tr.delivered = true;
      tr.grp.visible = false;
      CH3D.hitchedTrailer = null;
      state.haulsDone = (state.haulsDone||0) + 1;
      CH3D.coins += tr.reward; addCoins(tr.reward); addXP(65); SFX.level(); confettiBurst();
      if(tr.id === "barnwreck"){
        state.barnStep = Math.max(2, state.barnStep || 2);
      }
      save();
      const hb = $("#btn_hitch"); if(hb){ hb.textContent = "🪝 Hitch Load"; hb.style.background = "rgba(0,229,255,.90)"; }
      $("#ch3dcoins").textContent = CH3D.coins;
      const mEl = $("#ch3dmission");
      if(mEl) mEl.textContent = `🏆 DELIVERED ${tr.title}! +🪙${tr.reward} Earned!`;
      showMsg(`🏆 HEAVY HAUL DELIVERED! +🪙${tr.reward} · +⭐65 XP!`, 1800);
    }
  } else if(CH3D.bossRace && CH3D.bossRace.active){
    const br = CH3D.bossRace;
    const curGate = br.gates[br.gateIdx];
    if(curGate){
      CH3D.arrowGrp.visible = true;
      CH3D.arrowGrp.position.set(CH3D.x, CH3D.y + 2.55, CH3D.z);
      CH3D.arrowGrp.rotation.y = Math.atan2(-(curGate.z - CH3D.z), curGate.x - CH3D.x);
      if(Math.hypot(CH3D.x - curGate.x, CH3D.z - curGate.z) < 5.0){
        curGate.cleared = true;
        curGate.mesh.visible = false;
        br.gateIdx++;
        SFX.coin();
        if(br.gateIdx >= br.gates.length){
          br.active = false;
          state.bossesBeaten = (state.bossesBeaten||0) + 1;
          CH3D.coins += 250; addCoins(250); addXP(100); SFX.level(); confettiBurst(); save();
          $("#ch3dcoins").textContent = CH3D.coins;
          const mEl = $("#ch3dmission");
          if(mEl) mEl.textContent = "🏆 BOSS DEFEATED! You Beat 👑 Redneck Rammer (+🪙250)!";
          showMsg("🏆 PINK-SLIP BOSS RACE WON! +🪙250 · +⭐100 XP!", 2000);
        } else {
          const mEl = $("#ch3dmission");
          if(mEl) mEl.textContent = `🏁 BOSS RACE: Gate ${br.gateIdx+1}/${br.gates.length}! Keep Hammering!`;
          showMsg(`🏁 GATE ${br.gateIdx}/${br.gates.length} CLEARED!`, 750);
        }
      }
    }
  } else if(CH3D.trackGates && CH3D.trackGates.length){
    // Point 3D Green Guide Arrow to the Next Gate on the Dirt Track Loop (or nearest gate if off-track)!
    const tg = CH3D.trackGates[CH3D.trackIdx % CH3D.trackGates.length];
    if(tg){
      CH3D.arrowGrp.visible = true;
      CH3D.arrowGrp.position.set(CH3D.x, CH3D.y + 2.55 + Math.sin(now*0.005)*0.12, CH3D.z);
      CH3D.arrowGrp.rotation.y = Math.atan2(-(tg.z - CH3D.z), tg.x - CH3D.x);
      if(Math.hypot(CH3D.x - tg.x, CH3D.z - tg.z) < 8.5){
        CH3D.trackIdx = (CH3D.trackIdx + 1) % CH3D.trackGates.length;
        CH3D.coins += 15; addCoins(15);
        $("#ch3dcoins").textContent = CH3D.coins;
        const lEl = $("#ch3dlap");
        if(lEl) lEl.textContent = `${CH3D.trackIdx}/${CH3D.trackGates.length}`;
        if(CH3D.trackIdx === 0){
          CH3D.lapsDone = (CH3D.lapsDone||0) + 1;
          addCoins(100); addXP(50); SFX.level();
          showMsg(`🏁 FULL TRACK LAP ${CH3D.lapsDone} COMPLETE! +🪙100`, 1500);
        } else {
          showMsg(`🚩 TRACK CHECKPOINT ${CH3D.trackIdx}/${CH3D.trackGates.length}! +🪙15`, 700);
        }
      }
    }
  }

  // Smashable Crates Physics
  CH3D.smashables.forEach(sm=>{
    if(!sm.hit){
      if(Math.hypot(CH3D.x - sm.x, CH3D.z - sm.z) < 2.35){
        sm.hit = true;
        CH3D.speed *= 0.80; CH3D.shakeTime = 0.15; SFX.crash();
        sm.vx = Math.cos(CH3D.heading) * Math.max(8, Math.abs(CH3D.speed)*1.2) + (Math.random()-0.5)*4;
        sm.vz = -Math.sin(CH3D.heading) * Math.max(8, Math.abs(CH3D.speed)*1.2) + (Math.random()-0.5)*4;
        sm.vy = 6.5 + Math.random()*3.5;
        CH3D.coins += 15; addCoins(15); addXP(10); SFX.buy();
        $("#ch3dcoins").textContent = CH3D.coins;
        showMsg(`💥 ${sm.label} SMASHED! +🪙15`, 850);
      }
    } else if(sm.mesh.visible){
      sm.vy -= 19.0 * dt;
      sm.mesh.position.x += sm.vx * dt;
      sm.mesh.position.y += sm.vy * dt;
      sm.mesh.position.z += sm.vz * dt;
      sm.mesh.rotation.x += 5.0 * dt;
      sm.mesh.rotation.z += 4.0 * dt;
      if(sm.mesh.position.y < -4.0) sm.mesh.visible = false;
    }
  });

  // Crush Cars Flattening when driven over!
  CH3D.crushCars.forEach(cc=>{
    if(!cc.crushed && Math.hypot(CH3D.x - cc.x, CH3D.z - cc.z) < 2.65){
      cc.crushed = true;
      cc.mesh.scale.y = 0.38;
      cc.mesh.position.y -= 0.26;
      if(cc.rampRef) cc.rampRef.h = 0.32;
      cc.mesh.updateMatrixWorld(true);
      CH3D.coins += 20; addCoins(20); addXP(15); SFX.crash();
      $("#ch3dcoins").textContent = CH3D.coins;
      showMsg("🚗 MONSTER CAR CRUSH! +🪙20", 950);
    }
  });

  // 5 CAMERA MODES + SCROLL/PINCH/BUTTON ZOOM OUT TO TOTAL FIELD & TRACK OVERVIEW!
  const zm = CH3D.camZoom || 1.0;
  let tx, ty, tz, lookX, lookY, lookZ;
  if(CH3D.camMode === 2 || zm > 4.5){
    // Mode 2: Bird's-Eye Total Field, Track & Old-School Town Overview!
    const overviewH = Math.max(48, zm * 9.5);
    const overviewBack = Math.max(35, zm * 5.2);
    tx = CH3D.x - Math.cos(CH3D.heading) * overviewBack;
    tz = CH3D.z + Math.sin(CH3D.heading) * overviewBack;
    ty = CH3D.y + overviewH;
    lookX = CH3D.x + Math.cos(CH3D.heading)*18;
    lookY = CH3D.y;
    lookZ = CH3D.z - Math.sin(CH3D.heading)*18;
  } else if(CH3D.camMode === 3){
    // Mode 3: Side Mud & Ramp Crawler Profile View!
    const sideDist = 6.8 * zm;
    tx = CH3D.x + Math.sin(CH3D.heading) * sideDist;
    tz = CH3D.z + Math.cos(CH3D.heading) * sideDist;
    ty = CH3D.y + 1.85 * zm;
    lookX = CH3D.x; lookY = CH3D.y + 0.65; lookZ = CH3D.z;
  } else if(CH3D.camMode === 4){
    // Mode 4: First-Person Hood / Cockpit View!
    tx = CH3D.x + Math.cos(CH3D.heading) * 0.45;
    tz = CH3D.z - Math.sin(CH3D.heading) * 0.45;
    ty = CH3D.y + 1.45;
    lookX = CH3D.x + Math.cos(CH3D.heading) * 18.0;
    lookY = CH3D.y + 1.1;
    lookZ = CH3D.z - Math.sin(CH3D.heading) * 18.0;
  } else {
    // Mode 0 (Chase Close) & Mode 1 (Chase Wide)
    const baseDist = (CH3D.camMode === 1 ? 11.5 : (towing ? 10.2 : 7.8)) * zm;
    const baseH    = (CH3D.camMode === 1 ? 4.6  : (towing ? 3.8  : 3.1)) * zm;
    tx = CH3D.x - Math.cos(CH3D.heading) * baseDist;
    tz = CH3D.z + Math.sin(CH3D.heading) * baseDist;
    const camGroundH = getExactTerrainHeight(ch.mode, tx, tz);
    const midGroundH = getExactTerrainHeight(ch.mode, (CH3D.x+tx)*0.5, (CH3D.z+tz)*0.5);
    ty = Math.max(CH3D.y + baseH, camGroundH + 2.2, midGroundH + 2.0);
    lookX = CH3D.x + Math.cos(CH3D.heading)*2.2;
    lookY = CH3D.y + 0.95;
    lookZ = CH3D.z - Math.sin(CH3D.heading)*2.2;
  }

  CH3D.camera.position.x += (tx - CH3D.camera.position.x) * Math.min(1, rawDt * 9);
  CH3D.camera.position.z += (tz - CH3D.camera.position.z) * Math.min(1, rawDt * 9);
  CH3D.camera.position.y += (ty - CH3D.camera.position.y) * Math.min(1, rawDt * 9);
  const curCamGnd = getExactTerrainHeight(ch.mode, CH3D.camera.position.x, CH3D.camera.position.z);
  if(CH3D.camera.position.y < curCamGnd + 1.5) CH3D.camera.position.y = curCamGnd + 1.5;

  if(CH3D.shakeTime > 0){
    CH3D.shakeTime -= rawDt;
    CH3D.camera.position.x += (Math.random()-0.5)*0.35;
    CH3D.camera.position.y += (Math.random()-0.5)*0.35;
  }
  CH3D.camera.lookAt(lookX, lookY, lookZ);

  drawLiveMinimap(ch.mode);
  CH3D.renderer.render(CH3D.scene, CH3D.camera);
}


let _bkd=null,_bku=null;
function bindBattleInput(){
  const hook=(id,pi,key)=>{ const b=$(id); if(!b) return;
    b.onpointerdown=e=>{ e.preventDefault(); if(BATTLE) BATTLE.input[pi][key]=true; };
    b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{ if(BATTLE) BATTLE.input[pi][key]=false; }; };
  hook("#b1f",0,"f"); hook("#b1b",0,"b"); hook("#b2f",1,"f"); hook("#b2b",1,"b");
  _bkd=e=>{ if(!BATTLE) return;
    if(e.key==="d"||e.key==="D"){ BATTLE.input[0].f=true; e.preventDefault(); }
    if(e.key==="a"||e.key==="A"){ BATTLE.input[0].b=true; e.preventDefault(); }
    if(e.key==="ArrowLeft"){ BATTLE.input[1].f=true; e.preventDefault(); }
    if(e.key==="ArrowRight"){ BATTLE.input[1].b=true; e.preventDefault(); } };
  _bku=e=>{ if(!BATTLE) return;
    if(e.key==="d"||e.key==="D") BATTLE.input[0].f=false;
    if(e.key==="a"||e.key==="A") BATTLE.input[0].b=false;
    if(e.key==="ArrowLeft") BATTLE.input[1].f=false;
    if(e.key==="ArrowRight") BATTLE.input[1].b=false; };
  document.addEventListener("keydown",_bkd);
  document.addEventListener("keyup",_bku);
}
function unbindBattleInput(){
  if(_bkd) document.removeEventListener("keydown",_bkd);
  if(_bku) document.removeEventListener("keyup",_bku);
  _bkd=_bku=null;
}

function bVel(c){
  if(c.grounded){ const a=bSlope(c.x); return {x:c.speed*Math.cos(a), y:c.speed*Math.sin(a)}; }
  return {x:c.vx, y:c.vy};
}

function stepBattle(dt){
  const B=BATTLE; if(!B) return;
  if(B.phase==="count"){
    if(performance.now()-B.phaseT>=2400) B.phase="play";
    return;
  }
  const play=B.phase==="play";
  B.cars.forEach((c,i)=>{
    if(c.ko) return;
    const inp=play?B.input[i]:{f:false,b:false};
    if(c.grounded){
      const a=bSlope(c.x);
      c.speed += (inp.f?BT.ACCEL*c.dir:0)*dt;
      c.speed -= (inp.b?BT.ACCEL*0.7*c.dir:0)*dt;
      c.speed += BT.GSLOPE*Math.sin(a)*dt;          // bowl walls roll you back in
      c.speed -= c.speed*BT.FRICT*dt;
      c.speed=Math.max(-BT.MAX,Math.min(BT.MAX,c.speed));
      c.x += c.speed*Math.cos(a)*dt;
      c.y=bY(c.x); c.angle=bSlope(c.x);
    } else {
      c.vy += BT.G*dt;
      c.x += c.vx*dt; c.y += c.vy*dt;
      c.angVel *= (1-0.04*dt);
      c.angle += c.angVel*dt;
      const g=bY(c.x);
      if(c.y>=g){                                    // landed
        const ga=bSlope(c.x);
        let diff=c.angle-ga;
        while(diff>Math.PI) diff-=2*Math.PI;
        while(diff<-Math.PI) diff+=2*Math.PI;
        if(!play || Math.abs(diff)<BT.KO_TILT){
          c.grounded=true; c.y=g; c.angle=ga; c.speed=c.vx; c.angVel=0;
        } else {                                     // landed on the roof
          c.ko=true; SFX.crash(); battleRoundOver(1-i);
        }
      }
    }
    if(play && Math.abs(c.x)>760 && !c.ko){ c.ko=true; battleRoundOver(1-i); }
  });
  if(play){ battleCollide(); battleHeadCheck(); }
}

function battleCollide(){
  const B=BATTLE, c1=B.cars[0], c2=B.cars[1];
  if(c1.ko||c2.ko) return;
  const d1=carDims(c1.type), d2=carDims(c2.type);
  const r1=d1.bw*0.42, r2=d2.bw*0.42;
  const dx=c2.x-c1.x, dy=(c2.y-28)-(c1.y-28);
  const dist=Math.hypot(dx,dy), min=r1+r2;
  if(dist>=min||dist===0) return;
  const nx=dx/dist, ny=dy/dist;
  const m1=c1.mass, m2=c2.mass, tot=m1+m2;
  // push apart (heavier car budges less)
  const push=(min-dist)+2;
  c1.x -= nx*push*(m2/tot); c2.x += nx*push*(m1/tot);
  const v1=bVel(c1), v2=bVel(c2);
  const rel=(v1.x-v2.x)*nx+(v1.y-v2.y)*ny;           // closing speed along normal
  if(rel>60){                                         // real bonk -> both go flying
    const e=0.75, j=(1+e)*rel/(1/m1+1/m2);
    const pop=Math.min(430, 90+rel*0.5);
    c1.grounded=false; c1.vx=v1.x-j*nx/m1; c1.vy=Math.min(v1.y,0)-pop*(m2/tot)*1.7;
    c2.grounded=false; c2.vx=v2.x+j*nx/m2; c2.vy=Math.min(v2.y,0)-pop*(m1/tot)*1.7;
    c1.angVel -= rel*0.004*(m2/tot)*2;
    c2.angVel += rel*0.004*(m1/tot)*2;
    SFX.crash(); showMsg("💥 BONK!",500);
  }
}

// world position of the driver's head (mirrored cars flip local x)
function headPos(c){
  const d=carDims(c.type), sc=c.lift?1.18:1;
  const maxR=Math.max(d.fr*sc,d.rr*sc);
  const top=-(maxR+d.bh*0.5+2)+(c.lift?-8:0)-d.bh/2;
  const px=-d.bw*0.08*c.dir, py=top-16;
  const ca=Math.cos(c.angle), sa=Math.sin(c.angle);
  return [c.x+px*ca-py*sa, c.y+px*sa+py*ca];
}
// world positions of a car's hard points (bumpers, wheels, roof corners)
function carPts(c){
  const d=carDims(c.type), sc=c.lift?1.18:1;
  const fr=d.fr*sc, rr=d.rr*sc, maxR=Math.max(fr,rr);
  const by=-(maxR+d.bh*0.5+2)+(c.lift?-8:0);
  const pts=[[d.bw/2,by],[-d.bw/2,by],[d.dx,-fr],[-d.dx,-rr],
             [d.bw/2,by-d.bh/2],[-d.bw/2,by-d.bh/2]];
  const ca=Math.cos(c.angle), sa=Math.sin(c.angle);
  return pts.map(p=>{ const px=p[0]*c.dir, py=p[1];
    return [c.x+px*ca-py*sa, c.y+px*sa+py*ca]; });
}
function battleHeadCheck(){
  const B=BATTLE, c1=B.cars[0], c2=B.cars[1];
  if(c1.ko||c2.ko) return;
  if(Math.abs(c1.x-c2.x)>200) return;
  const h1=headPos(c1), h2=headPos(c2);
  const R2=BT.HEAD_R*BT.HEAD_R;
  const hit=(pts,h)=>pts.some(p=>{ const dx=p[0]-h[0], dy=p[1]-h[1]; return dx*dx+dy*dy<R2; });
  const p1HitsP2=hit(carPts(c1),h2), p2HitsP1=hit(carPts(c2),h1);
  if(p1HitsP2 && !p2HitsP1){ c2.ko=true; battleRoundOver(0); }
  else if(p2HitsP1 && !p1HitsP2){ c1.ko=true; battleRoundOver(1); }
  // both at once = a clash, play on
}

function battleRoundOver(winnerIdx){
  const B=BATTLE; if(!B||B.phase!=="play") return;
  B.phase="roundend"; B.phaseT=performance.now();
  B.score[winnerIdx]++;
  SFX.coin();
  showMsg((winnerIdx===0?"🔴 P1":"🔵 P2")+" scores! 💥",1300);
  if(B.score[winnerIdx]>=3){ B.over=true; B.winner=winnerIdx; }
}

function battleFrame(t){
  const B=BATTLE; if(!B) return;
  if(!B.last) B.last=t;
  let dt=(t-B.last)/1000; B.last=t; dt=Math.min(dt,0.05);
  B.acc+=dt;
  const STEP=1/120; let guard=0;
  while(B.acc>=STEP && guard++<8){ stepBattle(STEP); B.acc-=STEP; }
  drawBattle();
  if(B.phase==="roundend" && performance.now()-B.phaseT>1500){
    if(B.over){ battleMatchOver(); return; }
    B.cars=[battleCarFor(0),battleCarFor(1)]; B.round++;
    B.phase="count"; B.phaseT=performance.now();
  }
  braf=requestAnimationFrame(battleFrame);
}

function battleMatchOver(){
  const B=BATTLE, w=B.winner, score=B.score.slice();
  stopBattle();
  addCoins(60); addXP(30);
  showModal(`
    <div class="big-emoji">🏆</div>
    <h3>${w===0?"🔴 Player 1":"🔵 Player 2"} wins the battle!</h3>
    <p style="font-size:22px;font-weight:900;margin:2px 0 8px">${score[0]} — ${score[1]}</p>
    <p><span style="color:var(--coin)">+🪙60 · +⭐30 XP</span> for an epic battle!</p>
    <button class="btn green" onclick="battleAgain()">⚔️ Battle again</button>
    <button class="btn gray sm" style="margin-top:8px" onclick="exitDrive()">🔧 Back to Garage</button>`);
}
window.battleAgain=function(){ closeModal(); startBattle(); };

function drawBattleCar(c){
  const ctx=dctx, d=carDims(c.type);
  const sc=c.lift?1.18:1, liftY=c.lift?-8:0;
  const fr=d.fr*sc, rr=d.rr*sc, maxR=Math.max(fr,rr);
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle);
  if(c.dir<0) ctx.scale(-1,1);
  drawWheelC(ctx,-d.dx,-rr,rr,c.rim,c.wheel);
  drawWheelC(ctx, d.dx,-fr,fr,c.rim,c.wheel);
  const by=-(maxR+d.bh*0.5+2)+liftY, top=by-d.bh/2;
  const grad=ctx.createLinearGradient(0,top,0,by+d.bh/2);
  grad.addColorStop(0,shade(c.paint,0.28)); grad.addColorStop(.5,c.paint); grad.addColorStop(1,shade(c.paint,-0.28));
  roundRectPath(-d.bw/2,top,d.bw,d.bh,8);
  ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=shade(c.paint,-0.4); ctx.stroke();
  if(c.type!=="moto"){
    roundRectPath(-d.bw*0.16,top-12,d.bw*0.5,13,4);
    ctx.fillStyle=c.tint?"#33414f":"#bfe6ff"; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(d.bw*0.5-3,by,3,0,7); ctx.fillStyle="#fff3b0"; ctx.fill();
  // the driver's head — this is the target! Helmet = player color.
  ctx.beginPath(); ctx.arc(-d.bw*0.08,top-16,6.5,0,7); ctx.fillStyle="#f1c8a0"; ctx.fill();
  ctx.beginPath(); ctx.arc(-d.bw*0.08,top-18,7.5,Math.PI,2*Math.PI);
  ctx.fillStyle=c.dir>0?"#e23b3b":"#2f8fff"; ctx.fill();
  ctx.restore();
}

function drawBattle(){
  if(!dctx||!dcv||!dcv._w) return;
  const B=BATTLE, W=dcv._w, H=dcv._h;
  const c1=B.cars[0], c2=B.cars[1];
  // sunset arena sky
  const sky=dctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#ffb35a"); sky.addColorStop(.55,"#ffd9a0"); sky.addColorStop(1,"#ffeccd");
  dctx.fillStyle=sky; dctx.fillRect(0,0,W,H);
  // camera: keep both cars in view
  const midX=(c1.x+c2.x)/2, midY=(c1.y+c2.y)/2-60;
  const span=Math.abs(c1.x-c2.x)+460;
  const zoom=Math.min(1.05, W/span);
  dctx.save();
  dctx.translate(W/2,H*0.60); dctx.scale(zoom,zoom); dctx.translate(-midX,-midY);
  const x0=midX-(W/2)/zoom-80, x1=midX+(W/2)/zoom+80;
  dctx.beginPath(); dctx.moveTo(x0,1400);
  for(let x=x0;x<=x1;x+=10) dctx.lineTo(x,bY(x));
  dctx.lineTo(x1,1400); dctx.closePath();
  dctx.fillStyle="#7a5a36"; dctx.fill();
  dctx.beginPath();
  for(let x=x0,f=1;x<=x1;x+=10,f=0){ const y=bY(x); f?dctx.moveTo(x,y):dctx.lineTo(x,y); }
  dctx.lineWidth=7; dctx.strokeStyle="#5fbf4f"; dctx.stroke();
  // center mark
  dctx.font="36px serif"; dctx.textAlign="center";
  dctx.fillText("⚔️", 0, bY(0)-120);
  drawBattleCar(c1); drawBattleCar(c2);
  dctx.restore();
  // countdown
  if(B.phase==="count"){
    const el2=performance.now()-B.phaseT;
    const n=el2<800?"3":el2<1600?"2":"1";
    dctx.save(); dctx.textAlign="center"; dctx.font="900 68px Segoe UI, sans-serif";
    dctx.lineWidth=5; dctx.strokeStyle="rgba(0,0,0,.55)"; dctx.fillStyle="#ffd14d";
    dctx.strokeText(n,W/2,H*0.40); dctx.fillText(n,W/2,H*0.40);
    if(B.round===1){
      dctx.font="800 17px Segoe UI, sans-serif"; dctx.lineWidth=3;
      const tip="Bonk the other driver's HEAD! First to 3 wins";
      dctx.strokeText(tip,W/2,H*0.40+40); dctx.fillStyle="#fff"; dctx.fillText(tip,W/2,H*0.40+40);
    }
    dctx.restore();
  }
  const s1=$("#bs1"), s2=$("#bs2"), rn=$("#brnd");
  if(s1) s1.textContent=B.score[0];
  if(s2) s2.textContent=B.score[1];
  if(rn) rn.textContent=B.round;
}

/* --------------------------- DAILY REWARD --------------------------------
   A once-a-day gift that grows with a consecutive-day streak (caps at day 7).
   Miss a day and the streak starts over. Keeps kids coming back. */
function dayKey(offsetDays){
  const d=new Date(Date.now()+(offsetDays||0)*86400000);
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function dailyCheck(){
  const today=dayKey(0);
  if(state.lastDaily===today) return;
  const kept = state.lastDaily && state.lastDaily===dayKey(-1);   // played yesterday too?
  state.streak = kept ? (state.streak||0)+1 : 1;
  state.lastDaily = today; save();
  const n=Math.min(7,state.streak);
  const coins=25+n*10, xp=10+n*5;
  const days=[1,2,3,4,5,6,7].map(d=>
    `<span style="font-size:20px;opacity:${d<=n?1:0.28}">${d<=n?"🪙":"⚪"}</span>`).join(" ");
  showModal(`
    <div class="big-emoji">🎁</div>
    <h3>Daily Reward!</h3>
    <p>Day <b>${state.streak}</b> in a row${state.streak>1?" — streak bonus!":""}${state.streak>=7?" 🔥 MAX!":""}</p>
    <div style="margin:4px 0 10px">${days}</div>
    <p style="font-size:17px;color:var(--coin);font-weight:900">+🪙${coins} &nbsp; +⭐${xp} XP</p>
    <button class="btn gold" onclick="claimDaily(${coins},${xp})">Claim! 🎉</button>`);
}
window.claimDaily=function(coins,xp){
  closeModal(); SFX.buy(); addCoins(coins); addXP(xp);
  toast("🎁 +🪙"+coins+" +⭐"+xp+" XP — come back tomorrow!");
};

/* ------------------------------- BOOT ------------------------------------ */
function boot(){
  // one-time: force music OFF for existing players (it was annoying); still opt-in via 🎵
  if(state.musicReset!==1){ state.music=false; state.musicReset=1; MUSIC.stop(); save(); }
  refreshTop();
  if(state.music) MUSIC.start();          // only if the player opted in
  setScreen("garage");
  if(state.seenWelcome){
    dailyCheck();                          // returning player -> daily gift
  } else {
    // brand-new player: welcome instead; streak starts tomorrow
    state.lastDaily=dayKey(0); state.streak=1; save();
  }
  if(!state.seenWelcome){
    state.seenWelcome=true; save();
    showModal(`
      <div class="big-emoji">🚜🏗️🛻</div>
      <h3>Welcome to BUILD WORLD!</h3>
      <p style="text-align:left">
        🔧 <b>Garage</b> — pimp out cars, trucks, tractors &amp; bikes.<br>
        🏁 <b>Drive</b> — take your ride off-road, hit ramps &amp; do flips!<br>
        🏗️ <b>Build</b> — design your own farm &amp; town.<br>
        💼 <b>Jobs</b> — earn coins &amp; XP.<br>
        ⭐ <b>Level up</b> to unlock new rides, parts &amp; buildings.<br>
        📤 <b>Share</b> your world with friends!
      </p>
      <button class="btn green" onclick="closeModal()">Let's build! 🚀</button>`);
  }
}
boot();

// Register the service worker so the app installs & works offline
if("serviceWorker" in navigator){
  let _refreshingSW = false;
  const _hadSWController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!_hadSWController || _refreshingSW) return;
    _refreshingSW = true;
    window.location.reload();
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js?v=14").then(function(reg){
      try{ reg.update(); }catch(e){}
      document.addEventListener("visibilitychange", function(){
        if(document.visibilityState === "visible"){ try{ reg.update(); }catch(e){} }
      });
    }).catch(function(){});
  });
}
</script>
