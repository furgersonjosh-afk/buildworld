function startDrive(){
  ended=false; crashed=false; started=false; finished=false; runStart=0; lap=1;
  counting=false; countStart=0; countTick=-1; boostUntil=0;
  coinsRun=0; flipsRun=0; airRot=0; camInit=false;
  if(MP.active) driveTrack="race";      // multiplayer is a race on the same course
  driveCoins=new Set();
  drive.gas=false; drive.brake=false;
  const c=cfg(state.current);
  startX=0;
  car={x:0, y:terrainY(0), vx:0, vy:0, angle:slopeAt(0), angVel:0, speed:0,
       grounded:true, type:state.current, paint:c.paint, wheel:c.wheel,
       rim:c.rim, lift:c.lift, tint:c.tint};
  const st=carStats(state.current,c);                 // build stats -> performance
  driveTune={ accel: 540 + st.power*3.0, maxs: 380 + st.speed*2.2, land: 1.02 + st.grip*0.006 };
  bindDriveInput();
  dlast=0; dacc=0;
  cancelAnimationFrame(draf);
  // wait one frame so the canvas has layout dimensions, then measure + run
  draf=requestAnimationFrame(()=>{
    resizeDriveCanvas();
    const ex=$("#dexit"); if(ex) ex.onclick=()=>setScreen("garage");
    const trkLabel=t=>{ const r=(state.records||{})[t]; return TRACKS[t].name+(r!=null?" · 🏅 best "+r.toFixed(1)+"s":""); };
    const tn=$("#trkname"); if(tn) tn.textContent=trkLabel(driveTrack);
    document.querySelectorAll("[data-track]").forEach(b=>b.onclick=()=>{
      if(started||counting) return;                    // only before you start
      driveTrack=b.dataset.track; SFX.tap();
      car.x=0; startX=0; car.y=terrainY(0); car.angle=slopeAt(0); car.speed=0; camInit=false;
      const t=$("#trkname"); if(t) t.textContent=trkLabel(driveTrack);
    });
    const bb=$("#battlebtn"); if(bb) bb.onclick=()=>{ SFX.tap(); startBattle(); };
    const c3b=$("#chapters3dbtn"); if(c3b) c3b.onclick=()=>{ SFX.tap(); start3DChapterMode(); };
    draf=requestAnimationFrame(driveFrame);
  });
}

function stopDrive(){
  if(draf){ cancelAnimationFrame(draf); draf=null; }
  unbindDriveInput();
  drive.gas=false; drive.brake=false;
}

function resizeDriveCanvas(){
  dcv=$("#drivecanvas"); if(!dcv) return;
  const r=dcv.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  dcv._w=r.width; dcv._h=r.height;
  dcv.width=Math.max(1,Math.round(r.width*dpr));
  dcv.height=Math.max(1,Math.round(r.height*dpr));
  dctx=dcv.getContext("2d");
  dctx.setTransform(dpr,0,0,dpr,0,0);
}

function bindDriveInput(){
  const gas=$("#dgas"), brake=$("#dbrake");
  if(gas){ gas.onpointerdown=e=>{e.preventDefault();drive.gas=true;};
           gas.onpointerup=gas.onpointerleave=gas.onpointercancel=()=>drive.gas=false; }
  if(brake){ brake.onpointerdown=e=>{e.preventDefault();drive.brake=true;};
             brake.onpointerup=brake.onpointerleave=brake.onpointercancel=()=>drive.brake=false; }
  _dkd=e=>{ if(["ArrowRight","ArrowUp"," "].includes(e.key)){drive.gas=true;e.preventDefault();}
            if(["ArrowLeft","ArrowDown"].includes(e.key)){drive.brake=true;e.preventDefault();} };
  _dku=e=>{ if(["ArrowRight","ArrowUp"," "].includes(e.key))drive.gas=false;
            if(["ArrowLeft","ArrowDown"].includes(e.key))drive.brake=false; };
  document.addEventListener("keydown",_dkd);
  document.addEventListener("keyup",_dku);
}
function unbindDriveInput(){
  if(_dkd) document.removeEventListener("keydown",_dkd);
  if(_dku) document.removeEventListener("keyup",_dku);
  _dkd=_dku=null;
}

function driveFrame(t){
  if(crashed||finished){ drawDrive(); stopDrive(); endRun(); return; }
  if(!dlast) dlast=t;
  let dt=(t-dlast)/1000; dlast=t; dt=Math.min(dt,0.05);
  dacc+=dt;
  const STEP=1/120;
  let guard=0;
  while(dacc>=STEP && guard++<8){ stepPhysics(STEP); dacc-=STEP; }
  if(MP.active && t-(driveFrame._mp||0) > 50){ mpSend(); driveFrame._mp=t; }  // broadcast ~20x/s
  drawDrive();
  if(!crashed && !finished) draf=requestAnimationFrame(driveFrame);
  else { drawDrive(); stopDrive(); endRun(); }
}

function stepPhysics(dt){
  if(!started){
    if(counting){                                   // 3..2..1..GO before a race
      const el=performance.now()-countStart, idx=Math.min(3, Math.floor(el/800));
      if(idx!==countTick){ countTick=idx; if(idx<3) SFX.tap(); else SFX.rev(); }
      if(el>=2400){ counting=false; started=true; runStart=performance.now(); }
      else { collectCoins(); return; }
    } else if(drive.gas){
      if(TRACKS[driveTrack].race){ counting=true; countStart=performance.now(); countTick=-1; collectCoins(); return; }
      started=true; runStart=performance.now(); SFX.rev();
    } else { collectCoins(); return; }
  }
  const T=TRACKS[driveTrack], fin=trackFinish(driveTrack);
  if(T.race){
    const dist=car.x-startX;
    const curLap=Math.min(T.laps, Math.floor(dist/T.lapLen)+1);
    if(curLap>lap && !finished){ lap=curLap; showMsg("LAP "+lap+"/"+T.laps+" 🏁",1000); SFX.coin(); }  // crossed a lap line
    if(!finished && dist>=fin){ finished=true; return; }
  }
  if(car.grounded){
    const a=slopeAt(car.x);
    const boosting = performance.now()<boostUntil;
    car.speed += (drive.gas?driveTune.accel*(boosting?1.8:1):0)*dt;
    if(boosting) car.speed += 260*dt;             // constant push while boosting
    car.speed -= (drive.brake?DRV.BRAKEF:0)*dt;
    car.speed += DRV.GSLOPE*Math.sin(a)*dt;       // downhill speeds up, uphill slows
    car.speed -= car.speed*DRV.FRICT*dt;          // rolling resistance
    const maxs = driveTune.maxs*(boosting?1.5:1);
    if(car.speed>maxs) car.speed=maxs;
    if(car.speed<-150) car.speed=-150;
    const vx=car.speed*Math.cos(a), vy=car.speed*Math.sin(a);
    const nx=car.x+vx*dt;
    const lip=lipBetween(car.x,nx);
    if(lip!==null && car.speed>180){               // hit a ramp lip -> launch!
      const la=slopeAt(lip);
      car.grounded=false;
      car.vx=car.speed*Math.cos(la);
      car.vy=-(200 + car.speed*0.9);               // upward kick scales with speed
      car.angVel=0; airRot=0;
      car.x=lip; car.y=terrainY(lip); car.angle=la;
    } else {
      car.x=nx; car.y=terrainY(nx); car.angle=a;
    }
  } else {
    car.vy += DRV.G*dt;
    car.x += car.vx*dt; car.y += car.vy*dt;
    if(drive.gas)   car.angVel -= DRV.AIRT*dt;     // lean back (backflip)
    if(drive.brake) car.angVel += DRV.AIRT*dt;     // lean forward (frontflip)
    car.angVel *= (1-0.05*dt);
    car.angle += car.angVel*dt;
    airRot += car.angVel*dt;
    const g=terrainY(car.x);
    if(car.y>=g){                                  // landed
      const ga=slopeAt(car.x);
      let diff=car.angle-ga;
      while(diff>Math.PI) diff-=2*Math.PI;
      while(diff<-Math.PI) diff+=2*Math.PI;
      const f=Math.floor(Math.abs(airRot)/(2*Math.PI));
      if(Math.abs(diff)<driveTune.land){            // landed roughly upright (grip = forgiveness)
        car.grounded=true; car.y=g; car.angle=ga;
        car.speed=Math.max(0,car.vx);
        if(f>0){ flipsRun+=f; showFlip(f); SFX.flip(); }
        car.angVel=0; airRot=0;
      } else {
        crashed=true; SFX.crash();
      }
    }
  }
  collectCoins();
}

function collectCoins(){
  const base=Math.floor((car.x-startX-280)/150);
  for(let i=Math.max(0,base-1); i<base+14; i++){
    if(driveCoins.has(i)) continue;
    const dx=coinX(i)-car.x, dy=coinY(i)-car.y;
    if(dx*dx+dy*dy < 42*42){ driveCoins.add(i); coinsRun++; }
  }
  // boost pads (reusable, no consume) — grants a short speed burst
  const bb=Math.floor((car.x-startX-620)/820);
  for(let i=Math.max(0,bb-1); i<bb+3; i++){
    const dx=boostX(i)-car.x, dy=boostY(i)-car.y;
    if(dx*dx+dy*dy < 50*50 && car.speed>40 && boostUntil<=performance.now()){
      boostUntil=performance.now()+1600; SFX.rev(); showMsg("🔥 BOOST!",700);
    }
  }
}

function showMsg(text, ms){
  const m=$("#flipmsg"); if(!m) return;
  m.textContent = text; m.classList.add("show");
  clearTimeout(showMsg._t);
  showMsg._t=setTimeout(()=>m.classList.remove("show"), ms||800);
}
function showFlip(f){ showMsg("FLIP"+(f>1?" x"+f:"")+"! 🤸"); }

function drawDrive(){
  if(!dctx || !dcv._w) return;
  const W=dcv._w, H=dcv._h;
  const tx=car.x - W*0.32, ty=car.y - H*0.56;
  if(!camInit){ camX=tx; camY=ty; camInit=true; }
  camX += (tx-camX)*0.12; camY += (ty-camY)*0.12;

  // sky (per track)
  const SK=TRACKS[driveTrack].sky||["#aee3ff","#d7f0ff","#eef9ff"];
  const sky=dctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,SK[0]); sky.addColorStop(.55,SK[1]); sky.addColorStop(1,SK[2]);
  dctx.fillStyle=sky; dctx.fillRect(0,0,W,H);

  // terrain fill + grass top
  dctx.beginPath();
  dctx.moveTo(-2,H+60);
  let topPts=[];
  for(let sx=-2; sx<=W+2; sx+=6){
    const gy=terrainY(camX+sx)-camY;
    dctx.lineTo(sx,gy); topPts.push([sx,gy]);
  }
  dctx.lineTo(W+2,H+60); dctx.closePath();
  const TR=TRACKS[driveTrack];
  const dirt=dctx.createLinearGradient(0,H*0.3,0,H);
  dirt.addColorStop(0,TR.ground1); dirt.addColorStop(1,TR.ground2);
  dctx.fillStyle=dirt; dctx.fill();
  dctx.beginPath();
  topPts.forEach((p,i)=> i?dctx.lineTo(p[0],p[1]):dctx.moveTo(p[0],p[1]));
  dctx.lineWidth=7; dctx.strokeStyle=TR.edge; dctx.stroke();
  if(TR.race){        // dashed center line down the road
    dctx.lineWidth=3; dctx.strokeStyle="rgba(255,255,255,.55)"; dctx.setLineDash([18,20]);
    dctx.beginPath(); topPts.forEach((p,i)=> i?dctx.lineTo(p[0],p[1]+16):dctx.moveTo(p[0],p[1]+16)); dctx.stroke();
    dctx.setLineDash([]);
  }
  // lap + finish lines (race)
  if(TR.race){
    for(let n=1;n<=TR.laps;n++){
      const wx=startX+n*TR.lapLen, fx=wx-camX;
      if(fx<-30||fx>W+30) continue;
      const fy=terrainY(wx)-camY, isFinish=(n===TR.laps);
      for(let r=0;r<8;r++) for(let cc=0;cc<2;cc++){
        dctx.fillStyle=((r+cc)%2)?"#111":"#fff";
        dctx.fillRect(fx-14+cc*14, fy-120+r*15, 14, 15);
      }
      dctx.fillStyle=isFinish?"#ffd14d":"#fff"; dctx.font="700 13px Segoe UI"; dctx.textAlign="center";
      dctx.fillText(isFinish?"FINISH":("LAP "+n), fx, fy-128);
    }
  }

  // coins
  const base=Math.floor((camX+ -0 -startX-280)/150);
  for(let i=Math.max(0,base-2); i<base+16; i++){
    if(driveCoins.has(i)) continue;
    const cx=coinX(i)-camX, cy=coinY(i)-camY;
    if(cx<-20||cx>W+20) continue;
    dctx.beginPath(); dctx.arc(cx,cy,11,0,7); dctx.fillStyle="#ffd14d"; dctx.fill();
    dctx.lineWidth=3; dctx.strokeStyle="#e3a81f"; dctx.stroke();
    dctx.beginPath(); dctx.arc(cx,cy,5,0,7); dctx.fillStyle="#fff0bf"; dctx.fill();
  }

  // boost pads (glowing forward chevrons on the ground)
  const bpb=Math.floor((camX-startX-620)/820);
  for(let i=Math.max(0,bpb-1); i<bpb+4; i++){
    const bx=boostX(i)-camX, by=boostY(i)-camY;
    if(bx<-40||bx>W+40) continue;
    for(let k=0;k<3;k++){
      const ox=bx-18+k*14, al=0.5+k*0.2;
      dctx.strokeStyle="rgba(90,255,155,"+al+")"; dctx.lineWidth=5; dctx.lineCap="round";
      dctx.beginPath(); dctx.moveTo(ox-6,by-9); dctx.lineTo(ox+4,by); dctx.lineTo(ox-6,by+9); dctx.stroke();
    }
  }

  // other players (ghost cars with name labels)
  if(MP.active){
    const now=performance.now();
    for(const id in MP.remotes){
      const rp=MP.remotes[id];
      if(now-rp.seen>4000){ delete MP.remotes[id]; continue; }   // dropped
      const rx=rp.x-camX, ry=rp.y-camY;
      if(rx<-120||rx>W+120) continue;                            // off-screen
      drawRemoteCar(rx,ry,rp.angle||0,rp.paint||"#39c46a",rp.type||"car",rp.name||"Friend");
    }
  }

  // car
  drawCar(car.x-camX, car.y-camY);

  // boost speed-lines
  if(performance.now()<boostUntil){
    const cx=car.x-camX, cy=car.y-camY;
    dctx.strokeStyle="rgba(255,255,255,.5)"; dctx.lineWidth=2;
    for(let k=0;k<7;k++){ const yy=cy-70+k*18, len=30+((k*53)%40);
      dctx.beginPath(); dctx.moveTo(cx-40-len, yy); dctx.lineTo(cx-40, yy); dctx.stroke(); }
    dctx.strokeStyle="rgba(90,255,155,.35)"; dctx.lineWidth=8;
    dctx.strokeRect(3,3,W-6,H-6);
  }

  // HUD live
  const dd=$("#ddist"), dc=$("#dcoins"), df=$("#dflips"), hint=$("#dstarthint");
  if(dd) dd.textContent=Math.max(0,Math.round((car.x-startX)/18));
  if(dc) dc.textContent=coinsRun;
  if(df) df.textContent=flipsRun;
  if(hint) hint.style.display = (started||counting)?"none":"flex";
  // race countdown: 3..2..1..GO
  if(counting){
    const el=performance.now()-countStart;
    const n = el<800?"3":el<1600?"2":el<2400?"1":"GO!";
    dctx.save(); dctx.textAlign="center"; dctx.font="900 68px Segoe UI, sans-serif";
    dctx.lineWidth=5; dctx.strokeStyle="rgba(0,0,0,.55)"; dctx.fillStyle=(n==="GO!")?"#5bff9b":"#ffd14d";
    dctx.strokeText(n, W/2, H*0.44); dctx.fillText(n, W/2, H*0.44);
    dctx.restore();
  }
  const mpc=$("#dmp"), mpn=$("#dmpn");
  if(mpc){
    if(MP.active){ mpc.style.display="inline-flex";
      const others=Object.keys(MP.remotes).length;
      if(mpn) mpn.textContent=(others+1)+(MP.code?"  "+MP.code:"");
    } else mpc.style.display="none";
  }
  const lc=$("#dlap"), ln=$("#dlapn");
  if(lc){
    if(TRACKS[driveTrack].race){ lc.style.display="inline-flex";
      if(ln) ln.textContent=lap+"/"+TRACKS[driveTrack].laps;
    } else lc.style.display="none";
  }
}

function drawRemoteCar(sx,sy,angle,paint,type,name){
  const ctx=dctx, d=carDims(type||"car");
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(angle); ctx.globalAlpha=0.92;
  ctx.beginPath(); ctx.arc(-d.dx,-d.rr,d.rr,0,7); ctx.fillStyle="#15151b"; ctx.fill();
  ctx.beginPath(); ctx.arc( d.dx,-d.fr,d.fr,0,7); ctx.fillStyle="#15151b"; ctx.fill();
  const by=-(Math.max(d.fr,d.rr)+d.bh*0.5+2);
  roundRectPath(-d.bw/2, by-d.bh/2, d.bw, d.bh, 8);
  ctx.fillStyle=paint; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.stroke();
  ctx.globalAlpha=1; ctx.restore();
  // name tag above (screen-aligned)
  ctx.save(); ctx.font="700 12px Segoe UI, sans-serif"; ctx.textAlign="center";
  const label=(name||"Friend").slice(0,12), tw=ctx.measureText(label).width+14;
  roundRectPath(sx-tw/2, sy-60, tw, 19, 9); ctx.fillStyle="rgba(8,12,30,.72)"; ctx.fill();
  ctx.fillStyle="#fff"; ctx.fillText(label, sx, sy-47);
  ctx.restore();
}

function drawWheelC(ctx,wx,wy,r,rim,wcol){
  ctx.beginPath(); ctx.arc(wx,wy,r,0,7); ctx.fillStyle="#15151b"; ctx.fill();
  if(rim==="offroad"){ ctx.lineWidth=3; ctx.strokeStyle="#0a0a0a"; ctx.beginPath(); ctx.arc(wx,wy,r-2,0,7); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(wx,wy,r*0.6,0,7); ctx.fillStyle=shade(wcol,0.14); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=shade(wcol,-0.35); ctx.stroke();
  const spokes = rim==="steel"?0:(rim==="offroad"?6:7);
  ctx.strokeStyle=shade(wcol,-0.4); ctx.lineWidth=rim==="offroad"?4:2.5; ctx.lineCap="round";
  for(let i=0;i<spokes;i++){ const a=i/spokes*6.2832;
    ctx.beginPath(); ctx.moveTo(wx,wy); ctx.lineTo(wx+Math.cos(a)*r*0.55, wy+Math.sin(a)*r*0.55); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(wx,wy,r*0.18,0,7); ctx.fillStyle=shade(wcol,0.32); ctx.fill();
}

function drawCar(sx, sy){
  const ctx=dctx, d=carDims(car.type);
  const sc=car.lift?1.18:1, liftY=car.lift?-8:0;
  const fr=d.fr*sc, rr=d.rr*sc, maxR=Math.max(fr,rr);
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(car.angle);
  ctx.save(); ctx.rotate(-car.angle);
  ctx.beginPath(); ctx.ellipse(0,5,d.bw*0.72,7,0,0,7); ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fill();
  ctx.restore();
  drawWheelC(ctx,-d.dx,-rr,rr,car.rim,car.wheel);
  drawWheelC(ctx, d.dx,-fr,fr,car.rim,car.wheel);
  const by=-(maxR + d.bh*0.5 + 2) + liftY;
  const top=by-d.bh/2;
  const grad=ctx.createLinearGradient(0,top,0,by+d.bh/2);
  grad.addColorStop(0,shade(car.paint,0.28)); grad.addColorStop(.5,car.paint); grad.addColorStop(1,shade(car.paint,-0.28));
  roundRectPath(-d.bw/2, top, d.bw, d.bh, 8);
  ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=shade(car.paint,-0.4); ctx.stroke();
  if(car.type!=="moto"){
    roundRectPath(-d.bw*0.16, top-12, d.bw*0.5, 13, 4);
    ctx.fillStyle=car.tint?"#33414f":"#bfe6ff"; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(d.bw*0.5-3, by, 3, 0, 7); ctx.fillStyle="#fff3b0"; ctx.fill();
  ctx.beginPath(); ctx.arc(-d.bw*0.5+3, by, 2.5, 0, 7); ctx.fillStyle="#e23b3b"; ctx.fill();
  ctx.beginPath(); ctx.arc(-d.bw*0.08, top-16, 6.5, 0, 7); ctx.fillStyle="#f1c8a0"; ctx.fill();
  ctx.beginPath(); ctx.arc(-d.bw*0.08, top-18, 7.5, Math.PI, 2*Math.PI); ctx.fillStyle=shade(car.paint,-0.1); ctx.fill();
  ctx.restore();
}

function roundRectPath(x,y,w,h,r){
  const ctx=dctx;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function endRun(){
  if(ended) return; ended=true;
  const distM=Math.max(0,Math.round((car.x-startX)/18));
  const timeS=runStart?((performance.now()-runStart)/1000):0;
  let bonus=flipsRun*5 + Math.floor(distM/4);
  if(finished) bonus+=100;                                    // finish-line reward
  const totalCoins=coinsRun+bonus;
  const xp=Math.floor(distM/2)+flipsRun*10+coinsRun+(finished?50:0);
  addCoins(totalCoins); addXP(xp);

  // Best-time record for this track (only counts a full finish)
  let recordLine="";
  if(finished){
    if(!state.records) state.records={};
    const prev=state.records[driveTrack];
    if(prev==null || timeS<prev){
      state.records[driveTrack]=+timeS.toFixed(1); save();
      recordLine=`<div style="color:var(--good);font-weight:800;margin:2px 0 10px">🏅 NEW ${TRACKS[driveTrack].name} record!</div>`;
      SFX.level();
    } else {
      recordLine=`<div class="sub" style="margin:2px 0 10px">🏅 ${TRACKS[driveTrack].name} best: ${prev.toFixed(1)}s</div>`;
    }
  }

  // Multiplayer race: broadcast your finish + show a live leaderboard
  let mpBoard="";
  const mpRace = MP.active && finished;
  if(mpRace) mpSendDone(timeS);
  if(mpRace){
    const rows=Object.keys(MP.results).map(id=>({me:id===(MP.myId||"me"), name:MP.results[id].name, time:MP.results[id].time}))
      .sort((a,b)=>a.time-b.time);
    mpBoard = `<div style="margin:6px 0 12px;text-align:left">
      <b>🏁 Race results</b>${rows.length<2?' <span class="sub">(waiting for friends…)</span>':''}
      ${rows.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;${r.me?'color:var(--coin);font-weight:800':''}">
        <span>${i===0?"🏆":(i+1)+".&nbsp;"} ${(r.name||"Player")}${r.me?" (you)":""}</span><span>${r.time.toFixed(1)}s</span></div>`).join("")}
    </div>`;
  }
  let title = finished ? "🏆 Finished the race!" : "Run complete!";
  if(mpRace){
    const best=Object.values(MP.results).sort((a,b)=>a.time-b.time)[0];
    title = (best && best.time===timeS) ? "🏆 You’re in the lead!" : "🏁 You finished!";
  }
  const timeLine = finished ? `⏱️ Your time: <b>${timeS.toFixed(1)}s</b><br>` : "";
  showModal(`
    <div class="big-emoji">${finished?"🏆":"🏁"}</div>
    <h3>${title}</h3>
    ${recordLine}
    ${mpBoard}
    <p style="text-align:left">
      ${timeLine}📏 Distance: <b>${distM} m</b><br>
      🤸 Flips: <b>${flipsRun}</b><br>
      🪙 Coins grabbed: <b>${coinsRun}</b><br>
      🎁 Bonus${finished?" (+100 finish!)":""}: <b>${bonus}</b><br>
      <span style="color:var(--coin)">Total earned: 🪙${totalCoins} · ⭐${xp} XP</span>
    </p>
    <button class="btn green" onclick="reDrive()">🏁 ${MP.active?"Race again":"Drive again"}</button>
    <button class="btn gray sm" style="margin-top:8px" onclick="exitDrive()">🔧 Back to Garage</button>
  `);
}

function genMathProblem(){
  const roll = Math.floor(Math.random()*5);
  if(roll===0){
    const price = [120, 160, 200, 240, 320, 400][Math.floor(Math.random()*6)];
    const pct   = [25, 50, 20, 10][Math.floor(Math.random()*4)];
    const disc  = Math.round(price * (pct/100));
    const finalP= price - disc;
    return {
      q: `A heavy-duty off-road part costs ${price} coins, and the Build Shop is running a ${pct}% OFF sale. What is the sale price after subtracting the ${pct}% discount?`,
      ans: String(finalP),
      hint: `${pct}% of ${price} is ${disc} coins. Now subtract: ${price} - ${disc} = ${finalP}!`
    };
  } else if(roll===1){
    const mph = [35, 42, 45, 55, 60][Math.floor(Math.random()*5)];
    const hrs = [3, 4, 5, 6][Math.floor(Math.random()*4)];
    const dist = mph * hrs;
    return {
      q: `Your Baja Trophy Truck averages ${mph} miles per hour across the desert dunes for ${hrs} hours straight. How many total miles did you drive?`,
      ans: String(dist),
      hint: `Multiply speed × time: ${mph} × ${hrs} = ${dist} miles!`
    };
  } else if(roll===2){
    const a = 12 + Math.floor(Math.random()*14);
    const b = 4 + Math.floor(Math.random()*6);
    const c = 15 + Math.floor(Math.random()*25);
    const res = a * b + c;
    return {
      q: `Order of Operations (PEMDAS): Each trail gate awards ${a} coins. You clear ${b} gates and find a bonus crate worth ${c} coins. Solve: (${a} × ${b}) + ${c} = ?`,
      ans: String(res),
      hint: `First multiply ${a} × ${b} = ${a*b}, then add ${c} to get ${res}!`
    };
  } else if(roll===3){
    const psiStart = 34;
    const drop = [16, 18, 20, 22][Math.floor(Math.random()*4)];
    const perTire = psiStart - drop;
    const totalPsi = perTire * 4;
    return {
      q: `Each of your 4 tires starts at ${psiStart} PSI. You air down each tire by ${drop} PSI for rock crawling. What is the new PSI of ONE tire multiplied by all 4 tires?`,
      ans: String(totalPsi),
      hint: `One tire is ${psiStart} - ${drop} = ${perTire} PSI. Multiply by 4 tires: ${perTire} × 4 = ${totalPsi}!`
    };
  } else {
    const boxes = [6, 7, 8, 9][Math.floor(Math.random()*4)];
    const bolts = [14, 15, 16, 18][Math.floor(Math.random()*4)];
    const tot = boxes * bolts;
    return {
      q: `Beadlock rims use ${bolts} titanium bolts per wheel. If you build ${boxes} off-road wheels in the shop, how many bolts do you need in total?`,
      ans: String(tot),
      hint: `Multiply ${boxes} × ${bolts}: (${boxes} × 10 = ${boxes*10}) + (${boxes} × ${bolts-10} = ${boxes*(bolts-10)}) = ${tot}!`
    };
  }
}

    const ch = w[i];
    if(i < t.length && t[i]===ch){
      out += `<span style="color:#5bff9b;font-weight:900;border-bottom:2px solid #5bff9b;padding:0 2px">${ch.toUpperCase()}</span>`;
    } else if(i===0 || i===w.length-1){
      out += `<span style="color:#ffd14d;font-weight:900;border-bottom:2px dashed #ffd14d;padding:0 2px">${ch.toUpperCase()}</span>`;
    } else {
      out += `<span style="color:#ff8a8a;border-bottom:2px dashed #ff6b6b;padding:0 3px">_</span>`;
    }
  }
  return `<div style="font-family:monospace;font-size:18px;letter-spacing:3px;margin:6px 0">${out}</div>`;
}

window.checkBrainAnswer = function(){
  if(!BRAIN) return;
  const m = BRAIN.mode;
  let ok = false, coachHtml = "";

  if(m==="spell"){
    const val = ($("#brain_input")?.value||"").trim().toLowerCase();
    const target = BRAIN.spellItem.w.toLowerCase();
    if(val === target){ ok = true; }
    else {
      coachHtml = `<div>Almost! Check the green letters you nailed and fill in the rest:</div>` +
                  diffMaskHtml(val, target) +
                  `<div style="color:#bfe6ff;font-size:12px">Tip: Tap <b>🔊 Hear Word</b> or spell: <b>${target.toUpperCase()}</b></div>`;
    }
  } else if(m==="memory"){
    const v1 = ($("#mem_in1")?.value||"").trim().toLowerCase();
    const v2 = ($("#mem_in2")?.value||"").trim().toLowerCase();
    const it = BRAIN.memItem;
    const ok1 = (v1 === it.a1.toLowerCase());
    const ok2 = (v2 === it.a2.toLowerCase() || (it.a2_alt && v2 === it.a2_alt.toLowerCase()));
    if(ok1 && ok2){ ok = true; }
    else {
      coachHtml = `<div>Close! Word [1]: ${ok1?"✅":diffMaskHtml(v1, it.a1)} Word [2]: ${ok2?"✅":diffMaskHtml(v2, it.a2)}</div>
                   <div style="color:#bfe6ff;font-size:12px">Hint: Word 1 is <b>${it.a1.toUpperCase()}</b> and Word 2 is <b>${it.a2.toUpperCase()}</b>!</div>`;
    }
  } else if(m==="english"){
    const val = ($("#brain_input")?.value||"").trim().toLowerCase();
    const it = BRAIN.engItem;
    if(val === it.answer.toLowerCase() || (it.alt && val === it.alt.toLowerCase())){ ok = true; }
    else {
      coachHtml = `<div>${it.hint}</div>` + diffMaskHtml(val, it.answer);
    }
  } else {
    const val = ($("#brain_input")?.value||"").trim().replace(/[^0-9.-]/g,"");
    if(val === BRAIN.mathItem.ans){ ok = true; }
    else {
      coachHtml = `<div>💡 Coach Hint: ${BRAIN.mathItem.hint}</div>`;
    }
  }

  if(ok){
    state.brainStreak = (state.brainStreak||0) + 1;
    state.brainSolved = (state.brainSolved||0) + 1;
    const bonusCoins = 40 + Math.min(25, state.brainStreak * 5);
    const bonusXp    = 25;
    addCoins(bonusCoins); addXP(bonusXp);
    confettiBurst(); SFX.level();
    const cb = BRAIN.onSuccess;
    closeModal();
    if(typeof cb === "function") cb();
    toast(`🧠 NAILED IT! +🪙${bonusCoins} · +⭐${bonusXp} XP (Streak 🔥${state.brainStreak})`);
    save(); render();
  } else {
    SFX.tap();
    BRAIN.feedback = coachHtml;
    const fb = $("#brain_fb");
    if(fb) fb.innerHTML = coachHtml;
  }
};

function makeRealisticTexture(kind, repX, repY){
  const key = `${kind}_${repX||1}_${repY||1}`;
  if(_REAL_TEX_CACHE[key]) return _REAL_TEX_CACHE[key];
  const cv = document.createElement("canvas");
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext("2d");

  let s = 1337;
  const rnd = ()=>{ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };

  if(kind === "grass_dark"){
    const bg = ctx.createLinearGradient(0,0,512,512);
    bg.addColorStop(0, "#1b5920"); bg.addColorStop(0.5, "#236b28"); bg.addColorStop(1, "#164d1b");
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,512,512);
    for(let i=0;i<65;i++){
      const x = rnd()*512, y = rnd()*512, r = 40 + rnd()*85;
      ctx.fillStyle = (i%3===0) ? "rgba(12,44,15,0.55)" : (i%3===1 ? "rgba(44,122,50,0.48)" : "rgba(26,84,32,0.48)");
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    }
    const clumpCols = ["#114015","#1a571f","#246e29","#2f8235","#154a1a","#39913f"];
    ctx.lineWidth = 3.6;
    for(let i=0;i<2400;i++){
      const x = rnd()*512, y = rnd()*512;
      const h = 12 + rnd()*18, dx = (rnd()-0.5)*12;
      ctx.strokeStyle = clumpCols[i % clumpCols.length];
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y - h); ctx.stroke();
    }
    ctx.lineWidth = 2.0;
    for(let i=0;i<3500;i++){
      const x = rnd()*512, y = rnd()*512;
      const h = 6 + rnd()*10, dx = (rnd()-0.5)*6;
      ctx.strokeStyle = clumpCols[(i+2) % clumpCols.length];
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y - h); ctx.stroke();
    }
  } else if(kind === "dirt_trail"){
    ctx.fillStyle = "#6e482b";
    ctx.fillRect(0,0,512,512);
    // White/Red Painted Racing Track Berm Edges along left & right borders of track texture!
    ctx.fillStyle = "#8a5a36";
    ctx.fillRect(0, 0, 28, 512); ctx.fillRect(484, 0, 28, 512);
    for(let y=0;y<512;y+=64){
      ctx.fillStyle = (y%128===0) ? "#d9381e" : "#f1f5f9";
      ctx.fillRect(4, y, 16, 32); ctx.fillRect(492, y, 16, 32);
    }
    for(let i=0;i<120;i++){
      const x = 32 + rnd()*448, y = rnd()*512, r = 18 + rnd()*44;
      ctx.fillStyle = (i%2===0) ? "rgba(56,34,18,0.52)" : "rgba(138,92,56,0.45)";
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = "rgba(42,25,12,0.58)";
    for(let y=0;y<512;y+=24){
      ctx.fillRect(105, y, 64, 11); ctx.fillRect(340, y+12, 64, 11);
    }
    for(let i=0;i<800;i++){
      ctx.fillStyle = (i%3===0) ? "#3d2412" : (i%3===1 ? "#855836" : "#996844");
      const sz = 3 + rnd()*6;
      ctx.fillRect(30 + rnd()*452, rnd()*512, sz, sz*0.8);
    }
  } else if(kind === "mud_bog"){
    ctx.fillStyle = "#3d2514"; ctx.fillRect(0,0,512,512);
    for(let i=0;i<160;i++){
      ctx.fillStyle = (i%2===0) ? "rgba(28,16,8,0.55)" : "rgba(78,48,26,0.48)";
      ctx.beginPath(); ctx.arc(rnd()*512, rnd()*512, 18+rnd()*42, 0, Math.PI*2); ctx.fill();
    }
  } else if(kind === "rock_cliff"){
    ctx.fillStyle = "#5c6472"; ctx.fillRect(0,0,512,512);

      ctx.fillRect(365, y+10, 5, 34);
    }
  } else if(kind === "city_facade"){
    // Multi-story Urban Brick & Sandstone Building Facade with Gridded Glass Windows
    ctx.fillStyle = "#6b3428"; ctx.fillRect(0,0,512,512);
    for(let r=0;r<8;r++){
      ctx.fillStyle = "#475569"; ctx.fillRect(0, r*64, 512, 6);
      for(let c=0;c<6;c++){
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(c*84 + 14, r*64 + 12, 54, 42);
        ctx.fillStyle = ((r+c)%3===0) ? "#93c5fd" : "#64748b";
        ctx.fillRect(c*84 + 18, r*64 + 16, 20, 34);
        ctx.fillRect(c*84 + 42, r*64 + 16, 20, 34);
      }
    }
  } else {
    ctx.fillStyle = "#2b3344"; ctx.fillRect(0,0,512,512);
    ctx.fillStyle = "#455168";
    for(let y=0;y<512;y+=24){
      for(let x=0;x<512;x+=24){
        ctx.fillRect(x+4, y+4, 9, 4); ctx.fillRect(x+14, y+14, 4, 9);
      }
    }
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repX||1, repY||1);
  if("encoding" in tex) tex.encoding = THREE.sRGBEncoding;
  tex.needsUpdate = true;
  _REAL_TEX_CACHE[key] = tex;
  return tex;
}

function ensurePlanarUVs(geom, scale){
  if(!geom || !geom.attributes || !geom.attributes.position) return;
  const pos = geom.attributes.position;
  const nrm = geom.attributes.normal;
  const uvs = new Float32Array(pos.count * 2);
  const s = scale || 0.14;
  for(let i=0;i<pos.count;i++){
    const vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
    const ny = nrm ? Math.abs(nrm.getY(i)) : 1.0;
    if(ny > 0.5){
      uvs[i*2]   = vx * s;
      uvs[i*2+1] = vz * s;
    } else {
      uvs[i*2]   = (vx + vz) * s;
      uvs[i*2+1] = vy * s;
    }
  }
  geom.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
}

const TERRAIN_SIZE = 2400; // 2,400m x 2,400m (-1200m to +1200m) continuous terrain mesh!
const TERRAIN_HALF = TERRAIN_SIZE * 0.5;
const TERRAIN_SEGS = 240;  // Exact 10.0m triangle grid cells
const TERRAIN_STEP = TERRAIN_SIZE / TERRAIN_SEGS;

function getMudZonesForMode(mode){
  return mode === "nightcity" ? CHAPTER_MUD_ZONES.nightcity : CHAPTER_MUD_ZONES.default;
}

function evalChapterTerrainY(mode, x, z){
  if(mode==="nightcity") return 0.0;
  const y = -z;
  const r = Math.hypot(x, y);
  let baseH = 0;
  if(mode==="ranch"){
    // Gentle, smooth greenland meadow undulations so driving sideways across grass is ultra-smooth!
    baseH = 0.09*Math.cos(x*0.06)*Math.cos(y*0.06) + 0.22*Math.sin(x*0.03+0.5)*Math.sin(y*0.03);
  } else if(mode==="mudbog"){
    const trench = -0.22*Math.exp(-(y*y)/42.0)*Math.cos(x*0.08);
    const banks  = 0.18*(1.0 - Math.exp(-(y*y)/50.0)) + 0.09*Math.sin(x*0.06);
    baseH = trench + banks - 0.04;
  } else if(mode==="redrock"){
    const mesa = 0.35*Math.exp(-((x-2)*(x-2)+(y+2)*(y+2))/55.0);
    const steps = 0.22*Math.sin(x*0.06)*Math.cos(y*0.06);
    baseH = mesa + Math.max(0.0, steps);
  } else if(mode==="dunes"){
    baseH = 0.55*Math.sin(x*0.05+y*0.04+0.8) + 0.38*Math.cos(x*0.04-y*0.05) + 0.15;
  } else if(mode==="arena"){
    baseH = 0.28*Math.exp(-(x*x+y*y)/60.0);
  }

  // Smooth Drive-Over Mountains & Rolling Ridges (placed clear of all mud pits!)
  // Mountain 1: South-East Track Hill Pass at (x=82, z=28), height +5.8m, radius 32m
  const dM1 = Math.hypot((x - 82)*0.75, (z - 28)*0.75);
  if(dM1 < 32){
    baseH += 5.8 * Math.pow(0.5 + 0.5*Math.cos(Math.PI * dM1 / 32), 1.5);
  }
  // Mountain 2: East Switchback Mountain Pass at (x=115, z=-42), height +8.5m, radius 38m
  const dM2 = Math.hypot((x - 115)*0.75, (z + 42)*0.75);
  if(dM2 < 38){
    baseH += 8.5 * Math.pow(0.5 + 0.5*Math.cos(Math.PI * dM2 / 38), 1.5);
  }
  // Mountain 3: West Overlook Drive-Over Mountain at (x=-52, z=54), height +8.8m, radius 32m
  const dM3 = Math.hypot((x + 52)*0.8, (z - 54)*0.8);
  if(dM3 < 32){
    baseH += 8.8 * Math.pow(0.5 + 0.5*Math.cos(Math.PI * dM3 / 32), 1.5);
  }
  // Mountain 4: High North-East Summit Peak at (x=140, z=-120), height +19.0m, radius 56m
  const dPeak = Math.hypot(x - 140, z + 120);
  if(dPeak < 56){
    baseH += 19.0 * Math.pow(0.5 + 0.5*Math.cos(Math.PI * dPeak / 56), 1.5);
  }
  // Rolling Backcountry Greenland Hills for r > 130m
  if(r > 130){
    const wFactor = Math.min(1.0, (r - 130) / 70.0);
    const rolling = 5.2 * Math.sin(x*0.016) * Math.cos(z*0.016) +
                    3.8 * Math.cos(x*0.024 - z*0.020) +
                    4.5 * Math.max(0, Math.sin(x*0.011 + z*0.013));
    baseH += wFactor * Math.max(-0.6, rolling);
  }

  // Smoothly level the Old-School Frontier Town pad (x: -55..+55, z: -124..-64)
  if(x > -58 && x < 58 && z > -126 && z < -62){
    const tx = Math.max(0, 1 - Math.abs(x)/58);
    const tz = Math.max(0, 1 - Math.abs(z + 92)/32);
    const flatBlend = Math.min(1, tx * tz * 2.4);
    baseH = baseH * (1 - flatBlend);
  }

  // Flatten terrain to a 100% dead-level ground basin under & around EVERY Mud Puddle (so mud NEVER floats!)
  const mZones = getMudZonesForMode(mode);
  for(let i=0; i<mZones.length; i++){
    const mz = mZones[i];
    const dm = Math.hypot(x - mz.x, z - mz.z);
    const flatR = mz.r + 12.0; // Cover full 10m grid cells around the mud puddle!
    const blendR = flatR + 10.0;
    if(dm <= flatR){
      return mz.flatY;
    } else if(dm < blendR){
      const u = (dm - flatR) / (blendR - flatR);
      const s = u * u * (3 - 2 * u);
      baseH = mz.flatY * (1 - s) + baseH * s;
    }
  }
  return baseH;
}

// Exact Barycentric Triangle Interpolation matching THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGS, TERRAIN_SEGS)
function getExactTerrainHeight(mode, x, z){
  const gx = (x + TERRAIN_HALF) / TERRAIN_STEP;
  const gz = (z + TERRAIN_HALF) / TERRAIN_STEP;
  const ix = Math.floor(gx);
  const iz = Math.floor(gz);
  if(ix < 0 || ix >= TERRAIN_SEGS || iz < 0 || iz >= TERRAIN_SEGS){
    return evalChapterTerrainY(mode, x, z);
  }
  const fx = gx - ix;
  const fz = gz - iz;
  const x0 = -TERRAIN_HALF + ix * TERRAIN_STEP;
  const x1 = x0 + TERRAIN_STEP;
  const z0 = -TERRAIN_HALF + iz * TERRAIN_STEP;
  const z1 = z0 + TERRAIN_STEP;

  const h00 = evalChapterTerrainY(mode, x0, z0);
  const h10 = evalChapterTerrainY(mode, x1, z0);
  const h01 = evalChapterTerrainY(mode, x0, z1);
  const h11 = evalChapterTerrainY(mode, x1, z1);

  if(fx + fz <= 1.0){
    return h00 + fx * (h10 - h00) + fz * (h01 - h00);
  } else {
    return h11 + (1.0 - fx) * (h01 - h11) + (1.0 - fz) * (h10 - h11);
  }
}

const _SIGN_TEX_CACHE = {};
function makeSignTexture(title, sub, bgHex, fgHex, borderHex){
  const key = `${title}_${sub}_${bgHex}`;
  if(_SIGN_TEX_CACHE[key]) return _SIGN_TEX_CACHE[key];
  const cv = document.createElement("canvas");
  cv.width = 512; cv.height = 192;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = bgHex || "#2b180d";
  ctx.fillRect(0, 0, 512, 192);
  ctx.strokeStyle = borderHex || "#f59e0b";
  ctx.lineWidth = 10;
  ctx.strokeRect(8, 8, 496, 176);
  ctx.fillStyle = fgHex || "#fef3c7";
  ctx.font = "900 44px Segoe UI, Georgia, serif";
  ctx.textAlign = "center";
  ctx.fillText(title, 256, 88);
  if(sub){
    ctx.fillStyle = borderHex || "#fbbf24";
    ctx.font = "800 26px Segoe UI, sans-serif";
    ctx.fillText(sub, 256, 142);
  }
  const tex = new THREE.CanvasTexture(cv);
  if("encoding" in tex) tex.encoding = THREE.sRGBEncoding;
  tex.needsUpdate = true;
  _SIGN_TEX_CACHE[key] = tex;
  return tex;
}

function buildXRayAndJBeamOverlays(carHolder, rType){
  const isLow = (rType==="lmp1"||rType==="m40"||rType==="supra98"||rType==="nekoma18"||rType==="gtr34"||rType==="supercar");
  const yBase = isLow ? 0.42 : 0.78;
  const roofY = isLow ? 0.96 : 1.72;

  // 1. JBeam Node-Beam Structural Truss Skeleton (Green, Yellow & Red Beams + Yellow Vertex Nodes!)
  const jbGrp = new THREE.Group();
  jbGrp.visible = !!(CH3D && CH3D.jbeamOn);
  const nodeMat = new THREE.MeshBasicMaterial({color:0xffee00});
  const greenMat = new THREE.MeshBasicMaterial({color:0x22ff44});
  const yellowMat = new THREE.MeshBasicMaterial({color:0xffdd00});
  const redMat = new THREE.MeshBasicMaterial({color:0xff3311});

  const jNodes = [
    // Front bumper & crumple zone nodes (0..5)
    [ 2.15, yBase-0.08, -0.78], [ 2.15, yBase-0.08,  0.0], [ 2.15, yBase-0.08,  0.78],
    [ 1.42, yBase+0.16, -0.88], [ 1.42, yBase+0.20,  0.0], [ 1.42, yBase+0.16,  0.88],
    // Firewall / A-pillar base nodes (6..8)
    [ 0.68, yBase+0.18, -0.86], [ 0.68, yBase+0.22,  0.0], [ 0.68, yBase+0.18,  0.86],
    // Roof / Cockpit cage nodes (9..12)
    [ 0.45, roofY,      -0.56], [ 0.45, roofY,       0.56],
    [-0.45, roofY,      -0.56], [-0.45, roofY,       0.56],
    // Rear bulkhead / B-pillar base nodes (13..15)
    [-0.68, yBase+0.18, -0.88], [-0.68, yBase+0.22,  0.0], [-0.68, yBase+0.18,  0.88],
    // Rear axle / engine bay nodes (16..18)
    [-1.42, yBase+0.18, -0.92], [-1.42, yBase+0.24,  0.0], [-1.42, yBase+0.18,  0.92],
    // Rear tail & wing nodes (19..23)
    [-2.12, yBase-0.04, -0.82], [-2.12, yBase-0.04,  0.0], [-2.12, yBase-0.04,  0.82],
    [-2.05, roofY+0.12, -0.88], [-2.05, roofY+0.12,  0.88],
    // 4 Wheel hub nodes (24..27)
    [ 1.42, 0.38, -0.96], [ 1.42, 0.38,  0.96], [-1.42, 0.38, -0.96], [-1.42, 0.38,  0.96]
  ];

  const nGeo = new THREE.SphereGeometry(0.058, 8, 8);
  jNodes.forEach(pt=>{
    const sp = new THREE.Mesh(nGeo, nodeMat);
    sp.position.set(pt[0], pt[1], pt[2]);
    jbGrp.add(sp);
  });

  const addStrut = (i1, i2, mat)=>{
    const p1 = new THREE.Vector3(...jNodes[i1]);
    const p2 = new THREE.Vector3(...jNodes[i2]);
    const dir = new THREE.Vector3().subVectors(p2, p1);
    const len = dir.length();
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, len, 6), mat);
    cyl.position.copy(p1).add(p2).multiplyScalar(0.5);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
    jbGrp.add(cyl);
  };

  // Connect structural truss edges (Green primary cage, Yellow cross-bracing, Red high-stress engine/wing struts)
  [[0,1],[1,2],[3,4],[4,5],[6,7],[7,8],[13,14],[14,15],[16,17],[17,18],[19,20],[20,21],
   [0,3],[1,4],[2,5],[3,6],[4,7],[5,8],[6,13],[7,14],[8,15],[13,16],[14,17],[15,18],[16,19],[17,20],[18,21],
   [6,9],[8,10],[9,10],[11,12],[9,11],[10,12],[13,11],[15,12]].forEach(e=>addStrut(e[0],e[1],greenMat));
  // Diagonal Yellow Braces
  [[0,4],[2,4],[3,7],[5,7],[6,10],[8,9],[9,12],[10,11],[6,14],[8,14],[13,17],[15,17],[16,20],[18,20]].forEach(e=>addStrut(e[0],e[1],yellowMat));
  // Red Suspension & Rear Wing Load Struts
  [[3,24],[6,24],[5,25],[8,25],[13,26],[16,26],[15,27],[18,27],[16,22],[19,22],[18,23],[21,23],[22,23],[11,17],[12,17]].forEach(e=>addStrut(e[0],e[1],redMat));

  carHolder.add(jbGrp);
  carHolder.userData.jbeamGrp = jbGrp;

  // 2. X-Ray Internal Glowing Wireframe Engine, Twin Exhausts, Transaxle & Suspension Assembly!
  const xrGrp = new THREE.Group();
  xrGrp.visible = !!(CH3D && CH3D.xrayOn);
  const wfYel = new THREE.MeshBasicMaterial({color:0xffee00, wireframe:true});
  const wfOrg = new THREE.MeshBasicMaterial({color:0xff7700, wireframe:true});
  const solidGlow = new THREE.MeshBasicMaterial({color:0xffaa00});

  const engX = isLow ? -0.85 : 1.25; // Mid-engine for LMP1/supercars, Front-engine for 4x4 trucks!
  const engBlock = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.48, 0.56), wfYel);
  engBlock.position.set(engX, yBase+0.02, 0); xrGrp.add(engBlock);
  [-0.26, 0.26].forEach(z=>{
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.84, 0.24, 0.24), wfOrg);
    head.position.set(engX, yBase+0.26, z); head.rotation.x = z>0 ? 0.45 : -0.45; xrGrp.add(head);
    // Exhaust headers & twin tailpipes running to rear
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, isLow?1.25:3.1, 10), wfYel);
    pipe.rotation.z = Math.PI/2; pipe.position.set(isLow?-1.48:-0.35, yBase-0.12, z*1.1); xrGrp.add(pipe);
    const muff = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.48, 12), wfOrg);
    muff.rotation.z = Math.PI/2; muff.position.set(-1.88, yBase-0.08, z*1.2); xrGrp.add(muff);
  });
  // Central Driveshaft & Transaxle
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.84, 10), solidGlow);
  shaft.rotation.z = Math.PI/2; shaft.position.set(0, yBase-0.16, 0); xrGrp.add(shaft);
  [1.42, -1.42].forEach(ax=>{
    const diff = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), wfYel);
    diff.position.set(ax, 0.42, 0); xrGrp.add(diff);
    [-0.78, 0.78].forEach(z=>{
      const coil = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.52, 10), wfOrg);
      coil.position.set(ax, 0.68, z); xrGrp.add(coil);
    });
  });

  carHolder.add(xrGrp);
  carHolder.userData.xrayGrp = xrGrp;
}

function applyXRayAndJBeamState(){
  if(!CH3D || !CH3D.carHolder) return;
  const ch = CH3D.carHolder;
  if(!ch.userData.jbeamGrp || !ch.userData.xrayGrp){
    buildXRayAndJBeamOverlays(ch, CH3D.vType);
  }
  if(ch.userData.jbeamGrp) ch.userData.jbeamGrp.visible = !!CH3D.jbeamOn;
  if(ch.userData.xrayGrp)  ch.userData.xrayGrp.visible  = !!CH3D.xrayOn;

  ch.traverse(o=>{
    if(o.isMesh && o.parent !== ch.userData.jbeamGrp && o.parent !== ch.userData.xrayGrp){
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m=>{
        if(!m) return;
        const nm = m.name || "";
        if(nm.includes("Truck_Paint") || nm.includes("Bed_Liner") || (!nm && !m.wireframe)){
          if(CH3D.xrayOn){
            m.transparent = true; m.opacity = 0.34; m.depthWrite = false;
          } else {
            m.transparent = false; m.opacity = 1.0; m.depthWrite = true;
          }
          m.needsUpdate = true;
        }
      });
    }
  });
}

  const mountActiveRig = (rType)=>{
    while(carHolder.children.length) carHolder.remove(carHolder.children[0]);
    carHolder.userData.jbeamGrp = null;
    carHolder.userData.xrayGrp = null;
    const rc = Object.assign({}, cfg(rType));
    if(CH3D){ CH3D.vType = rType; CH3D.vCfg = rc; }
    if(gltfCache[CAR_MODELS[rType]]){
      placeModel(carHolder, rType, rc, gltfCache[CAR_MODELS[rType]]);
      buildXRayAndJBeamOverlays(carHolder, rType);
      applyXRayAndJBeamState();
    } else {
      loadCarModel(carHolder, rType, rc, CAR_MODELS[rType]);
      setTimeout(()=>{ buildXRayAndJBeamOverlays(carHolder, rType); applyXRayAndJBeamState(); }, 180);
    }
  };
  mountActiveRig(vType);

  CH3D = {
    renderer, scene, camera, envGroup, parkGroup, carHolder, arrowGrp, winchLine, vType, vCfg,
    chIdx: initialIdx || 0,
    x: 0, z: 0, y: 0.2, vy: 0, mudSink: 0, airborne: false, jumpStartPos: null, bestAirFt: 0,
    heading: 0, speed: 0, steer: 0, wheelSpin: 0, camMode: 0, camZoom: 1.0, shakeTime: 0,
    pitch: 0, roll: 0, coins: 0, wrecksCount: 0, trackIdx: 1, lapsDone: 0,
    fourWD: true, lowGear: false, diffLock: false, winchActive: false, xrayOn: false, jbeamOn: false, slowMo: false, engineRunning: true,
    anchorPos: new THREE.Vector3(12.5, 1.4, 8.8),
    input: {gas:false, rev:false, left:false, right:false, nitro:false},
    rideableMeshes: [], analyticRamps: [], obstacleColliders: [], boxColliders: [], trees: [],
    smashables: [], crushCars: [], mudZones: [], mudParticles: [], mudRipples: [],
    carWashBays: [], washBrushes: [], trackPoints: [], trackGates: [],
    rivals: [], trailers: [], hitchedTrailer: null, dropZonePos: new THREE.Vector3(38, 0, -18),
    bossRace: null,
    raycaster: new THREE.Raycaster(),
    raf: null, last: 0
  };

  // Solid Tabletop & Launch Ramps with Analytic 3D Surface Math + Side-Wall Colliders (Impossible to drive through!)
  const addRideableRamp = (x, z, rotY, len, wid, h, col, isTabletop)=>{
    const mode = CHAPTERS_3D[CH3D.chIdx].mode;
    const gy = getExactTerrainHeight(mode, x, z);
    const rGrp = new THREE.Group();
    rGrp.position.set(x, gy, z);
    rGrp.rotation.y = rotY;
    const woodTex = makeRealisticTexture("wood_grain", 2, 2);
    const rampMat = new THREE.MeshStandardMaterial({map:woodTex, color:col||0xb5743b, roughness:0.78});
    const railMat = new THREE.MeshStandardMaterial({color:0xd9381e, roughness:0.45});

    if(isTabletop !== false){
      // Double-Sided Tabletop Stunt Ramp: Up-slope -> Flat Top Deck -> Down-slope (drive over from EITHER direction!)
      const segL = len / 3.0;
      const slope = Math.atan2(h, segL);
      const hyp = Math.hypot(segL, h);
      // Up-ramp (-len/2 to -len/6)
      const upDeck = new THREE.Mesh(new THREE.BoxGeometry(hyp, 0.35, wid), rampMat);
      upDeck.position.set(-segL, h*0.5 - 0.05, 0);
      upDeck.rotation.z = slope;
      upDeck.castShadow = true; upDeck.receiveShadow = true; upDeck.userData.isRamp = true;
      rGrp.add(upDeck);
      // Flat center deck (-len/6 to +len/6) + solid timber support crib down to -0.5m
      const topDeck = new THREE.Mesh(new THREE.BoxGeometry(segL + 0.3, h + 0.5, wid), rampMat);
      topDeck.position.set(0, h*0.5 - 0.25, 0);
      topDeck.castShadow = true; topDeck.receiveShadow = true; topDeck.userData.isRamp = true;
      rGrp.add(topDeck);
      // Down-ramp (+len/6 to +len/2)
      const dnDeck = new THREE.Mesh(new THREE.BoxGeometry(hyp, 0.35, wid), rampMat);
      dnDeck.position.set(segL, h*0.5 - 0.05, 0);
      dnDeck.rotation.z = -slope;
      dnDeck.castShadow = true; dnDeck.receiveShadow = true; dnDeck.userData.isRamp = true;
      rGrp.add(dnDeck);
      // Red/Yellow Safety Curb Rails on Left & Right Edges
      [-wid*0.47, wid*0.47].forEach(zSide=>{
        const rTop = new THREE.Mesh(new THREE.BoxGeometry(segL, 0.22, 0.16), railMat);
        rTop.position.set(0, h + 0.11, zSide);
        rGrp.add(rTop);
      });
      parkGroup.add(rGrp);
      rGrp.updateMatrixWorld(true);
      CH3D.rideableMeshes.push(upDeck, topDeck, dnDeck);
      CH3D.analyticRamps.push({
        x, z, cos:Math.cos(rotY), sin:Math.sin(rotY),
        halfL: len*0.52, halfW: wid*0.50, baseY: gy, h, tabletop: true
      });
    } else {
      const slope = Math.atan2(h, len);
      const deck = new THREE.Mesh(new THREE.BoxGeometry(len, 0.35, wid), rampMat);
      deck.position.set(0, h*0.48, 0);
      deck.rotation.z = slope;
      deck.castShadow = true; deck.receiveShadow = true; deck.userData.isRamp = true;
      rGrp.add(deck);
      const support = new THREE.Mesh(new THREE.BoxGeometry(0.45, h + 0.5, wid*0.95), rampMat);
      support.position.set(len*0.44, h*0.5 - 0.25, 0);
      rGrp.add(support);
      parkGroup.add(rGrp);
      rGrp.updateMatrixWorld(true);
      CH3D.rideableMeshes.push(deck);
      CH3D.analyticRamps.push({
        x, z, cos:Math.cos(rotY), sin:Math.sin(rotY),
        halfL: len*0.52, halfW: wid*0.50, baseY: gy, h, tabletop: false
      });
    }
  };

  const addCrushCarRow = (x, z, rotY)=>{
    const mode = CHAPTERS_3D[CH3D.chIdx].mode;
    const cols = [0x9e1b1b, 0x164e8f, 0xb87714, 0x1e5c26];
    for(let i=-1;i<=1;i++){
      const cMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.75, 0.85, 3.4),
        new THREE.MeshStandardMaterial({color:cols[(i+1)%cols.length], roughness:0.42, metalness:0.55})
      );
      const cx = x + i*2.05*Math.cos(rotY), cz = z - i*2.05*Math.sin(rotY);
      const cy = getExactTerrainHeight(mode, cx, cz);
      cMesh.position.set(cx, cy + 0.40, cz);
      cMesh.rotation.y = rotY;
      cMesh.castShadow = true; cMesh.receiveShadow = true;
      parkGroup.add(cMesh);
      cMesh.updateMatrixWorld(true);
      CH3D.rideableMeshes.push(cMesh);
      const cObj = {
        x:cx, z:cz, cos:Math.cos(rotY), sin:Math.sin(rotY),
        halfL:1.85, halfW:1.05, baseY:cy, h:0.80, tabletop:true, isCrushCar:true
      };
      CH3D.analyticRamps.push(cObj);
      CH3D.crushCars.push({mesh:cMesh, x:cx, z:cz, crushed:false, rampRef:cObj});
    }
  };

  const addSmashCrateCluster = (x, z)=>{
    const mode = CHAPTERS_3D[CH3D.chIdx].mode;
    const woodTex = makeRealisticTexture("wood_grain", 1, 1);
    [[-0.9,0],[0.9,0],[0,0.9]].forEach(off=>{
      const cx = x + off[0], cz = z + off[1];
      const cy = getExactTerrainHeight(mode, cx, cz);
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(0.95, 0.95, 0.95),
        new THREE.MeshStandardMaterial({map:woodTex, color:0xc47a32, roughness:0.72})
      );
      box.position.set(cx, cy + 0.45, cz);
      box.castShadow = true;
      parkGroup.add(box);
      CH3D.smashables.push({mesh:box, x:cx, y:cy+0.45, z:cz, vx:0, vy:0, vz:0, hit:false, label:"📦 SUPPLY CRATE"});
    });
  };

  // Build a terrain-conformed radial disc/ring mesh with optional underground outer skirt so Mud Puddles NEVER float!
  const makeTerrainDiscMesh = (mode, cx, cz, rInner, rOuter, rSegs, thetaSegs, yOff, mat)=>{
    const geo = new THREE.RingGeometry(rInner, rOuter, thetaSegs, rSegs);
    geo.rotateX(-Math.PI/2);
    const pos = geo.attributes.position;
    for(let i=0;i<pos.count;i++){
      const lx = pos.getX(i), lz = pos.getZ(i);
      const vx = cx + lx, vz = cz + lz;
      pos.setX(i, vx);
      pos.setZ(i, vz);
      pos.setY(i, getExactTerrainHeight(mode, vx, vz) + yOff);
    }
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, mat);
    m.receiveShadow = true;
    return m;
  };

  // Grounded 3D Mud Basin Mesh: Center wet mud sits flush at +0.005m on the dead-flat terrain basin,
  // and its outer 3D earthen mud bank collar plunges -0.45m UNDERGROUND into the terrain so zero air gap is ever possible!
  const makeGroundedMudPitMesh = (mode, cx, cz, r, mudPuddleMat, mudBankMat)=>{
    const grp = new THREE.Group();
    const centerY = getExactTerrainHeight(mode, cx, cz);
    // 1) Wet glossy mud water disc sitting flush (+0.005m) on the flat basin floor
    const mudGeo = new THREE.CircleGeometry(r * 0.96, 32);
    mudGeo.rotateX(-Math.PI/2);
    const mPos = mudGeo.attributes.position;
    for(let i=0;i<mPos.count;i++){
      const vx = cx + mPos.getX(i), vz = cz + mPos.getZ(i);
      mPos.setX(i, vx); mPos.setZ(i, vz);
      mPos.setY(i, getExactTerrainHeight(mode, vx, vz) + 0.005);
    }
    mudGeo.computeVertexNormals();
    const mudMesh = new THREE.Mesh(mudGeo, mudPuddleMat);
    mudMesh.receiveShadow = true;
    grp.add(mudMesh);

    // 2) 3D Mud Bank Berm & Underground Skirt (inner edge at +0.012m, outer skirt plunging -0.45m underground!)
    const bankGeo = new THREE.RingGeometry(r * 0.86, r * 1.24, 32, 3);
    bankGeo.rotateX(-Math.PI/2);
    const bPos = bankGeo.attributes.position;
    for(let i=0;i<bPos.count;i++){
      const lx = bPos.getX(i), lz = bPos.getZ(i);
      const rad = Math.hypot(lx, lz);
      const u = (rad - r*0.86) / (r*0.38); // 0 at inner edge -> 1 at outer edge
      const vx = cx + lx, vz = cz + lz;
      const gy = getExactTerrainHeight(mode, vx, vz);
      // Inner edge flush (+0.008m), mid crest (+0.018m), outer edge buried -0.45m underground!
      const yOff = (u > 0.75) ? -0.45 : (0.008 + Math.sin(u * Math.PI) * 0.012);
      bPos.setX(i, vx); bPos.setZ(i, vz);
      bPos.setY(i, gy + yOff);
    }
    bankGeo.computeVertexNormals();
    const bankMesh = new THREE.Mesh(bankGeo, mudBankMat);
    bankMesh.receiveShadow = true;
    grp.add(bankMesh);
    return grp;
  };

  // Build a Solid Wooden Fence with Grounded Posts & Rails that STOPS the truck solid!
  const addSolidFenceSegment = (mode, x1, z1, x2, z2, fenceMat, postMat)=>{
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    const ang = Math.atan2(-dz, dx);
    const steps = Math.max(1, Math.round(len / 3.2));
    for(let i=0;i<=steps;i++){
      const t = i / steps;
      const px = x1 + dx*t, pz = z1 + dz*t;
      const py = getExactTerrainHeight(mode, px, pz);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.16, 1.55, 8), postMat);
      post.position.set(px, py + 0.48, pz);
      post.castShadow = true;
      parkGroup.add(post);
      CH3D.obstacleColliders.push({x:px, z:pz, r:0.42, label:"🚧 Fence Post"});
      if(i < steps){
        const nx = x1 + dx*((i+0.5)/steps), nz = z1 + dz*((i+0.5)/steps);
        const ny = getExactTerrainHeight(mode, nx, nz);
        [0.42, 0.86].forEach(ry=>{
          const rail = new THREE.Mesh(new THREE.BoxGeometry(len/steps + 0.12, 0.11, 0.08), fenceMat);
          rail.position.set(nx, ny + ry, nz);
          rail.rotation.y = ang;
          rail.castShadow = true;
          parkGroup.add(rail);
        });
        CH3D.obstacleColliders.push({x:nx, z:nz, r:0.55, label:"🚧 Wooden Fence"});
      }
    }
    // Continuous solid BoxCollider along the entire fence line so no car can ever slip between posts!
    CH3D.boxColliders.push({
      cx: (x1 + x2) * 0.5,
      cz: (z1 + z2) * 0.5,
      hx: len * 0.5 + 0.25,
      hz: 0.42,
      cos: Math.cos(ang),
      sin: Math.sin(ang),
      label: "🚧 Wooden Ranch Fence"
    });
  };

  // Build a Working Drive-Through Car Wash Bay with Solid Side Walls, Spinning Bristle Rollers & Spray Arch!
  const addDriveThroughCarWash = (mode, wx, wz, rotY)=>{
    const wy = getExactTerrainHeight(mode, wx, wz);
    const cwGrp = new THREE.Group();
    cwGrp.position.set(wx, wy, wz);
    cwGrp.rotation.y = rotY;

    const padMat = new THREE.MeshStandardMaterial({map:makeRealisticTexture("asphalt_plate", 4, 3), color:0x64748b, roughness:0.4, metalness:0.4});
    const wallMat = new THREE.MeshStandardMaterial({map:makeRealisticTexture("brick_wall", 3, 1), color:0x1d4ed8, roughness:0.5});
    const trimMat = new THREE.MeshStandardMaterial({color:0xfacc15, roughness:0.3, metalness:0.4});
    const brushBlue = new THREE.MeshStandardMaterial({color:0x0ea5e9, roughness:0.6});
    const brushYel  = new THREE.MeshStandardMaterial({color:0xeab308, roughness:0.6});

    // Sunken foundation concrete pad (-0.4m deep so it never floats!)
    const pad = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.52, 6.6), padMat);
    pad.position.set(0, -0.20, 0); pad.receiveShadow = true; cwGrp.add(pad);

    // Left & Right Solid Car Wash Side Walls (z = -2.85 and z = +2.85; open 4.9m wide center tunnel!)
    [-2.85, 2.85].forEach(zSide=>{
      const wall = new THREE.Mesh(new THREE.BoxGeometry(8.4, 3.8, 0.45), wallMat);
      wall.position.set(0, 1.65, zSide); wall.castShadow = true; wall.receiveShadow = true; cwGrp.add(wall);
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.28, 0.50), trimMat);
      stripe.position.set(0, 1.85, zSide); cwGrp.add(stripe);
      // Register solid box collider for each side wall in world space!
      const c = Math.cos(rotY), s = Math.sin(rotY);
      const wwx = wx + zSide * s, wwz = wz + zSide * c;
      CH3D.boxColliders.push({cx:wwx, cz:wwz, hx:4.25, hz:0.45, cos:c, sin:s, label:"💦 Car Wash Wall"});
    });

    // Overhead Roof Bridge & Big "OUTLAW SUDS CAR WASH" Signboard
    const roof = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.42, 6.2), trimMat);
    roof.position.set(0, 3.65, 0); roof.castShadow = true; cwGrp.add(roof);
    const signTex = makeSignTexture("💦 OUTLAW CAR WASH", "DRIVE THRU • MUD WASH & REPAIR", "#0369a1", "#ffffff", "#facc15");
    const signMat = new THREE.MeshBasicMaterial({map:signTex});
    [-4.35, 4.35].forEach((xEnd, idx)=>{
      const sb = new THREE.Mesh(new THREE.BoxGeometry(0.14, 1.35, 5.4), signMat);
      sb.position.set(xEnd, 4.45, 0);
      if(idx===0) sb.rotation.y = Math.PI;
      cwGrp.add(sb);
    });

    // 4 Giant Spinning Vertical Bristle Roller Brushes inside the tunnel!
    [[-2.2, -1.95], [-2.2, 1.95], [2.2, -1.95], [2.2, 1.95]].forEach((bp, bi)=>{
      const bGrp = new THREE.Group();
      const core = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 2.9, 14), (bi%2===0)?brushBlue:brushYel);
      bGrp.add(core);
      for(let k=0;k<6;k++){
        const fin = new THREE.Mesh(new THREE.BoxGeometry(1.18, 2.8, 0.12), (bi+k)%2===0?brushYel:brushBlue);
        fin.rotation.y = (k/6)*Math.PI;
        bGrp.add(fin);
      }
      bGrp.position.set(bp[0], 1.55, bp[1]);
      cwGrp.add(bGrp);
      CH3D.washBrushes.push(bGrp);
    });

    parkGroup.add(cwGrp);
    CH3D.carWashBays.push({x:wx, y:wy, z:wz, r:4.5});
  };

  // Build the Old-School Frontier Town ("Outlaw Gulch") along Main Street (z = -92m, x = -48m .. +48m)
  const buildOldSchoolFrontierTown = (mode)=>{
    const woodTex  = makeRealisticTexture("wood_grain", 2, 2);
    const brickTex = makeRealisticTexture("brick_wall", 3, 2);
    const roofMat  = new THREE.MeshStandardMaterial({map:woodTex, color:0x3d2414, roughness:0.88});
    const porchMat = new THREE.MeshStandardMaterial({map:woodTex, color:0x7c4d2b, roughness:0.82});
    const postMat  = new THREE.MeshStandardMaterial({map:woodTex, color:0x4a2c16, roughness:0.88});
    const winMat   = new THREE.MeshStandardMaterial({color:0xfef08a, emissive:0xd97706, emissiveIntensity:0.55, roughness:0.2});

    const townBuildings = [
      {x: 34, z:-106, w:11.0, d:7.5, h:4.8, rotY:0,       col:0x8c5230, tex:woodTex,  title:"GENERAL STORE",   sub:"FEED • HARDWARE • GEAR", bg:"#3b1d0e"},
      {x: 10, z:-105, w: 9.5, d:6.8, h:4.2, rotY:0,       col:0xb91c1c, tex:brickTex, title:"RED CROWN GAS",   sub:"DIESEL • TIRES • OIL",   bg:"#7f1d1d", isGas:true},
      {x:-16, z:-106, w:12.0, d:8.2, h:5.6, rotY:0,       col:0x991b1b, tex:woodTex,  title:"BLACKSMITH BARN", sub:"4x4 WELDING & AXLES",    bg:"#27272a"},
      {x: 24, z: -77, w:10.5, d:7.0, h:4.6, rotY:Math.PI, col:0x78350f, tex:brickTex, title:"OUTLAW SALOON",   sub:"BURGERS & ROOT BEER",    bg:"#1e1b4b"},
      {x: -6, z: -77, w:11.5, d:7.4, h:6.4, rotY:Math.PI, col:0x6b4226, tex:woodTex,  title:"FRONTIER HOTEL",  sub:"SHERIFF & STAGECOACH",   bg:"#14532d"}
    ];

    townBuildings.forEach(b=>{
      const by = getExactTerrainHeight(mode, b.x, b.z);
      const bGrp = new THREE.Group();
      bGrp.position.set(b.x, by, b.z);
      bGrp.rotation.y = b.rotY;

      // Main Building Body (sunk -0.6m into ground so zero floating!)
      const bMat = new THREE.MeshStandardMaterial({map:b.tex, color:b.col, roughness:0.80});
      const body = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h + 0.6, b.d), bMat);
      body.position.set(0, b.h*0.5 - 0.3, 0);
      body.castShadow = true; body.receiveShadow = true;
      bGrp.add(body);

      // Old-School Western False-Front Parapet Facade + Pitched Roof
      const parapet = new THREE.Mesh(new THREE.BoxGeometry(b.w + 0.3, 1.45, 0.35), bMat);
      parapet.position.set(0, b.h + 0.65, b.d*0.5 - 0.1);
      parapet.castShadow = true;
      bGrp.add(parapet);
      const cornice = new THREE.Mesh(new THREE.BoxGeometry(b.w + 0.6, 0.22, 0.55), porchMat);
      cornice.position.set(0, b.h + 1.38, b.d*0.5 - 0.1);
      bGrp.add(cornice);

      // Hand-Painted Vintage Signboard on the False-Front Parapet
      const sTex = makeSignTexture(b.title, b.sub, b.bg, "#fef3c7", "#f59e0b");
      const sign = new THREE.Mesh(new THREE.BoxGeometry(b.w*0.82, 1.15, 0.12), new THREE.MeshBasicMaterial({map:sTex}));
      sign.position.set(0, b.h + 0.62, b.d*0.5 + 0.12);
      bGrp.add(sign);

      // Covered Wooden Boardwalk Porch + Solid Timber Porch Posts + Glowing Windows & Double Doors
      const deck = new THREE.Mesh(new THREE.BoxGeometry(b.w + 0.8, 0.45, 2.4), porchMat);
      deck.position.set(0, 0.05, b.d*0.5 + 1.15);
      deck.receiveShadow = true;
      bGrp.add(deck);
      const awning = new THREE.Mesh(new THREE.BoxGeometry(b.w + 0.8, 0.18, 2.5), roofMat);
      awning.position.set(0, 2.75, b.d*0.5 + 1.15);
      awning.rotation.x = 0.16;
      awning.castShadow = true;
      bGrp.add(awning);

      [-b.w*0.42, 0, b.w*0.42].forEach(px=>{
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.14, 2.8, 8), postMat);
        post.position.set(px, 1.35, b.d*0.5 + 2.15);
        post.castShadow = true;
        bGrp.add(post);
      });

      // Glowing Warm Windows & Wooden Door on Front Facade
      [-b.w*0.28, b.w*0.28].forEach(wx=>{
        const win = new THREE.Mesh(new THREE.BoxGeometry(1.35, 1.25, 0.12), winMat);
        win.position.set(wx, 1.85, b.d*0.5 + 0.04);
        bGrp.add(win);
      });
      const door = new THREE.Mesh(new THREE.BoxGeometry(1.3, 2.2, 0.12), roofMat);
      door.position.set(0, 1.1, b.d*0.5 + 0.04);
      bGrp.add(door);

      // If Vintage Gas Station, add Retro Red Gas Pumps Island out front!
      if(b.isGas){
        const isl = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.28, 1.4), new THREE.MeshStandardMaterial({color:0x94a3b8}));
        isl.position.set(0, 0.1, b.d*0.5 + 3.8);

  // Build Complete 850m Closed-Loop Dirt Track Ribbon + 16 Grounded Timber Checkpoint Gates across the Greenland!
  const buildCompleteTrackLoop = (mode)=>{
    const curvePts = TRACK_CONTROL_PTS.map(p=>new THREE.Vector3(p[0], 0, p[1]));
    const spline = new THREE.CatmullRomCurve3(curvePts, true, "catmullrom", 0.5);
    const segs = 240;
    const trackW = 10.5;
    const halfW = trackW * 0.5;

    const verts = [];
    const uvs = [];
    const indices = [];
    CH3D.trackPoints = [];

    for(let i=0;i<=segs;i++){
      const t = (i % segs) / segs;
      const pt = spline.getPointAt(t);
      const tan = spline.getTangentAt(t).normalize();
      const nx = -tan.z, nz = tan.x;
      if(i < segs) CH3D.trackPoints.push({x:pt.x, z:pt.z, tx:tan.x, tz:tan.z});

      // 5 vertices across track width so even wide turns conform 100% flush to curved hills (zero hovering!)
      for(let k=0;k<=4;k++){
        const u = k / 4.0;
        const off = (u - 0.5) * trackW;
        const vx = pt.x + nx * off;
        const vz = pt.z + nz * off;
        const vy = getExactTerrainHeight(mode, vx, vz) + 0.055;
        verts.push(vx, vy, vz);
        uvs.push(u, i * 0.35);
      }
      if(i < segs){
        const row0 = i * 5, row1 = (i + 1) * 5;
        for(let k=0;k<4;k++){
          indices.push(row0+k, row1+k, row0+k+1);
          indices.push(row0+k+1, row1+k, row1+k+1);
        }
      }
    }

    const tGeo = new THREE.BufferGeometry();
    tGeo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
    tGeo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
    tGeo.setIndex(indices);
    tGeo.computeVertexNormals();

    const dirtTex = makeRealisticTexture("dirt_trail", 1, 1);
    const tMesh = new THREE.Mesh(tGeo, new THREE.MeshStandardMaterial({
      map: dirtTex, bumpMap: dirtTex, bumpScale: 0.05, color: 0xffffff, roughness: 0.84, side: THREE.DoubleSide
    }));
    tMesh.receiveShadow = true;
    parkGroup.add(tMesh);

    // Plant 16 Grounded Timber Checkpoint Archways & Chevron Posts around the Track Loop (Sunk -0.5m into ground, Solid Posts!)
    const woodTex = makeRealisticTexture("wood_grain", 1, 2);
    const postMat = new THREE.MeshStandardMaterial({map:woodTex, color:0x5c381e, roughness:0.86});
    const flagRed = new THREE.MeshStandardMaterial({color:0xdc2626, roughness:0.4});
    const flagGold = new THREE.MeshStandardMaterial({color:0xfacc15, roughness:0.3});
    CH3D.trackGates = [];

    TRACK_CONTROL_PTS.forEach((cp, idx)=>{
      const nextCp = TRACK_CONTROL_PTS[(idx + 1) % TRACK_CONTROL_PTS.length];
      const dx = nextCp[0] - cp[0], dz = nextCp[1] - cp[1];
      const ang = Math.atan2(-dz, dx);
      const nx = -Math.sin(ang), nz = -Math.cos(ang);

      [-6.0, 6.0].forEach(side=>{
        const px = cp[0] + nx * side, pz = cp[1] + nz * side;
        const py = getExactTerrainHeight(mode, px, pz);
        const post = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 3.2, 8), postMat);
        post.position.set(px, py + 1.1, pz); // Sunk -0.5m into ground!
        post.castShadow = true;
        parkGroup.add(post);
        const sign = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.65, 0.85), idx===0 ? flagGold : flagRed);
        sign.position.set(px, py + 2.35, pz);
        sign.rotation.y = ang;
        parkGroup.add(sign);
        CH3D.obstacleColliders.push({x:px, z:pz, r:0.42, label:"🚩 Track Post"});
      });

      // Overhead Start/Finish Timber Banner at Gate 0
      if(idx === 0){
        const gy = getExactTerrainHeight(mode, cp[0], cp[1]);
        const sTex = makeSignTexture("🏁 START / FINISH", "GRAND NATIONAL TRACK LOOP", "#0f172a", "#4ade80", "#facc15");
        const banner = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.15, 12.4), new THREE.MeshBasicMaterial({map:sTex}));
        banner.position.set(cp[0], gy + 3.8, cp[1]);
        banner.rotation.y = ang;
        parkGroup.add(banner);
      }

      CH3D.trackGates.push({x:cp[0], z:cp[1], idx, cleared:false});
    });
  };

  document.addEventListener("keydown", CH3D._kd);
  document.addEventListener("keyup", CH3D._ku);

  const bUnstuck = $("#btn_unstuck");
  if(bUnstuck) bUnstuck.onclick = ()=>{
    if(!CH3D) return;
    const ch = CHAPTERS_3D[CH3D.chIdx] || CHAPTERS_3D[0];
    CH3D.x += Math.cos(CH3D.heading)*3.5;
    CH3D.z -= Math.sin(CH3D.heading)*3.5;
    CH3D.y = getExactTerrainHeight(ch.mode, CH3D.x, CH3D.z);
    CH3D.vy = 0; CH3D.mudSink = 0; CH3D.airborne = false; CH3D.pitch = 0; CH3D.roll = 0; CH3D.speed = 0;
    SFX.buy();
    showMsg("🔄 RIG RECOVERED & PLANTED ON TRAIL!", 900);
  };

  loadChapterRoom(CH3D.chIdx);
  if(initialContract==="boss") setTimeout(()=>startBossRace3D(), 120);
  else if(initialContract==="haul") setTimeout(()=>toggleHitchLoad3D("bulldozer"), 120);
  else if(initialContract==="barn") setTimeout(()=>toggleHitchLoad3D("barnwreck"), 120);
  else if(initialContract==="derby"){
    const mEl = $("#ch3dmission");
    if(mEl) mEl.textContent = "💥 DERBY TAKEDOWN: Ram & Wreck the 3 AI Rival Trucks (+🪙75 each)!";
    showMsg("💥 DERBY MODE: Hit 🔥 NITRO & Ram the 3 AI Rival Trucks!", 1500);
  }
  if(CH3D.raf) cancelAnimationFrame(CH3D.raf);
  CH3D.raf = requestAnimationFrame(step3DChapterFrame);
}

  if(CH3D._kd) document.removeEventListener("keydown", CH3D._kd);
