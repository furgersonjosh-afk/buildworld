function startDrive(){
  ended=false; crashed=false; started=false; finished=false; runStart=0; lap=1;
  counting=false; countStart=0; countTick=-1; boostUntil=0;
  coinsRun=0; flipsRun=0; airRot=0; camInit=false;
  if(MP.active) driveTrack="race";      // multiplayer is a race on the same course
  driveCoins=new Set();
  drive.gas=false; drive.brake=false;
  const c=cfg(state.current);
  startX=0;
  car={x:0, y:terrainY(0), vx:0, vy:0, angle:slopeAt(0), angVel:0, speed:0,
       grounded:true, type:state.current, paint:c.paint, wheel:c.wheel,
       rim:c.rim, lift:c.lift, tint:c.tint};
  const st=carStats(state.current,c);                 // build stats -> performance
  driveTune={ accel: 540 + st.power*3.0, maxs: 380 + st.speed*2.2, land: 1.02 + st.grip*0.006 };
  bindDriveInput();
  dlast=0; dacc=0;
  cancelAnimationFrame(draf);
  // wait one frame so the canvas has layout dimensions, then measure + run
  draf=requestAnimationFrame(()=>{
    resizeDriveCanvas();
    const ex=$("#dexit"); if(ex) ex.onclick=()=>setScreen("garage");
    const trkLabel=t=>{ const r=(state.records||{})[t]; return TRACKS[t].name+(r!=null?" · 🏅 best "+r.toFixed(1)+"s":""); };
    const tn=$("#trkname"); if(tn) tn.textContent=trkLabel(driveTrack);
    document.querySelectorAll("[data-track]").forEach(b=>b.onclick=()=>{
      if(started||counting) return;                    // only before you start
      driveTrack=b.dataset.track; SFX.tap();
      car.x=0; startX=0; car.y=terrainY(0); car.angle=slopeAt(0); car.speed=0; camInit=false;
      const t=$("#trkname"); if(t) t.textContent=trkLabel(driveTrack);
    });
    const bb=$("#battlebtn"); if(bb) bb.onclick=()=>{ SFX.tap(); startBattle(); };
    const c3b=$("#chapters3dbtn"); if(c3b) c3b.onclick=()=>{ SFX.tap(); start3DChapterMode(); };
    draf=requestAnimationFrame(driveFrame);
  });
}

function stopDrive(){
  if(draf){ cancelAnimationFrame(draf); draf=null; }
  unbindDriveInput();
  drive.gas=false; drive.brake=false;
}

function resizeDriveCanvas(){
  dcv=$("#drivecanvas"); if(!dcv) return;
  const r=dcv.getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  dcv._w=r.width; dcv._h=r.height;
  dcv.width=Math.max(1,Math.round(r.width*dpr));
  dcv.height=Math.max(1,Math.round(r.height*dpr));
  dctx=dcv.getContext("2d");
  dctx.setTransform(dpr,0,0,dpr,0,0);
}

function bindDriveInput(){
  const gas=$("#dgas"), brake=$("#dbrake");
  if(gas){ gas.onpointerdown=e=>{e.preventDefault();drive.gas=true;};
           gas.onpointerup=gas.onpointerleave=gas.onpointercancel=()=>drive.gas=false; }
  if(brake){ brake.onpointerdown=e=>{e.preventDefault();drive.brake=true;};
             brake.onpointerup=brake.onpointerleave=brake.onpointercancel=()=>drive.brake=false; }
  _dkd=e=>{ if(["ArrowRight","ArrowUp"," "].includes(e.key)){drive.gas=true;e.preventDefault();}
            if(["ArrowLeft","ArrowDown"].includes(e.key)){drive.brake=true;e.preventDefault();} };
  _dku=e=>{ if(["ArrowRight","ArrowUp"," "].includes(e.key))drive.gas=false;
            if(["ArrowLeft","ArrowDown"].includes(e.key))drive.brake=false; };
  document.addEventListener("keydown",_dkd);
  document.addEventListener("keyup",_dku);
}
function unbindDriveInput(){
  if(_dkd) document.removeEventListener("keydown",_dkd);
  if(_dku) document.removeEventListener("keyup",_dku);
  _dkd=_dku=null;
}

function driveFrame(t){
  if(crashed||finished){ drawDrive(); stopDrive(); endRun(); return; }
  if(!dlast) dlast=t;
  let dt=(t-dlast)/1000; dlast=t; dt=Math.min(dt,0.05);
  dacc+=dt;
  const STEP=1/120;
  let guard=0;
  while(dacc>=STEP && guard++<8){ stepPhysics(STEP); dacc-=STEP; }
  if(MP.active && t-(driveFrame._mp||0) > 50){ mpSend(); driveFrame._mp=t; }  // broadcast ~20x/s
  drawDrive();
  if(!crashed && !finished) draf=requestAnimationFrame(driveFrame);
  else { drawDrive(); stopDrive(); endRun(); }
}

function stepPhysics(dt){
  if(!started){
    if(counting){                                   // 3..2..1..GO before a race
      const el=performance.now()-countStart, idx=Math.min(3, Math.floor(el/800));
      if(idx!==countTick){ countTick=idx; if(idx<3) SFX.tap(); else SFX.rev(); }
      if(el>=2400){ counting=false; started=true; runStart=performance.now(); }
      else { collectCoins(); return; }
    } else if(drive.gas){
      if(TRACKS[driveTrack].race){ counting=true; countStart=performance.now(); countTick=-1; collectCoins(); return; }
      started=true; runStart=performance.now(); SFX.rev();
    } else { collectCoins(); return; }
  }
  const T=TRACKS[driveTrack], fin=trackFinish(driveTrack);
  if(T.race){
    const dist=car.x-startX;
    const curLap=Math.min(T.laps, Math.floor(dist/T.lapLen)+1);
    if(curLap>lap && !finished){ lap=curLap; showMsg("LAP "+lap+"/"+T.laps+" 🏁",1000); SFX.coin(); }  // crossed a lap line
    if(!finished && dist>=fin){ finished=true; return; }
  }
  if(car.grounded){
    const a=slopeAt(car.x);
    const boosting = performance.now()<boostUntil;
    car.speed += (drive.gas?driveTune.accel*(boosting?1.8:1):0)*dt;
    if(boosting) car.speed += 260*dt;             // constant push while boosting
    car.speed -= (drive.brake?DRV.BRAKEF:0)*dt;
    car.speed += DRV.GSLOPE*Math.sin(a)*dt;       // downhill speeds up, uphill slows
    car.speed -= car.speed*DRV.FRICT*dt;          // rolling resistance
    const maxs = driveTune.maxs*(boosting?1.5:1);
    if(car.speed>maxs) car.speed=maxs;
    if(car.speed<-150) car.speed=-150;
    const vx=car.speed*Math.cos(a), vy=car.speed*Math.sin(a);
    const nx=car.x+vx*dt;
    const lip=lipBetween(car.x,nx);
    if(lip!==null && car.speed>180){               // hit a ramp lip -> launch!
      const la=slopeAt(lip);
      car.grounded=false;
      car.vx=car.speed*Math.cos(la);
      car.vy=-(200 + car.speed*0.9);               // upward kick scales with speed
      car.angVel=0; airRot=0;
      car.x=lip; car.y=terrainY(lip); car.angle=la;
    } else {
      car.x=nx; car.y=terrainY(nx); car.angle=a;
    }
  } else {
    car.vy += DRV.G*dt;
    car.x += car.vx*dt; car.y += car.vy*dt;
    if(drive.gas)   car.angVel -= DRV.AIRT*dt;     // lean back (backflip)
    if(drive.brake) car.angVel += DRV.AIRT*dt;     // lean forward (frontflip)
    car.angVel *= (1-0.05*dt);
    car.angle += car.angVel*dt;
    airRot += car.angVel*dt;
    const g=terrainY(car.x);
    if(car.y>=g){                                  // landed
      const ga=slopeAt(car.x);
      let diff=car.angle-ga;
      while(diff>Math.PI) diff-=2*Math.PI;
      while(diff<-Math.PI) diff+=2*Math.PI;
      const f=Math.floor(Math.abs(airRot)/(2*Math.PI));
      if(Math.abs(diff)<driveTune.land){            // landed roughly upright (grip = forgiveness)
        car.grounded=true; car.y=g; car.angle=ga;
        car.speed=Math.max(0,car.vx);
        if(f>0){ flipsRun+=f; showFlip(f); SFX.flip(); }
        car.angVel=0; airRot=0;
      } else {
        crashed=true; SFX.crash();
      }
    }
  }
  collectCoins();
}

function collectCoins(){
  const base=Math.floor((car.x-startX-280)/150);
  for(let i=Math.max(0,base-1); i<base+14; i++){
    if(driveCoins.has(i)) continue;
    const dx=coinX(i)-car.x, dy=coinY(i)-car.y;
    if(dx*dx+dy*dy < 42*42){ driveCoins.add(i); coinsRun++; }
  }
  // boost pads (reusable, no consume) — grants a short speed burst
  const bb=Math.floor((car.x-startX-620)/820);
  for(let i=Math.max(0,bb-1); i<bb+3; i++){
    const dx=boostX(i)-car.x, dy=boostY(i)-car.y;
    if(dx*dx+dy*dy < 50*50 && car.speed>40 && boostUntil<=performance.now()){
      boostUntil=performance.now()+1600; SFX.rev(); showMsg("🔥 BOOST!",700);
    }
  }
}

function showMsg(text, ms){
  const m=$("#flipmsg"); if(!m) return;
  m.textContent = text; m.classList.add("show");
  clearTimeout(showMsg._t);
  showMsg._t=setTimeout(()=>m.classList.remove("show"), ms||800);
}
function showFlip(f){ showMsg("FLIP"+(f>1?" x"+f:"")+"! 🤸"); }

function drawDrive(){
  if(!dctx || !dcv._w) return;
  const W=dcv._w, H=dcv._h;
  const tx=car.x - W*0.32, ty=car.y - H*0.56;
  if(!camInit){ camX=tx; camY=ty; camInit=true; }
  camX += (tx-camX)*0.12; camY += (ty-camY)*0.12;

  // sky (per track)
  const SK=TRACKS[driveTrack].sky||["#aee3ff","#d7f0ff","#eef9ff"];
  const sky=dctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,SK[0]); sky.addColorStop(.55,SK[1]); sky.addColorStop(1,SK[2]);
  dctx.fillStyle=sky; dctx.fillRect(0,0,W,H);

  // terrain fill + grass top
  dctx.beginPath();
  dctx.moveTo(-2,H+60);
  let topPts=[];
  for(let sx=-2; sx<=W+2; sx+=6){
    const gy=terrainY(camX+sx)-camY;
    dctx.lineTo(sx,gy); topPts.push([sx,gy]);
  }
  dctx.lineTo(W+2,H+60); dctx.closePath();
  const TR=TRACKS[driveTrack];
  const dirt=dctx.createLinearGradient(0,H*0.3,0,H);
  dirt.addColorStop(0,TR.ground1); dirt.addColorStop(1,TR.ground2);
  dctx.fillStyle=dirt; dctx.fill();
  dctx.beginPath();
  topPts.forEach((p,i)=> i?dctx.lineTo(p[0],p[1]):dctx.moveTo(p[0],p[1]));
  dctx.lineWidth=7; dctx.strokeStyle=TR.edge; dctx.stroke();
  if(TR.race){        // dashed center line down the road
    dctx.lineWidth=3; dctx.strokeStyle="rgba(255,255,255,.55)"; dctx.setLineDash([18,20]);
    dctx.beginPath(); topPts.forEach((p,i)=> i?dctx.lineTo(p[0],p[1]+16):dctx.moveTo(p[0],p[1]+16)); dctx.stroke();
    dctx.setLineDash([]);
  }
  // lap + finish lines (race)
  if(TR.race){
    for(let n=1;n<=TR.laps;n++){
      const wx=startX+n*TR.lapLen, fx=wx-camX;
      if(fx<-30||fx>W+30) continue;
      const fy=terrainY(wx)-camY, isFinish=(n===TR.laps);
      for(let r=0;r<8;r++) for(let cc=0;cc<2;cc++){
        dctx.fillStyle=((r+cc)%2)?"#111":"#fff";
        dctx.fillRect(fx-14+cc*14, fy-120+r*15, 14, 15);
      }
      dctx.fillStyle=isFinish?"#ffd14d":"#fff"; dctx.font="700 13px Segoe UI"; dctx.textAlign="center";
      dctx.fillText(isFinish?"FINISH":("LAP "+n), fx, fy-128);
    }
  }

  // coins
  const base=Math.floor((camX+ -0 -startX-280)/150);
  for(let i=Math.max(0,base-2); i<base+16; i++){
    if(driveCoins.has(i)) continue;
    const cx=coinX(i)-camX, cy=coinY(i)-camY;
    if(cx<-20||cx>W+20) continue;
    dctx.beginPath(); dctx.arc(cx,cy,11,0,7); dctx.fillStyle="#ffd14d"; dctx.fill();
    dctx.lineWidth=3; dctx.strokeStyle="#e3a81f"; dctx.stroke();
    dctx.beginPath(); dctx.arc(cx,cy,5,0,7); dctx.fillStyle="#fff0bf"; dctx.fill();
  }

  // boost pads (glowing forward chevrons on the ground)
  const bpb=Math.floor((camX-startX-620)/820);
  for(let i=Math.max(0,bpb-1); i<bpb+4; i++){
    const bx=boostX(i)-camX, by=boostY(i)-camY;
    if(bx<-40||bx>W+40) continue;
    for(let k=0;k<3;k++){
      const ox=bx-18+k*14, al=0.5+k*0.2;
      dctx.strokeStyle="rgba(90,255,155,"+al+")"; dctx.lineWidth=5; dctx.lineCap="round";
      dctx.beginPath(); dctx.moveTo(ox-6,by-9); dctx.lineTo(ox+4,by); dctx.lineTo(ox-6,by+9); dctx.stroke();
    }
  }

  // other players (ghost cars with name labels)
  if(MP.active){
    const now=performance.now();
    for(const id in MP.remotes){
      const rp=MP.remotes[id];
      if(now-rp.seen>4000){ delete MP.remotes[id]; continue; }   // dropped
      const rx=rp.x-camX, ry=rp.y-camY;
      if(rx<-120||rx>W+120) continue;                            // off-screen
      drawRemoteCar(rx,ry,rp.angle||0,rp.paint||"#39c46a",rp.type||"car",rp.name||"Friend");
    }
  }

  // car
  drawCar(car.x-camX, car.y-camY);

  // boost speed-lines
  if(performance.now()<boostUntil){
    const cx=car.x-camX, cy=car.y-camY;
    dctx.strokeStyle="rgba(255,255,255,.5)"; dctx.lineWidth=2;
    for(let k=0;k<7;k++){ const yy=cy-70+k*18, len=30+((k*53)%40);
      dctx.beginPath(); dctx.moveTo(cx-40-len, yy); dctx.lineTo(cx-40, yy); dctx.stroke(); }
    dctx.strokeStyle="rgba(90,255,155,.35)"; dctx.lineWidth=8;
    dctx.strokeRect(3,3,W-6,H-6);
  }

  // HUD live
  const dd=$("#ddist"), dc=$("#dcoins"), df=$("#dflips"), hint=$("#dstarthint");
  if(dd) dd.textContent=Math.max(0,Math.round((car.x-startX)/18));
  if(dc) dc.textContent=coinsRun;
  if(df) df.textContent=flipsRun;
  if(hint) hint.style.display = (started||counting)?"none":"flex";
  // race countdown: 3..2..1..GO
  if(counting){
    const el=performance.now()-countStart;
    const n = el<800?"3":el<1600?"2":el<2400?"1":"GO!";
    dctx.save(); dctx.textAlign="center"; dctx.font="900 68px Segoe UI, sans-serif";
    dctx.lineWidth=5; dctx.strokeStyle="rgba(0,0,0,.55)"; dctx.fillStyle=(n==="GO!")?"#5bff9b":"#ffd14d";
    dctx.strokeText(n, W/2, H*0.44); dctx.fillText(n, W/2, H*0.44);
    dctx.restore();
  }
  const mpc=$("#dmp"), mpn=$("#dmpn");
  if(mpc){
    if(MP.active){ mpc.style.display="inline-flex";
      const others=Object.keys(MP.remotes).length;
      if(mpn) mpn.textContent=(others+1)+(MP.code?"  "+MP.code:"");
    } else mpc.style.display="none";
  }
  const lc=$("#dlap"), ln=$("#dlapn");
  if(lc){
    if(TRACKS[driveTrack].race){ lc.style.display="inline-flex";
      if(ln) ln.textContent=lap+"/"+TRACKS[driveTrack].laps;
    } else lc.style.display="none";
  }
}

function drawRemoteCar(sx,sy,angle,paint,type,name){
  const ctx=dctx, d=carDims(type||"car");
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(angle); ctx.globalAlpha=0.92;
  ctx.beginPath(); ctx.arc(-d.dx,-d.rr,d.rr,0,7); ctx.fillStyle="#15151b"; ctx.fill();
  ctx.beginPath(); ctx.arc( d.dx,-d.fr,d.fr,0,7); ctx.fillStyle="#15151b"; ctx.fill();
  const by=-(Math.max(d.fr,d.rr)+d.bh*0.5+2);
  roundRectPath(-d.bw/2, by-d.bh/2, d.bw, d.bh, 8);
  ctx.fillStyle=paint; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.stroke();
  ctx.globalAlpha=1; ctx.restore();
  // name tag above (screen-aligned)
  ctx.save(); ctx.font="700 12px Segoe UI, sans-serif"; ctx.textAlign="center";
  const label=(name||"Friend").slice(0,12), tw=ctx.measureText(label).width+14;
  roundRectPath(sx-tw/2, sy-60, tw, 19, 9); ctx.fillStyle="rgba(8,12,30,.72)"; ctx.fill();
  ctx.fillStyle="#fff"; ctx.fillText(label, sx, sy-47);
  ctx.restore();
}

function drawWheelC(ctx,wx,wy,r,rim,wcol){
  ctx.beginPath(); ctx.arc(wx,wy,r,0,7); ctx.fillStyle="#15151b"; ctx.fill();
  if(rim==="offroad"){ ctx.lineWidth=3; ctx.strokeStyle="#0a0a0a"; ctx.beginPath(); ctx.arc(wx,wy,r-2,0,7); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(wx,wy,r*0.6,0,7); ctx.fillStyle=shade(wcol,0.14); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=shade(wcol,-0.35); ctx.stroke();
  const spokes = rim==="steel"?0:(rim==="offroad"?6:7);
  ctx.strokeStyle=shade(wcol,-0.4); ctx.lineWidth=rim==="offroad"?4:2.5; ctx.lineCap="round";
  for(let i=0;i<spokes;i++){ const a=i/spokes*6.2832;
    ctx.beginPath(); ctx.moveTo(wx,wy); ctx.lineTo(wx+Math.cos(a)*r*0.55, wy+Math.sin(a)*r*0.55); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(wx,wy,r*0.18,0,7); ctx.fillStyle=shade(wcol,0.32); ctx.fill();
}

function drawCar(sx, sy){
  const ctx=dctx, d=carDims(car.type);
  const sc=car.lift?1.18:1, liftY=car.lift?-8:0;
  const fr=d.fr*sc, rr=d.rr*sc, maxR=Math.max(fr,rr);
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(car.angle);
  ctx.save(); ctx.rotate(-car.angle);
  ctx.beginPath(); ctx.ellipse(0,5,d.bw*0.72,7,0,0,7); ctx.fillStyle="rgba(0,0,0,.18)"; ctx.fill();
  ctx.restore();
  drawWheelC(ctx,-d.dx,-rr,rr,car.rim,car.wheel);
  drawWheelC(ctx, d.dx,-fr,fr,car.rim,car.wheel);
  const by=-(maxR + d.bh*0.5 + 2) + liftY;
  const top=by-d.bh/2;
  const grad=ctx.createLinearGradient(0,top,0,by+d.bh/2);
  grad.addColorStop(0,shade(car.paint,0.28)); grad.addColorStop(.5,car.paint); grad.addColorStop(1,shade(car.paint,-0.28));
  roundRectPath(-d.bw/2, top, d.bw, d.bh, 8);
  ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=shade(car.paint,-0.4); ctx.stroke();
  if(car.type!=="moto"){
    roundRectPath(-d.bw*0.16, top-12, d.bw*0.5, 13, 4);
    ctx.fillStyle=car.tint?"#33414f":"#bfe6ff"; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(d.bw*0.5-3, by, 3, 0, 7); ctx.fillStyle="#fff3b0"; ctx.fill();
  ctx.beginPath(); ctx.arc(-d.bw*0.5+3, by, 2.5, 0, 7); ctx.fillStyle="#e23b3b"; ctx.fill();
  ctx.beginPath(); ctx.arc(-d.bw*0.08, top-16, 6.5, 0, 7); ctx.fillStyle="#f1c8a0"; ctx.fill();
  ctx.beginPath(); ctx.arc(-d.bw*0.08, top-18, 7.5, Math.PI, 2*Math.PI); ctx.fillStyle=shade(car.paint,-0.1); ctx.fill();
  ctx.restore();
}

function roundRectPath(x,y,w,h,r){
  const ctx=dctx;
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function endRun(){
  if(ended) return; ended=true;
  const distM=Math.max(0,Math.round((car.x-startX)/18));
  const timeS=runStart?((performance.now()-runStart)/1000):0;
  let bonus=flipsRun*5 + Math.floor(distM/4);
  if(finished) bonus+=100;                                    // finish-line reward
  const totalCoins=coinsRun+bonus;
  const xp=Math.floor(distM/2)+flipsRun*10+coinsRun+(finished?50:0);
  addCoins(totalCoins); addXP(xp);

  // Best-time record for this track (only counts a full finish)
  let recordLine="";
  if(finished){
    if(!state.records) state.records={};
    const prev=state.records[driveTrack];
    if(prev==null || timeS<prev){
      state.records[driveTrack]=+timeS.toFixed(1); save();
      recordLine=`<div style="color:var(--good);font-weight:800;margin:2px 0 10px">🏅 NEW ${TRACKS[driveTrack].name} record!</div>`;
      SFX.level();
    } else {
      recordLine=`<div class="sub" style="margin:2px 0 10px">🏅 ${TRACKS[driveTrack].name} best: ${prev.toFixed(1)}s</div>`;
    }
  }

  // Multiplayer race: broadcast your finish + show a live leaderboard
  let mpBoard="";
  const mpRace = MP.active && finished;
  if(mpRace) mpSendDone(timeS);
  if(mpRace){
    const rows=Object.keys(MP.results).map(id=>({me:id===(MP.myId||"me"), name:MP.results[id].name, time:MP.results[id].time}))
      .sort((a,b)=>a.time-b.time);
    mpBoard = `<div style="margin:6px 0 12px;text-align:left">
      <b>🏁 Race results</b>${rows.length<2?' <span class="sub">(waiting for friends…)</span>':''}
      ${rows.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:4px 0;${r.me?'color:var(--coin);font-weight:800':''}">
        <span>${i===0?"🏆":(i+1)+".&nbsp;"} ${(r.name||"Player")}${r.me?" (you)":""}</span><span>${r.time.toFixed(1)}s</span></div>`).join("")}
    </div>`;
  }
  let title = finished ? "🏆 Finished the race!" : "Run complete!";
  if(mpRace){
    const best=Object.values(MP.results).sort((a,b)=>a.time-b.time)[0];
    title = (best && best.time===timeS) ? "🏆 You’re in the lead!" : "🏁 You finished!";
  }
  const timeLine = finished ? `⏱️ Your time: <b>${timeS.toFixed(1)}s</b><br>` : "";
  showModal(`
    <div class="big-emoji">${finished?"🏆":"🏁"}</div>
    <h3>${title}</h3>
    ${recordLine}
    ${mpBoard}
    <p style="text-align:left">
      ${timeLine}📏 Distance: <b>${distM} m</b><br>
      🤸 Flips: <b>${flipsRun}</b><br>
      🪙 Coins grabbed: <b>${coinsRun}</b><br>
      🎁 Bonus${finished?" (+100 finish!)":""}: <b>${bonus}</b><br>
      <span style="color:var(--coin)">Total earned: 🪙${totalCoins} · ⭐${xp} XP</span>
    </p>
    <button class="btn green" onclick="reDrive()">🏁 ${MP.active?"Race again":"Drive again"}</button>
    <button class="btn gray sm" style="margin-top:8px" onclick="exitDrive()">🔧 Back to Garage</button>
  `);
}

function genMathProblem(){
  const roll = Math.floor(Math.random()*5);
  if(roll===0){
    const price = [120, 160, 200, 240, 320, 400][Math.floor(Math.random()*6)];
    const pct   = [25, 50, 20, 10][Math.floor(Math.random()*4)];
    const disc  = Math.round(price * (pct/100));
    const finalP= price - disc;
    return {
      q: `A heavy-duty off-road part costs ${price} coins, and the Build Shop is running a ${pct}% OFF sale. What is the sale price after subtracting the ${pct}% discount?`,
      ans: String(finalP),
      hint: `${pct}% of ${price} is ${disc} coins. Now subtract: ${price} - ${disc} = ${finalP}!`
    };
  } else if(roll===1){
    const mph = [35, 42, 45, 55, 60][Math.floor(Math.random()*5)];
    const hrs = [3, 4, 5, 6][Math.floor(Math.random()*4)];
    const dist = mph * hrs;
    return {
      q: `Your Baja Trophy Truck averages ${mph} miles per hour across the desert dunes for ${hrs} hours straight. How many total miles did you drive?`,
      ans: String(dist),
      hint: `Multiply speed × time: ${mph} × ${hrs} = ${dist} miles!`
    };
  } else if(roll===2){
    const a = 12 + Math.floor(Math.random()*14);
    const b = 4 + Math.floor(Math.random()*6);
    const c = 15 + Math.floor(Math.random()*25);
    const res = a * b + c;
    return {
      q: `Order of Operations (PEMDAS): Each trail gate awards ${a} coins. You clear ${b} gates and find a bonus crate worth ${c} coins. Solve: (${a} × ${b}) + ${c} = ?`,
      ans: String(res),
      hint: `First multiply ${a} × ${b} = ${a*b}, then add ${c} to get ${res}!`
    };
  } else if(roll===3){
    const psiStart = 34;
    const drop = [16, 18, 20, 22][Math.floor(Math.random()*4)];
    const perTire = psiStart - drop;
    const totalPsi = perTire * 4;
    return {
      q: `Each of your 4 tires starts at ${psiStart} PSI. You air down each tire by ${drop} PSI for rock crawling. What is the new PSI of ONE tire multiplied by all 4 tires?`,
      ans: String(totalPsi),
      hint: `One tire is ${psiStart} - ${drop} = ${perTire} PSI. Multiply by 4 tires: ${perTire} × 4 = ${totalPsi}!`
    };
  } else {
    const boxes = [6, 7, 8, 9][Math.floor(Math.random()*4)];
    const bolts = [14, 15, 16, 18][Math.floor(Math.random()*4)];
    const tot = boxes * bolts;
    return {
      q: `Beadlock rims use ${bolts} titanium bolts per wheel. If you build ${boxes} off-road wheels in the shop, how many bolts do you need in total?`,
      ans: String(tot),
      hint: `Multiply ${boxes} × ${bolts}: (${boxes} × 10 = ${boxes*10}) + (${boxes} × ${bolts-10} = ${boxes*(bolts-10)}) = ${tot}!`
    };
  }
}

window.checkBrainAnswer = function(){
  if(!BRAIN) return;
  const m = BRAIN.mode;
  let ok = false, coachHtml = "";

  if(m==="spell"){
    const val = ($("#brain_input")?.value||"").trim().toLowerCase();
    const target = BRAIN.spellItem.w.toLowerCase();
    if(val === target){ ok = true; }
    else {
      coachHtml = `<div>Almost! Check the green letters you nailed and fill in the rest:</div>` +
                  diffMaskHtml(val, target) +
                  `<div style="color:#bfe6ff;font-size:12px">Tip: Tap <b>🔊 Hear Word</b> or spell: <b>${target.toUpperCase()}</b></div>`;
    }
  } else if(m==="memory"){
    const v1 = ($("#mem_in1")?.value||"").trim().toLowerCase();
    const v2 = ($("#mem_in2")?.value||"").trim().toLowerCase();
    const it = BRAIN.memItem;
    const ok1 = (v1 === it.a1.toLowerCase());
    const ok2 = (v2 === it.a2.toLowerCase() || (it.a2_alt && v2 === it.a2_alt.toLowerCase()));
    if(ok1 && ok2){ ok = true; }
    else {
      coachHtml = `<div>Close! Word [1]: ${ok1?"✅":diffMaskHtml(v1, it.a1)} Word [2]: ${ok2?"✅":diffMaskHtml(v2, it.a2)}</div>
                   <div style="color:#bfe6ff;font-size:12px">Hint: Word 1 is <b>${it.a1.toUpperCase()}</b> and Word 2 is <b>${it.a2.toUpperCase()}</b>!</div>`;
    }
  } else if(m==="english"){
    const val = ($("#brain_input")?.value||"").trim().toLowerCase();
    const it = BRAIN.engItem;
    if(val === it.answer.toLowerCase() || (it.alt && val === it.alt.toLowerCase())){ ok = true; }
    else {
      coachHtml = `<div>${it.hint}</div>` + diffMaskHtml(val, it.answer);
    }
  } else {
    const val = ($("#brain_input")?.value||"").trim().replace(/[^0-9.-]/g,"");
    if(val === BRAIN.mathItem.ans){ ok = true; }
    else {
      coachHtml = `<div>💡 Coach Hint: ${BRAIN.mathItem.hint}</div>`;
    }
  }

  if(ok){
    state.brainStreak = (state.brainStreak||0) + 1;
    state.brainSolved = (state.brainSolved||0) + 1;
    const bonusCoins = 40 + Math.min(25, state.brainStreak * 5);
    const bonusXp    = 25;
    addCoins(bonusCoins); addXP(bonusXp);
    confettiBurst(); SFX.level();
    const cb = BRAIN.onSuccess;
    closeModal();
    if(typeof cb === "function") cb();
    toast(`🧠 NAILED IT! +🪙${bonusCoins} · +⭐${bonusXp} XP (Streak 🔥${state.brainStreak})`);
    save(); render();
  } else {
    SFX.tap();
    BRAIN.feedback = coachHtml;
    const fb = $("#brain_fb");
    if(fb) fb.innerHTML = coachHtml;
  }
};

function evalChapterTerrainY(mode, x, z){
  const y = -z;
  const r = Math.hypot(x, y);
  let baseH = 0;
  if(mode==="ranch"){
    baseH = 0.22*Math.cos(x*0.18)*Math.cos(y*0.18) + 0.45*Math.sin(x*0.06+0.5)*Math.sin(y*0.06);
  } else if(mode==="mudbog"){
    const trench = -0.35*Math.exp(-(y*y)/36.0)*Math.cos(x*0.12);
    const banks  = 0.32*(1.0 - Math.exp(-(y*y)/45.0)) + 0.16*Math.sin(x*0.10);
    baseH = trench + banks - 0.06;
  } else if(mode==="redrock"){
    const mesa = 0.55*Math.exp(-((x-2)*(x-2)+(y+2)*(y+2))/45.0);
    const steps = 0.35*Math.sin(x*0.09)*Math.cos(y*0.09);
    baseH = mesa + Math.max(0.0, steps);
  } else if(mode==="dunes"){
    baseH = 1.15*Math.sin(x*0.08+y*0.05+0.8) + 0.75*Math.cos(x*0.06-y*0.09) + 0.25;
  } else if(mode==="nightcity"){
    baseH = 0.18*Math.exp(-(x*x+y*y)/90.0);
  } else if(mode==="arena"){
    baseH = 0.42*Math.exp(-(x*x+y*y)/55.0);
  }
  // Outer Off-Road Park Zones (360m x 360m):
  // 1) North-East High Mountain Summit Peak at (x=58, z=-58) climbing up to +18m!
  const dPeak = Math.hypot(x - 58, z + 58);
  if(dPeak < 42){
    baseH += 16.5 * Math.pow(1 - dPeak/42, 1.65);
  }
  // 2) South-West Deep Mud Bog Trench around (x=-38, z=38)
  const dMud = Math.hypot(x + 38, z - 38);
  if(dMud < 22){
    baseH -= 0.75 * Math.pow(1 - dMud/22, 2);
  }
  // 3) Outer Canyon Rim Bowl beyond r > 95m
  if(r > 95){
    baseH += Math.min(22.0, (r - 95) * 0.32 * (0.7 + 0.3*Math.sin(Math.atan2(y,x)*6)));
  }
  return baseH;
}

  const stage = $("#ch3dstage");
  const w = stage.clientWidth || window.innerWidth, h = stage.clientHeight || window.innerHeight;

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(w, h);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if("outputEncoding" in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
  if("toneMapping" in renderer){ renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.08; }
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x9ab8d4, 0.0045);
  const camera = new THREE.PerspectiveCamera(48, w/h, 0.1, 420);
  camera.position.set(-8.5, 3.8, 5.5);

  try{
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(renderer), 0.04).texture;
  }catch(e){}

  const hemi = new THREE.HemisphereLight(0xffffff, 0x334466, 0.95);
  scene.add(hemi);

  sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
  sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;

  const envGroup  = new THREE.Group();
  const parkGroup = new THREE.Group();

  const winchGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0.8,0), new THREE.Vector3(5,1.2,0)]);
  const winchLine = new THREE.Line(winchGeo, new THREE.LineBasicMaterial({color:0xffd14d, linewidth:3}));
  winchLine.visible = false;
  scene.add(winchLine);

  const vType = STAR_RIGS.includes(state.current) || CAR_MODELS[state.current] ? state.current : "crawler";
  const vCfg = Object.assign({}, cfg(vType));
  if(vCfg.lift===undefined) vCfg.lift = true;

  const mountActiveRig = (rType)=>{
    while(carHolder.children.length) carHolder.remove(carHolder.children[0]);
    const rc = Object.assign({}, cfg(rType));
    if(CH3D){ CH3D.vType = rType; CH3D.vCfg = rc; }
    if(gltfCache[CAR_MODELS[rType]]){
      placeModel(carHolder, rType, rc, gltfCache[CAR_MODELS[rType]]);
    } else {
      loadCarModel(carHolder, rType, rc, CAR_MODELS[rType]);
    }
  };
  mountActiveRig(vType);

  CH3D = {
    renderer, scene, camera, envGroup, parkGroup, carHolder, arrowGrp, winchLine, vType, vCfg,
    chIdx: initialIdx || 0,
    x: 0, z: 0, y: 0.2, vy: 0, airborne: false, jumpStartPos: null, bestAirFt: 0,
    heading: 0, speed: 0, steer: 0, wheelSpin: 0, camMode: 0, shakeTime: 0,
    pitch: 0, roll: 0, coins: 0, barnFound: false,
    fourWD: true, lowGear: false, diffLock: false, winchActive: false,
    anchorPos: new THREE.Vector3(12.5, 1.4, 8.8),
    input: {gas:false, rev:false, left:false, right:false, nitro:false},
    rideableMeshes: [], obstacleColliders: [], smashables: [], crushCars: [], mudZones: [],
    missions: [], missionIdx: 0, barnMesh: null,
    raycaster: new THREE.Raycaster(),
    raf: null, last: 0
  };

  const addRideableRamp = (x, z, rotY, len, wid, h, col)=>{
    const gy = evalChapterTerrainY(CHAPTERS_3D[CH3D.chIdx].mode, x, z);
    const rGrp = new THREE.Group();
    rGrp.position.set(x, gy, z);
    rGrp.rotation.y = rotY;
    const slope = Math.atan2(h, len);
    const deck = new THREE.Mesh(
      new THREE.BoxGeometry(len, 0.28, wid),
      new THREE.MeshStandardMaterial({color:col||0xc87a28, roughness:0.75})
    );
    deck.position.set(0, h*0.48, 0);
    deck.rotation.z = slope;
    deck.castShadow = true; deck.receiveShadow = true;
    rGrp.add(deck);
    parkGroup.add(rGrp);
    rGrp.updateMatrixWorld(true);
    CH3D.rideableMeshes.push(deck);
  };

  const addCrushCarRow = (x, z, rotY)=>{
    const gy = evalChapterTerrainY(CHAPTERS_3D[CH3D.chIdx].mode, x, z);
    const cols = [0xbf2c2c, 0x2c6ebf, 0xd99b26, 0x4b8b3b];
    for(let i=-1;i<=1;i++){
      const cMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.75, 0.85, 3.4),
        new THREE.MeshStandardMaterial({color:cols[(i+1)%cols.length], roughness:0.55, metalness:0.4})
      );
      const cx = x + i*2.05*Math.cos(rotY), cz = z - i*2.05*Math.sin(rotY);
      const cy = evalChapterTerrainY(CHAPTERS_3D[CH3D.chIdx].mode, cx, cz);
      cMesh.position.set(cx, cy + 0.42, cz);
      cMesh.rotation.y = rotY;
      cMesh.castShadow = true; cMesh.receiveShadow = true;
      parkGroup.add(cMesh);
      CH3D.rideableMeshes.push(cMesh);
      CH3D.crushCars.push({mesh:cMesh, x:cx, z:cz, crushed:false});
    }
  };

  const addSmashCrateCluster = (x, z)=>{
    const mode = CHAPTERS_3D[CH3D.chIdx].mode;
    [[-0.9,0],[0.9,0],[0,0.9]].forEach(off=>{
      const cx = x + off[0], cz = z + off[1];
      const cy = evalChapterTerrainY(mode, cx, cz);
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(0.95, 0.95, 0.95),
        new THREE.MeshStandardMaterial({color:0xd9822b, emissive:0x331600, roughness:0.65})
      );
      box.position.set(cx, cy + 0.48, cz);
      box.castShadow = true;
      parkGroup.add(box);
      CH3D.smashables.push({mesh:box, x:cx, y:cy+0.48, z:cz, vx:0, vy:0, vz:0, hit:false, label:"📦 SUPPLY CRATE"});
    });
  };

  const buildOpenWorldParkAndMissions = (ch)=>{
    const mode = ch.mode;
    while(parkGroup.children.length) parkGroup.remove(parkGroup.children[0]);
    CH3D.rideableMeshes = [];
    CH3D.obstacleColliders = [];
    CH3D.smashables = [];
    CH3D.crushCars = [];
    CH3D.mudZones = [{x:-38, z:38, r:20}, {x:0, z:18, r:10}];

    // 1. Massive 360m x 360m Continuous Outer Off-Road Park Terrain Mesh
    const gGeo = new THREE.PlaneGeometry(340, 340, 110, 110);
    gGeo.rotateX(-Math.PI/2);
    const pos = gGeo.attributes.position;
    for(let i=0;i<pos.count;i++){
      const vx = pos.getX(i), vz = pos.getZ(i);
      const hy = evalChapterTerrainY(mode, vx, vz);
      // Slightly depress central 38m so chapter GLB sits flush without z-fighting
      const cDist = Math.max(Math.abs(vx), Math.abs(vz));
      const blend = cDist < 22 ? -0.06 : 0.0;
      pos.setY(i, hy + blend);
    }
    gGeo.computeVertexNormals();
    const gMat = new THREE.MeshStandardMaterial({color:ch.gndCol||0x4d7c38, roughness:0.90, metalness:0.05});
    const gMesh = new THREE.Mesh(gGeo, gMat);
    gMesh.receiveShadow = true;
    parkGroup.add(gMesh);

    // 2. Stunt Park Ramps & Crush Car Rows (Right ahead of spawn + around park!)
    addRideableRamp(13.5, 0.0, 0.0, 6.5, 4.2, 1.85, 0xd97324);          // Launch ramp straight ahead!
    addCrushCarRow(22.0, 0.0, 0.0);                                      // Crush cars right past ramp!
    addRideableRamp(32.0, 0.0, Math.PI, 6.5, 4.2, 1.85, 0xd97324);       // Return jump ramp
    addRideableRamp(-18.0, -22.0, 0.65, 7.5, 4.6, 2.35, 0xc94a29);       // Mega Stunt Ramp NW
    addRideableRamp(25.0, 28.0, -0.8, 7.0, 4.5, 2.15, 0xd97324);         // SE Tabletop Ramp

    // 3. Rideable Rock Crawl Boulders Slab Garden at (x=24, z=-24)
    for(let i=0;i<10;i++){
      const rx = 20 + (i%4)*3.2, rz = -20 - Math.floor(i/4)*3.4;
      const ry = evalChapterTerrainY(mode, rx, rz);
      const rk = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.45 + (i%3)*0.35, 1),
        new THREE.MeshStandardMaterial({color:0x6c7078, roughness:0.88})
      );
      rk.scale.set(1.3, 0.62, 1.2);
      rk.position.set(rx, ry + 0.35, rz);
      rk.castShadow = true; rk.receiveShadow = true;
      parkGroup.add(rk);
      rk.updateMatrixWorld(true);
      CH3D.rideableMeshes.push(rk);
    }

    // 4. Deep Mud Bog Water Surface at (-38, 38)
    const mudSurf = new THREE.Mesh(
      new THREE.CircleGeometry(19, 32),
      new THREE.MeshStandardMaterial({color:0x3b2614, roughness:0.18, metalness:0.25})
    );
    mudSurf.rotation.x = -Math.PI/2;
    mudSurf.position.set(-38, evalChapterTerrainY(mode, -38, 38) + 0.32, 38);
    parkGroup.add(mudSurf);

    // 5. Solid Pine Trees & Perimeter Rock Pillars (True Solid Collisions!)
    const trunkMat = new THREE.MeshStandardMaterial({color:0x5c3d24, roughness:0.9});
    const leafMat  = new THREE.MeshStandardMaterial({color:0x2d5a27, roughness:0.8});
    const treeCoords = [
      [18,16],[-18,16],[18,-16],[-18,-16],[36,18],[-36,-18],[42,-15],[-45,14],
      [12,38],[-15,42],[48,42],[-52,-42],[68,22],[-68,25],[30,-48],[-32,-48]
    ];
    treeCoords.forEach(tc=>{
      const tx = tc[0], tz = tc[1], ty = evalChapterTerrainY(mode, tx, tz);
      const tGrp = new THREE.Group();
      const trk = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.45, 2.6, 8), trunkMat);
      trk.position.y = 1.3; tGrp.add(trk);
      const crn = new THREE.Mesh(new THREE.ConeGeometry(1.85, 4.5, 8), leafMat);
      crn.position.y = 4.2; tGrp.add(crn);
      tGrp.position.set(tx, ty, tz);
      parkGroup.add(tGrp);
      CH3D.obstacleColliders.push({x:tx, z:tz, r:1.05, label:"🌲 Pine Tree"});
    });

    // 6. Smashable Wooden Fences & Supply Crate Stacks
    [[-8, 12],[8, 12],[-14,-10],[16, -12],[28, 12],[-26, 12]].forEach(fp=>{
      const fx = fp[0], fz = fp[1], fy = evalChapterTerrainY(mode, fx, fz);
      const fence = new THREE.Mesh(
        new THREE.BoxGeometry(2.6, 0.9, 0.22),
        new THREE.MeshStandardMaterial({color:0x8c6239, roughness:0.85})
      );
      fence.position.set(fx, fy + 0.45, fz);
      parkGroup.add(fence);
      CH3D.smashables.push({mesh:fence, x:fx, y:fy+0.45, z:fz, vx:0, vy:0, vz:0, hit:false, label:"🚧 WOOD FENCE"});
    });
    addSmashCrateCluster(10, -10);
    addSmashCrateCluster(-16, 14);
    addSmashCrateCluster(38, -22);

    // 7. Summit Peak Beacon at (+58, -58) + Abandoned Barn Find + Winch Anchor
    const sumY = evalChapterTerrainY(mode, 58, -58);
    const sumBeacon = new THREE.Mesh(
      new THREE.CylinderGeometry(0.45, 0.45, 8.0, 12),
      new THREE.MeshBasicMaterial({color:0xff9f1a, transparent:true, opacity:0.75})
    );
    sumBeacon.position.set(58, sumY + 4.0, -58);
    parkGroup.add(sumBeacon);

    const bp = ch.barn || [-28.0, 24.0];
    const bgy = evalChapterTerrainY(mode, bp[0], bp[1]);
    const barnGrp = new THREE.Group();
    const rBody = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.95, 1.5), new THREE.MeshStandardMaterial({color:0x8c3b20, roughness:0.85, metalness:0.35}));
    rBody.position.y = 0.55; barnGrp.add(rBody);
    const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 4.5, 10), new THREE.MeshBasicMaterial({color:0x5bff9b, transparent:true, opacity:0.7}));
    beacon.position.y = 2.25; barnGrp.add(beacon);
    barnGrp.position.set(bp[0], bgy, bp[1]);
    parkGroup.add(barnGrp);
    CH3D.barnMesh = {x:bp[0], z:bp[1], mesh:barnGrp, taken:false};

    const ap = ch.anchor || [12.5, 1.4, 8.8];
    const agy = evalChapterTerrainY(mode, ap[0], ap[2]);
    CH3D.anchorPos.set(ap[0], agy + 0.9, ap[2]);
    const ancMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 2.0, 12), new THREE.MeshStandardMaterial({color:0xe23b3b, emissive:0x660000}));
    ancMesh.position.set(ap[0], agy + 1.0, ap[2]);
    parkGroup.add(ancMesh);

    // 8. Live Off-Road Outlaws Trail Missions (Guided by 3D Arrow!)
    CH3D.missions = [
      {title:"🚀 Hit the Stunt Ramp & Crush Cars Ahead!", x:18.0, z:0.0, r:5.5, reward:35, done:false},
      {title:"🪨 Crawl the Boulder Slab Garden (NE)!",   x:23.0, z:-23.0, r:5.5, reward:40, done:false},
      {title:"🏚️ Discover the Rusty Barn Find Chassis!", x:bp[0], z:bp[1], r:5.0, reward:60, done:false},
      {title:"💦 Power Through the Deep Mud Bog (SW)!",  x:-38.0, z:38.0, r:7.0, reward:50, done:false},
      {title:"🏔️ Climb High Mountain Summit Peak (+18m)!",x:58.0, z:-58.0, r:6.5, reward:80, done:false}
    ];
    CH3D.missionIdx = 0;
    CH3D.barnFound = false;
    $("#ch3dbarn").textContent = "0/1";
    const mEl = $("#ch3dmission");
    if(mEl) mEl.textContent = "🎯 " + CH3D.missions[0].title;
  };

  // Live 3D Map Builder: Drop ramps, crush cars, boulders, mud pits, or crates right in front of Jax's truck!
  const dropCustomObstacle = (kind)=>{
    if(!CH3D) return;
    const dist = 9.5;
    const dx = CH3D.x + Math.cos(CH3D.heading)*dist;
    const dz = CH3D.z - Math.sin(CH3D.heading)*dist;
    SFX.buy();
    if(kind==="ramp"){
      addRideableRamp(dx, dz, CH3D.heading, 6.5, 4.4, 2.05, 0xff8c1a);
      showMsg("📐 BIG STUNT RAMP DROPPED AHEAD!", 900);
    } else if(kind==="crush"){
      addCrushCarRow(dx, dz, CH3D.heading);
      showMsg("🚗 CRUSH CAR ROW DROPPED AHEAD!", 900);
    } else if(kind==="boulder"){
      for(let i=-1;i<=1;i++){
        const bx = dx + i*1.6*Math.sin(CH3D.heading), bz = dz + i*1.6*Math.cos(CH3D.heading);
        const by = evalChapterTerrainY(CHAPTERS_3D[CH3D.chIdx].mode, bx, bz);
        const rk = new THREE.Mesh(new THREE.DodecahedronGeometry(1.5,1), new THREE.MeshStandardMaterial({color:0x747b86, roughness:0.85}));
        rk.scale.set(1.3, 0.65, 1.2); rk.position.set(bx, by+0.35, bz);
        parkGroup.add(rk); rk.updateMatrixWorld(true);
        CH3D.rideableMeshes.push(rk);
      }
      showMsg("🪨 ROCK CRAWL LEDGE DROPPED AHEAD!", 900);
    } else if(kind==="mud"){
      const my = evalChapterTerrainY(CHAPTERS_3D[CH3D.chIdx].mode, dx, dz);
      const mp = new THREE.Mesh(new THREE.CircleGeometry(7.5, 24), new THREE.MeshStandardMaterial({color:0x3b2512, roughness:0.15, metalness:0.3}));
      mp.rotation.x = -Math.PI/2; mp.position.set(dx, my+0.08, dz);
      parkGroup.add(mp);
      CH3D.mudZones.push({x:dx, z:dz, r:7.5});
      showMsg("💦 DEEP MUD BOG DROPPED AHEAD!", 900);
    } else if(kind==="crates"){
      addSmashCrateCluster(dx, dz);
      showMsg("📦 SMASH CRATES DROPPED AHEAD!", 900);
    }
  };

  const loadChapterRoom = (idx)=>{
    if(!CH3D) return;
    const ch = CHAPTERS_3D[idx] || CHAPTERS_3D[0];
    CH3D.chIdx = idx;
    CH3D.x = 0; CH3D.z = 0; CH3D.y = evalChapterTerrainY(ch.mode, 0, 0);
    CH3D.vy = 0; CH3D.airborne = false; CH3D.heading = 0; CH3D.speed = 0; CH3D.winchActive = false;
    winchLine.visible = false;
    stage.style.background = `linear-gradient(180deg, ${ch.skyTop} 0%, ${ch.skyBot} 100%)`;
    renderer.setClearColor(new THREE.Color(ch.skyTop), 0.0);
    document.querySelectorAll("[data-ch3d]").forEach(b=>{
      b.style.background = (+b.dataset.ch3d===idx) ? "rgba(54,201,138,.92)" : "rgba(8,12,30,.75)";
    });
    while(envGroup.children.length) envGroup.remove(envGroup.children[0]);
    buildOpenWorldParkAndMissions(ch);

    const mount = (sc)=>{
      const cl = sc.clone(true);
      cl.scale.set(1.45, 1.15, 1.45);
      cl.updateMatrixWorld(true);
      cl.traverse(o=>{
        if(o.isMesh){
          o.receiveShadow=true; o.castShadow=true;
          const box = new THREE.Box3().setFromObject(o);
          const sz = box.getSize(new THREE.Vector3());
          const ctr = box.getCenter(new THREE.Vector3());
          // Skip giant base terrain slab; classify props as solid colliders vs rideable ramps/bridges/rocks
          if(sz.x < 34 && sz.z < 34){
            if(sz.y > 2.35 && Math.hypot(ctr.x, ctr.z) > 4.0){
              CH3D.obstacleColliders.push({x:ctr.x, z:ctr.z, r:Math.min(2.4, Math.max(sz.x, sz.z)*0.38), label:"🏔️ Obstacle"});
            } else if(sz.y > 0.15 && sz.y <= 2.35){
              CH3D.rideableMeshes.push(o);
            }
          }
        }
      });
      envGroup.add(cl);
    };
    if(chEnvCache[ch.glb]){ mount(chEnvCache[ch.glb]); }
    else {
      new THREE.GLTFLoader().load(ch.glb, gltf=>{
        chEnvCache[ch.glb] = gltf.scene;
        mount(gltf.scene);
      });
    }
    showMsg(ch.emoji+" "+ch.name+" (360m Open Park)", 1100);
  };

  document.querySelectorAll("[data-ch3d]").forEach(b=>{
    b.onclick = ()=>{ SFX.tap(); loadChapterRoom(+b.dataset.ch3d); };
  });

  // Toggle Map Builder Toolbar
  const bMap = $("#btn_mapbuilder");
  if(bMap) bMap.onclick = ()=>{
    const bar = $("#mapbuilder_bar");
    if(!bar) return;
    const show = bar.style.display === "none";
    bar.style.display = show ? "flex" : "none";
    SFX.tap();
  };
  document.querySelectorAll("[data-drop]").forEach(b=>{
    b.onclick = ()=>dropCustomObstacle(b.dataset.drop);
  });

  // Camera Mode Cycle
  const bCam = $("#btn_cam");
  if(bCam) bCam.onclick = ()=>{
    CH3D.camMode = (CH3D.camMode + 1) % 3;
    const names = ["Chase Cam", "Wide Action Cam", "Close Crawl Cam"];
    SFX.tap(); showMsg("🎥 " + names[CH3D.camMode], 750);
  };

  // Wire Off-Road Outlaws Drivetrain Controls
  const b4 = $("#btn_4wd");
  if(b4) b4.onclick = ()=>{
    CH3D.fourWD = !CH3D.fourWD; SFX.tap();
    b4.textContent = CH3D.fourWD ? "4WD" : "2WD";
    b4.style.background = CH3D.fourWD ? "rgba(55,196,106,.88)" : "rgba(8,12,30,.82)";
  };
  const bLow = $("#btn_low");
  if(bLow) bLow.onclick = ()=>{
    CH3D.lowGear = !CH3D.lowGear; SFX.tap();
    bLow.style.background = CH3D.lowGear ? "rgba(255,140,26,.92)" : "rgba(8,12,30,.82)";
    showMsg(CH3D.lowGear ? "⚙️ LOW RANGE CRAWL (2.5x Torque)" : "⚙️ HIGH RANGE GEAR", 850);
  };
  const bDiff = $("#btn_diff");
  if(bDiff) bDiff.onclick = ()=>{
    CH3D.diffLock = !CH3D.diffLock; SFX.tap();
    bDiff.style.background = CH3D.diffLock ? "rgba(47,143,255,.92)" : "rgba(8,12,30,.82)";
    showMsg(CH3D.diffLock ? "🔒 AXLE DIFFS LOCKED" : "🔓 DIFFS OPEN", 800);
  };
  const bWinch = $("#btn_winch");
  if(bWinch) bWinch.onclick = ()=>{
    CH3D.winchActive = !CH3D.winchActive; SFX.tap();
    winchLine.visible = CH3D.winchActive;
    bWinch.textContent = CH3D.winchActive ? "🪝 PULLING" : "🪝 WINCH";
    bWinch.style.background = CH3D.winchActive ? "rgba(55,196,106,.92)" : "rgba(226,59,59,.88)";
    if(CH3D.winchActive) showMsg("🪝 WINCH HOOKED TO ANCHOR!", 900);
  };

  // Switch across all 4 Star Rigs!
  const bSwap = $("#ch3drigswap");
  if(bSwap) bSwap.onclick = ()=>{
    const curIdx = STAR_RIGS.indexOf(CH3D.vType);
    const nextRig = STAR_RIGS[(curIdx + 1) % STAR_RIGS.length];
    state.current = nextRig; save(); SFX.buy();
    mountActiveRig(nextRig);
    const vObj = VEHICLES[nextRig];
    showMsg(`${vObj.emoji} ${vObj.name} Deployed!`, 1000);
  };

  const liftBtn = $("#ch3dlift");
  if(liftBtn){
    liftBtn.style.background = vCfg.lift ? "rgba(255,140,26,.92)" : "rgba(8,12,30,.82)";
    liftBtn.onclick = ()=>{
      CH3D.vCfg.lift = !CH3D.vCfg.lift;
      cfg(CH3D.vType).lift = CH3D.vCfg.lift; save();
      liftBtn.style.background = CH3D.vCfg.lift ? "rgba(255,140,26,.92)" : "rgba(8,12,30,.82)";
      SFX.tap();
    };
  }

  const ex = $("#ch3dexit");
  if(ex) ex.onclick = ()=>{ stop3DChapterMode(); setScreen("garage"); };

  const bindBtn = (sel, k)=>{
    const b = $(sel); if(!b) return;
    b.onpointerdown = e=>{ e.preventDefault(); if(CH3D) CH3D.input[k]=true; };
    b.onpointerup = b.onpointerleave = b.onpointercancel = ()=>{ if(CH3D) CH3D.input[k]=false; };
  };
  bindBtn("#c3gas","gas"); bindBtn("#c3rev","rev"); bindBtn("#c3left","left"); bindBtn("#c3right","right"); bindBtn("#c3nitro","nitro");

  CH3D._kd = e=>{
    if(!CH3D) return;
    if(["ArrowUp","w","W"," "].includes(e.key)){ CH3D.input.gas=true; e.preventDefault(); }
    if(["ArrowDown","s","S"].includes(e.key)){ CH3D.input.rev=true; e.preventDefault(); }
    if(["ArrowLeft","a","A"].includes(e.key)){ CH3D.input.left=true; e.preventDefault(); }
    if(["ArrowRight","d","D"].includes(e.key)){ CH3D.input.right=true; e.preventDefault(); }
    if(["Shift","n","N"].includes(e.key)){ CH3D.input.nitro=true; }
  };
  CH3D._ku = e=>{
    if(!CH3D) return;
    if(["ArrowUp","w","W"," "].includes(e.key)) CH3D.input.gas=false;
    if(["ArrowDown","s","S"].includes(e.key)) CH3D.input.rev=false;
    if(["ArrowLeft","a","A"].includes(e.key)) CH3D.input.left=false;
    if(["ArrowRight","d","D"].includes(e.key)) CH3D.input.right=false;
    if(["Shift","n","N"].includes(e.key)) CH3D.input.nitro=false;
  };
  document.addEventListener("keydown", CH3D._kd);
  document.addEventListener("keyup", CH3D._ku);

  loadChapterRoom(CH3D.chIdx);
  CH3D.raf = requestAnimationFrame(step3DChapterFrame);
}

function stop3DChapterMode(){
  if(!CH3D) return;
  if(CH3D.raf) cancelAnimationFrame(CH3D.raf);
  if(CH3D._kd) document.removeEventListener("keydown", CH3D._kd);
  if(CH3D._ku) document.removeEventListener("keyup", CH3D._ku);
  CH3D = null;
}

function sampleWheelHeight3D(mode, wx, wz){
  let h = evalChapterTerrainY(mode, wx, wz);
  if(CH3D && CH3D.rideableMeshes.length){
    CH3D.raycaster.set(new THREE.Vector3(wx, h + 12.0, wz), new THREE.Vector3(0, -1, 0));
    const hits = CH3D.raycaster.intersectObjects(CH3D.rideableMeshes, true);
    if(hits.length > 0 && hits[0].point.y > h && hits[0].point.y < h + 6.5){
      h = hits[0].point.y;
    }
  }
  return h;
}

function step3DChapterFrame(now){
  if(!CH3D) return;
  CH3D.raf = requestAnimationFrame(step3DChapterFrame);
  if(!CH3D.last) CH3D.last = now;
  const dt = Math.min((now - CH3D.last)/1000, 0.05);
  CH3D.last = now;

  const ch = CHAPTERS_3D[CH3D.chIdx] || CHAPTERS_3D[0];
  const inp = CH3D.input;
  const st = carStats(CH3D.vType, CH3D.vCfg);

  // Check if inside a Deep Mud Bog Zone
  let inMud = false;
  for(const mz of CH3D.mudZones){
    if(Math.hypot(CH3D.x - mz.x, CH3D.z - mz.z) < mz.r){ inMud = true; break; }
  }
  const mudDrag = inMud ? (CH3D.fourWD ? (CH3D.diffLock ? 0.82 : 0.65) : 0.35) : 1.0;
  if(inMud && Math.abs(CH3D.speed) > 1.5){
    CH3D.vCfg.mudLevel = Math.min(1.0, (CH3D.vCfg.mudLevel||0) + dt*0.2);
  }

  const nitroMult  = inp.nitro ? 1.65 : 1.0;
  const lowMultSpd = CH3D.lowGear ? 0.58 : 1.0;
  const lowMultAcc = CH3D.lowGear ? 1.95 : 1.0;
  const fourMult   = CH3D.fourWD  ? 1.25 : 0.88;
  const diffMult   = CH3D.diffLock? 1.20 : 1.0;

  const maxSpd = (14.5 + st.speed * 0.065) * lowMultSpd * nitroMult * mudDrag;
  const accel  = (15.5 + st.power * 0.085) * lowMultAcc * fourMult * diffMult * nitroMult;

  if(inp.gas || inp.nitro) CH3D.speed += accel * dt;
  else if(inp.rev) CH3D.speed -= accel * 0.85 * dt;
  else CH3D.speed *= (1 - (inMud ? 4.2 : 2.0) * dt);

  if(CH3D.winchActive){
    const ax = CH3D.anchorPos.x - CH3D.x, az = CH3D.anchorPos.z - CH3D.z;
    const adist = Math.hypot(ax, az);
    if(adist > 2.0){
      CH3D.x += (ax / adist) * 7.5 * dt;
      CH3D.z += (az / adist) * 7.5 * dt;
      CH3D.heading = Math.atan2(-az, ax);
    } else {
      CH3D.winchActive = false;
      CH3D.winchLine.visible = false;
      const bw = $("#btn_winch"); if(bw){ bw.textContent="🪝 WINCH"; bw.style.background="rgba(226,59,59,.88)"; }
      showMsg("✅ WINCH RECOVERY COMPLETE!", 900);
    }
    const posArr = CH3D.winchLine.geometry.attributes.position;
    posArr.setXYZ(0, CH3D.x + Math.cos(CH3D.heading)*2.1, CH3D.y + 0.85, CH3D.z - Math.sin(CH3D.heading)*2.1);
    posArr.setXYZ(1, CH3D.anchorPos.x, CH3D.anchorPos.y, CH3D.anchorPos.z);
    posArr.needsUpdate = true;
  }

  CH3D.speed = Math.max(-maxSpd*0.55, Math.min(maxSpd, CH3D.speed));
  const mphEl = $("#ch3dmph");
  if(mphEl) mphEl.textContent = Math.round(Math.abs(CH3D.speed) * 3.4);

  const steerLimit = CH3D.diffLock ? 0.42 : 0.56;
  const targetSteer = (inp.left ? steerLimit : 0) + (inp.right ? -steerLimit : 0);
  CH3D.steer += (targetSteer - CH3D.steer) * Math.min(1, dt * 10);

  if(Math.abs(CH3D.speed) > 0.15){
    CH3D.heading += CH3D.steer * (CH3D.speed / Math.max(8, maxSpd)) * 2.15 * dt;
  }

  const prevY = CH3D.y;
  let nextX = CH3D.x + Math.cos(CH3D.heading) * CH3D.speed * dt;
  let nextZ = CH3D.z - Math.sin(CH3D.heading) * CH3D.speed * dt;

  // Solid Obstacle Collisions (Trees, Buildings, Rock Pillars - No Ghosting Through!)
  const truckR = 1.65;
  for(const ob of CH3D.obstacleColliders){
    const dx = nextX - ob.x, dz = nextZ - ob.z;
    const dist = Math.hypot(dx, dz), minD = truckR + ob.r;
    if(dist < minD && dist > 0.001){
      const nx = dx / dist, nz = dz / dist;
      nextX = ob.x + nx * (minD + 0.08);
      nextZ = ob.z + nz * (minD + 0.08);
      if(Math.abs(CH3D.speed) > 3.0){
        SFX.crash();
        CH3D.shakeTime = 0.28;
        showMsg(`💥 CRUNCH! Hit ${ob.label}!`, 700);
      }
      CH3D.speed *= -0.35;
    }
  }

  // Open-World 360m Boundary (±162m Canyon Rim)
  CH3D.x = Math.max(-162, Math.min(162, nextX));
  CH3D.z = Math.max(-162, Math.min(162, nextZ));
  CH3D.wheelSpin = (CH3D.wheelSpin + CH3D.speed * 2.1 * dt) % (Math.PI * 2);

  // 4-Wheel Downward Raycast Height Sampling (Climbs Ramps, Boulders, Bridges & Crush Cars!)
  const chCos = Math.cos(CH3D.heading), chSin = Math.sin(CH3D.heading);
  const wWorld = (lx, lz)=>[CH3D.x + lx*chCos + lz*chSin, CH3D.z - lx*chSin + lz*chCos];
  const pFL = wWorld( 1.42, -0.98), pFR = wWorld( 1.42,  0.98);
  const pRL = wWorld(-1.42, -0.98), pRR = wWorld(-1.42,  0.98);
  const hFL = sampleWheelHeight3D(ch.mode, pFL[0], pFL[1]);
  const hFR = sampleWheelHeight3D(ch.mode, pFR[0], pFR[1]);
  const hRL = sampleWheelHeight3D(ch.mode, pRL[0], pRL[1]);
  const hRR = sampleWheelHeight3D(ch.mode, pRR[0], pRR[1]);

  const groundH = (hFL + hFR + hRL + hRR) * 0.25;
  const targetPitch = Math.atan2(((hFL+hFR)*0.5) - ((hRL+hRR)*0.5), 2.84);
  const targetRoll  = Math.atan2(((hFR+hRR)*0.5) - ((hFL+hRL)*0.5), 1.96);

  // Real Vertical Launch & Big Air Gravity Physics!
  if(!CH3D.airborne){
    const slopeVy = (groundH - prevY) / Math.max(dt, 0.008);
    if(CH3D.y > groundH + 0.32 && CH3D.vy > 1.2){
      CH3D.airborne = true;
      CH3D.jumpStartPos = {x:CH3D.x, z:CH3D.z};
    } else {
      CH3D.y = groundH;
      CH3D.vy = Math.max(0, slopeVy) + (Math.abs(CH3D.speed) * Math.max(0, Math.sin(CH3D.pitch)) * 0.85);
      if(CH3D.pitch > 0.16 && Math.abs(CH3D.speed) > 9.0){
        CH3D.vy = Math.abs(CH3D.speed) * Math.sin(CH3D.pitch) * 1.25;
      }
    }
  }
  if(CH3D.airborne){
    CH3D.vy -= 21.0 * dt;
    CH3D.y  += CH3D.vy * dt;
    CH3D.pitch *= (1 - 1.2*dt);
    if(CH3D.y <= groundH){
      CH3D.y = groundH;
      CH3D.vy = 0;
      CH3D.airborne = false;
      if(CH3D.jumpStartPos){
        const jumpFt = Math.round(Math.hypot(CH3D.x - CH3D.jumpStartPos.x, CH3D.z - CH3D.jumpStartPos.z) * 3.28);
        if(jumpFt >= 18){
          const bonus = Math.min(80, Math.round(jumpFt * 0.6));
          CH3D.coins += bonus; addCoins(bonus); addXP(15); SFX.coin();
          if(jumpFt > CH3D.bestAirFt){
            CH3D.bestAirFt = jumpFt;
            const aEl = $("#ch3dair"); if(aEl) aEl.textContent = jumpFt + " ft";
          }
          $("#ch3dcoins").textContent = CH3D.coins;
          showMsg(`🚀 ${jumpFt} FT BIG AIR JUMP! +🪙${bonus}`, 1300);
        }
        CH3D.jumpStartPos = null;
      }
    }
  } else {
    CH3D.pitch += (targetPitch - CH3D.pitch) * Math.min(1, dt * 11);
    CH3D.roll  += (targetRoll  - CH3D.roll)  * Math.min(1, dt * 11);
  }

  CH3D.carHolder.position.set(CH3D.x, CH3D.y, CH3D.z);
  CH3D.carHolder.rotation.order = "YXZ";
  CH3D.carHolder.rotation.y = CH3D.heading;
  CH3D.carHolder.rotation.z = CH3D.pitch;
  CH3D.carHolder.rotation.x = CH3D.roll;

  const rig = CH3D.carHolder.userData && CH3D.carHolder.userData.rig;
  if(rig){
    const flexFactor = (CH3D.vCfg.suspType==="solid") ? 1.65 : 1.20;
    const fTrav = CH3D.airborne ? -0.14 : Math.max(-0.18, Math.min(0.18, ((hFL+hFR)*0.5 - groundH)*flexFactor));
    const rTrav = CH3D.airborne ? -0.14 : Math.max(-0.18, Math.min(0.18, ((hRL+hRR)*0.5 - groundH)*flexFactor));
    const axleTwist = CH3D.airborne ? 0 : Math.max(-0.28, Math.min(0.28, ((hFL - hFR) - (hRL - hRR))*0.78 + Math.sin(now*0.006)*Math.abs(CH3D.speed)*0.012));
    applyRiggedPose(rig, CH3D.steer, CH3D.wheelSpin, fTrav, rTrav, axleTwist, !!CH3D.vCfg.lift);
  }

  // Smashable Fences & Crates Physics
  CH3D.smashables.forEach(sm=>{
    if(!sm.hit){
      if(Math.hypot(CH3D.x - sm.x, CH3D.z - sm.z) < 2.35){
        sm.hit = true;
        sm.vx = Math.cos(CH3D.heading) * Math.max(8, Math.abs(CH3D.speed)*1.2) + (Math.random()-0.5)*4;
        sm.vz = -Math.sin(CH3D.heading) * Math.max(8, Math.abs(CH3D.speed)*1.2) + (Math.random()-0.5)*4;
        sm.vy = 6.5 + Math.random()*3.5;
        CH3D.coins += 15; addCoins(15); addXP(10); SFX.buy();
        $("#ch3dcoins").textContent = CH3D.coins;
        showMsg(`💥 ${sm.label} SMASHED! +🪙15`, 850);
      }
    } else if(sm.mesh.visible){
      sm.vy -= 19.0 * dt;
      sm.mesh.position.x += sm.vx * dt;
      sm.mesh.position.y += sm.vy * dt;
      sm.mesh.position.z += sm.vz * dt;
      sm.mesh.rotation.x += 5.0 * dt;
      sm.mesh.rotation.z += 4.0 * dt;
      if(sm.mesh.position.y < -4.0) sm.mesh.visible = false;
    }
  });

  // Crush Cars Flattening when driven over!
  CH3D.crushCars.forEach(cc=>{
    if(!cc.crushed && Math.hypot(CH3D.x - cc.x, CH3D.z - cc.z) < 2.4 && CH3D.y > cc.mesh.position.y - 0.2){
      cc.crushed = true;
      cc.mesh.scale.y = 0.38;
      cc.mesh.position.y -= 0.26;
      cc.mesh.updateMatrixWorld(true);
      CH3D.coins += 20; addCoins(20); addXP(15); SFX.crash();
      $("#ch3dcoins").textContent = CH3D.coins;
      showMsg("🚗 MONSTER CAR CRUSH! +🪙20", 950);
    }
  });

  // Hidden Barn Find Discovery
  if(CH3D.barnMesh && !CH3D.barnMesh.taken){
    if(Math.hypot(CH3D.x - CH3D.barnMesh.x, CH3D.z - CH3D.barnMesh.z) < 3.6){
      CH3D.barnMesh.taken = true;
      CH3D.barnMesh.mesh.visible = false;
      CH3D.coins += 75; addCoins(75); addXP(45); SFX.level(); confettiBurst();
      $("#ch3dbarn").textContent = "1/1";
      $("#ch3dcoins").textContent = CH3D.coins;
      showMsg("🏚️ BARN FIND DISCOVERED! +🪙75 · +⭐45 XP!", 1600);
    }
  }

  // Active Trail Mission & 3D Directional Arrow above Truck
  const curM = CH3D.missions[CH3D.missionIdx];
  if(curM){
    CH3D.arrowGrp.visible = true;
    CH3D.arrowGrp.position.set(CH3D.x, CH3D.y + 2.55 + Math.sin(now*0.005)*0.12, CH3D.z);
    const mAng = Math.atan2(-(curM.z - CH3D.z), curM.x - CH3D.x);
    CH3D.arrowGrp.rotation.y = mAng;
    if(Math.hypot(CH3D.x - curM.x, CH3D.z - curM.z) < curM.r){
      curM.done = true;
      CH3D.coins += curM.reward; addCoins(curM.reward); addXP(25); SFX.level();
      $("#ch3dcoins").textContent = CH3D.coins;
      CH3D.missionIdx = (CH3D.missionIdx + 1) % CH3D.missions.length;
      const nxt = CH3D.missions[CH3D.missionIdx];
      const mEl = $("#ch3dmission");
      if(mEl) mEl.textContent = "🎯 " + nxt.title;
      showMsg(`🏆 MISSION COMPLETE! +🪙${curM.reward} → Next: ${nxt.title}`, 1500);
    }
  }

  // Camera Modes + Impact Shake
  const camPresets = [[8.0, 3.3], [12.5, 5.2], [5.4, 2.2]];
  const cp = camPresets[CH3D.camMode || 0];
  const tx = CH3D.x - Math.cos(CH3D.heading) * cp[0];
  const tz = CH3D.z + Math.sin(CH3D.heading) * cp[0];
  const ty = CH3D.y + cp[1];
  CH3D.camera.position.x += (tx - CH3D.camera.position.x) * Math.min(1, dt * 7);
  CH3D.camera.position.z += (tz - CH3D.camera.position.z) * Math.min(1, dt * 7);
  CH3D.camera.position.y += (ty - CH3D.camera.position.y) * Math.min(1, dt * 7);
  if(CH3D.shakeTime > 0){
    CH3D.shakeTime -= dt;
    CH3D.camera.position.x += (Math.random()-0.5)*0.35;
    CH3D.camera.position.y += (Math.random()-0.5)*0.35;
  }
  CH3D.camera.lookAt(CH3D.x + Math.cos(CH3D.heading)*2.2, CH3D.y + 1.0, CH3D.z - Math.sin(CH3D.heading)*2.2);

  CH3D.renderer.render(CH3D.scene, CH3D.camera);
}


let _bkd=null,_bku=null;
function bindBattleInput(){
  const hook=(id,pi,key)=>{ const b=$(id); if(!b) return;
    b.onpointerdown=e=>{ e.preventDefault(); if(BATTLE) BATTLE.input[pi][key]=true; };
    b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{ if(BATTLE) BATTLE.input[pi][key]=false; }; };
  hook("#b1f",0,"f"); hook("#b1b",0,"b"); hook("#b2f",1,"f"); hook("#b2b",1,"b");
  _bkd=e=>{ if(!BATTLE) return;
    if(e.key==="d"||e.key==="D"){ BATTLE.input[0].f=true; e.preventDefault(); }
    if(e.key==="a"||e.key==="A"){ BATTLE.input[0].b=true; e.preventDefault(); }
    if(e.key==="ArrowLeft"){ BATTLE.input[1].f=true; e.preventDefault(); }
    if(e.key==="ArrowRight"){ BATTLE.input[1].b=true; e.preventDefault(); } };
  _bku=e=>{ if(!BATTLE) return;
    if(e.key==="d"||e.key==="D") BATTLE.input[0].f=false;
    if(e.key==="a"||e.key==="A") BATTLE.input[0].b=false;
    if(e.key==="ArrowLeft") BATTLE.input[1].f=false;
    if(e.key==="ArrowRight") BATTLE.input[1].b=false; };
  document.addEventListener("keydown",_bkd);
  document.addEventListener("keyup",_bku);
}
function unbindBattleInput(){
  if(_bkd) document.removeEventListener("keydown",_bkd);
  if(_bku) document.removeEventListener("keyup",_bku);
  _bkd=_bku=null;
}

function bVel(c){
  if(c.grounded){ const a=bSlope(c.x); return {x:c.speed*Math.cos(a), y:c.speed*Math.sin(a)}; }
  return {x:c.vx, y:c.vy};
}

function stepBattle(dt){
  const B=BATTLE; if(!B) return;
  if(B.phase==="count"){
    if(performance.now()-B.phaseT>=2400) B.phase="play";
    return;
  }
  const play=B.phase==="play";
  B.cars.forEach((c,i)=>{
    if(c.ko) return;
    const inp=play?B.input[i]:{f:false,b:false};
    if(c.grounded){
      const a=bSlope(c.x);
      c.speed += (inp.f?BT.ACCEL*c.dir:0)*dt;
      c.speed -= (inp.b?BT.ACCEL*0.7*c.dir:0)*dt;
      c.speed += BT.GSLOPE*Math.sin(a)*dt;          // bowl walls roll you back in
      c.speed -= c.speed*BT.FRICT*dt;
      c.speed=Math.max(-BT.MAX,Math.min(BT.MAX,c.speed));
      c.x += c.speed*Math.cos(a)*dt;
      c.y=bY(c.x); c.angle=bSlope(c.x);
    } else {
      c.vy += BT.G*dt;
      c.x += c.vx*dt; c.y += c.vy*dt;
      c.angVel *= (1-0.04*dt);
      c.angle += c.angVel*dt;
      const g=bY(c.x);
      if(c.y>=g){                                    // landed
        const ga=bSlope(c.x);
        let diff=c.angle-ga;
        while(diff>Math.PI) diff-=2*Math.PI;
        while(diff<-Math.PI) diff+=2*Math.PI;
        if(!play || Math.abs(diff)<BT.KO_TILT){
          c.grounded=true; c.y=g; c.angle=ga; c.speed=c.vx; c.angVel=0;
        } else {                                     // landed on the roof
          c.ko=true; SFX.crash(); battleRoundOver(1-i);
        }
      }
    }
    if(play && Math.abs(c.x)>760 && !c.ko){ c.ko=true; battleRoundOver(1-i); }
  });
  if(play){ battleCollide(); battleHeadCheck(); }
}

function battleCollide(){
  const B=BATTLE, c1=B.cars[0], c2=B.cars[1];
  if(c1.ko||c2.ko) return;
  const d1=carDims(c1.type), d2=carDims(c2.type);
  const r1=d1.bw*0.42, r2=d2.bw*0.42;
  const dx=c2.x-c1.x, dy=(c2.y-28)-(c1.y-28);
  const dist=Math.hypot(dx,dy), min=r1+r2;
  if(dist>=min||dist===0) return;
  const nx=dx/dist, ny=dy/dist;
  const m1=c1.mass, m2=c2.mass, tot=m1+m2;
  // push apart (heavier car budges less)
  const push=(min-dist)+2;
  c1.x -= nx*push*(m2/tot); c2.x += nx*push*(m1/tot);
  const v1=bVel(c1), v2=bVel(c2);
  const rel=(v1.x-v2.x)*nx+(v1.y-v2.y)*ny;           // closing speed along normal
  if(rel>60){                                         // real bonk -> both go flying
    const e=0.75, j=(1+e)*rel/(1/m1+1/m2);
    const pop=Math.min(430, 90+rel*0.5);
    c1.grounded=false; c1.vx=v1.x-j*nx/m1; c1.vy=Math.min(v1.y,0)-pop*(m2/tot)*1.7;
    c2.grounded=false; c2.vx=v2.x+j*nx/m2; c2.vy=Math.min(v2.y,0)-pop*(m1/tot)*1.7;
    c1.angVel -= rel*0.004*(m2/tot)*2;
    c2.angVel += rel*0.004*(m1/tot)*2;
    SFX.crash(); showMsg("💥 BONK!",500);
  }
}

// world position of the driver's head (mirrored cars flip local x)
function headPos(c){
  const d=carDims(c.type), sc=c.lift?1.18:1;
  const maxR=Math.max(d.fr*sc,d.rr*sc);
  const top=-(maxR+d.bh*0.5+2)+(c.lift?-8:0)-d.bh/2;
  const px=-d.bw*0.08*c.dir, py=top-16;
  const ca=Math.cos(c.angle), sa=Math.sin(c.angle);
  return [c.x+px*ca-py*sa, c.y+px*sa+py*ca];
}
// world positions of a car's hard points (bumpers, wheels, roof corners)
function carPts(c){
  const d=carDims(c.type), sc=c.lift?1.18:1;
  const fr=d.fr*sc, rr=d.rr*sc, maxR=Math.max(fr,rr);
  const by=-(maxR+d.bh*0.5+2)+(c.lift?-8:0);
  const pts=[[d.bw/2,by],[-d.bw/2,by],[d.dx,-fr],[-d.dx,-rr],
             [d.bw/2,by-d.bh/2],[-d.bw/2,by-d.bh/2]];
  const ca=Math.cos(c.angle), sa=Math.sin(c.angle);
  return pts.map(p=>{ const px=p[0]*c.dir, py=p[1];
    return [c.x+px*ca-py*sa, c.y+px*sa+py*ca]; });
}
function battleHeadCheck(){
  const B=BATTLE, c1=B.cars[0], c2=B.cars[1];
  if(c1.ko||c2.ko) return;
  if(Math.abs(c1.x-c2.x)>200) return;
  const h1=headPos(c1), h2=headPos(c2);
  const R2=BT.HEAD_R*BT.HEAD_R;
  const hit=(pts,h)=>pts.some(p=>{ const dx=p[0]-h[0], dy=p[1]-h[1]; return dx*dx+dy*dy<R2; });
  const p1HitsP2=hit(carPts(c1),h2), p2HitsP1=hit(carPts(c2),h1);
  if(p1HitsP2 && !p2HitsP1){ c2.ko=true; battleRoundOver(0); }
  else if(p2HitsP1 && !p1HitsP2){ c1.ko=true; battleRoundOver(1); }
  // both at once = a clash, play on
}

function battleRoundOver(winnerIdx){
  const B=BATTLE; if(!B||B.phase!=="play") return;
  B.phase="roundend"; B.phaseT=performance.now();
  B.score[winnerIdx]++;
  SFX.coin();
  showMsg((winnerIdx===0?"🔴 P1":"🔵 P2")+" scores! 💥",1300);
  if(B.score[winnerIdx]>=3){ B.over=true; B.winner=winnerIdx; }
}

function battleFrame(t){
  const B=BATTLE; if(!B) return;
  if(!B.last) B.last=t;
  let dt=(t-B.last)/1000; B.last=t; dt=Math.min(dt,0.05);
  B.acc+=dt;
  const STEP=1/120; let guard=0;
  while(B.acc>=STEP && guard++<8){ stepBattle(STEP); B.acc-=STEP; }
  drawBattle();
  if(B.phase==="roundend" && performance.now()-B.phaseT>1500){
    if(B.over){ battleMatchOver(); return; }
    B.cars=[battleCarFor(0),battleCarFor(1)]; B.round++;
    B.phase="count"; B.phaseT=performance.now();
  }
  braf=requestAnimationFrame(battleFrame);
}

function battleMatchOver(){
  const B=BATTLE, w=B.winner, score=B.score.slice();
  stopBattle();
  addCoins(60); addXP(30);
  showModal(`
    <div class="big-emoji">🏆</div>
    <h3>${w===0?"🔴 Player 1":"🔵 Player 2"} wins the battle!</h3>
    <p style="font-size:22px;font-weight:900;margin:2px 0 8px">${score[0]} — ${score[1]}</p>
    <p><span style="color:var(--coin)">+🪙60 · +⭐30 XP</span> for an epic battle!</p>
    <button class="btn green" onclick="battleAgain()">⚔️ Battle again</button>
    <button class="btn gray sm" style="margin-top:8px" onclick="exitDrive()">🔧 Back to Garage</button>`);
}
window.battleAgain=function(){ closeModal(); startBattle(); };

function drawBattleCar(c){
  const ctx=dctx, d=carDims(c.type);
  const sc=c.lift?1.18:1, liftY=c.lift?-8:0;
  const fr=d.fr*sc, rr=d.rr*sc, maxR=Math.max(fr,rr);
  ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.angle);
  if(c.dir<0) ctx.scale(-1,1);
  drawWheelC(ctx,-d.dx,-rr,rr,c.rim,c.wheel);
  drawWheelC(ctx, d.dx,-fr,fr,c.rim,c.wheel);
  const by=-(maxR+d.bh*0.5+2)+liftY, top=by-d.bh/2;
  const grad=ctx.createLinearGradient(0,top,0,by+d.bh/2);
  grad.addColorStop(0,shade(c.paint,0.28)); grad.addColorStop(.5,c.paint); grad.addColorStop(1,shade(c.paint,-0.28));
  roundRectPath(-d.bw/2,top,d.bw,d.bh,8);
  ctx.fillStyle=grad; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle=shade(c.paint,-0.4); ctx.stroke();
  if(c.type!=="moto"){
    roundRectPath(-d.bw*0.16,top-12,d.bw*0.5,13,4);
    ctx.fillStyle=c.tint?"#33414f":"#bfe6ff"; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(d.bw*0.5-3,by,3,0,7); ctx.fillStyle="#fff3b0"; ctx.fill();
  // the driver's head — this is the target! Helmet = player color.
  ctx.beginPath(); ctx.arc(-d.bw*0.08,top-16,6.5,0,7); ctx.fillStyle="#f1c8a0"; ctx.fill();
  ctx.beginPath(); ctx.arc(-d.bw*0.08,top-18,7.5,Math.PI,2*Math.PI);
  ctx.fillStyle=c.dir>0?"#e23b3b":"#2f8fff"; ctx.fill();
  ctx.restore();
}

function drawBattle(){
  if(!dctx||!dcv||!dcv._w) return;
  const B=BATTLE, W=dcv._w, H=dcv._h;
  const c1=B.cars[0], c2=B.cars[1];
  // sunset arena sky
  const sky=dctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#ffb35a"); sky.addColorStop(.55,"#ffd9a0"); sky.addColorStop(1,"#ffeccd");
  dctx.fillStyle=sky; dctx.fillRect(0,0,W,H);
  // camera: keep both cars in view
  const midX=(c1.x+c2.x)/2, midY=(c1.y+c2.y)/2-60;
  const span=Math.abs(c1.x-c2.x)+460;
  const zoom=Math.min(1.05, W/span);
  dctx.save();
  dctx.translate(W/2,H*0.60); dctx.scale(zoom,zoom); dctx.translate(-midX,-midY);
  const x0=midX-(W/2)/zoom-80, x1=midX+(W/2)/zoom+80;
  dctx.beginPath(); dctx.moveTo(x0,1400);
  for(let x=x0;x<=x1;x+=10) dctx.lineTo(x,bY(x));
  dctx.lineTo(x1,1400); dctx.closePath();
  dctx.fillStyle="#7a5a36"; dctx.fill();
  dctx.beginPath();
  for(let x=x0,f=1;x<=x1;x+=10,f=0){ const y=bY(x); f?dctx.moveTo(x,y):dctx.lineTo(x,y); }
  dctx.lineWidth=7; dctx.strokeStyle="#5fbf4f"; dctx.stroke();
  // center mark
  dctx.font="36px serif"; dctx.textAlign="center";
  dctx.fillText("⚔️", 0, bY(0)-120);
  drawBattleCar(c1); drawBattleCar(c2);
  dctx.restore();
  // countdown
  if(B.phase==="count"){
    const el2=performance.now()-B.phaseT;
    const n=el2<800?"3":el2<1600?"2":"1";
    dctx.save(); dctx.textAlign="center"; dctx.font="900 68px Segoe UI, sans-serif";
    dctx.lineWidth=5; dctx.strokeStyle="rgba(0,0,0,.55)"; dctx.fillStyle="#ffd14d";
    dctx.strokeText(n,W/2,H*0.40); dctx.fillText(n,W/2,H*0.40);
    if(B.round===1){
      dctx.font="800 17px Segoe UI, sans-serif"; dctx.lineWidth=3;
      const tip="Bonk the other driver's HEAD! First to 3 wins";
      dctx.strokeText(tip,W/2,H*0.40+40); dctx.fillStyle="#fff"; dctx.fillText(tip,W/2,H*0.40+40);
    }
    dctx.restore();
  }
  const s1=$("#bs1"), s2=$("#bs2"), rn=$("#brnd");
  if(s1) s1.textContent=B.score[0];
  if(s2) s2.textContent=B.score[1];
  if(rn) rn.textContent=B.round;
}

/* --------------------------- DAILY REWARD --------------------------------
   A once-a-day gift that grows with a consecutive-day streak (caps at day 7).
   Miss a day and the streak starts over. Keeps kids coming back. */
function dayKey(offsetDays){
  const d=new Date(Date.now()+(offsetDays||0)*86400000);
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function dailyCheck(){
  const today=dayKey(0);
  if(state.lastDaily===today) return;
  const kept = state.lastDaily && state.lastDaily===dayKey(-1);   // played yesterday too?
  state.streak = kept ? (state.streak||0)+1 : 1;
  state.lastDaily = today; save();
  const n=Math.min(7,state.streak);
  const coins=25+n*10, xp=10+n*5;
  const days=[1,2,3,4,5,6,7].map(d=>
    `<span style="font-size:20px;opacity:${d<=n?1:0.28}">${d<=n?"🪙":"⚪"}</span>`).join(" ");
  showModal(`
    <div class="big-emoji">🎁</div>
    <h3>Daily Reward!</h3>
    <p>Day <b>${state.streak}</b> in a row${state.streak>1?" — streak bonus!":""}${state.streak>=7?" 🔥 MAX!":""}</p>
    <div style="margin:4px 0 10px">${days}</div>
    <p style="font-size:17px;color:var(--coin);font-weight:900">+🪙${coins} &nbsp; +⭐${xp} XP</p>
    <button class="btn gold" onclick="claimDaily(${coins},${xp})">Claim! 🎉</button>`);
}
window.claimDaily=function(coins,xp){
  closeModal(); SFX.buy(); addCoins(coins); addXP(xp);
  toast("🎁 +🪙"+coins+" +⭐"+xp+" XP — come back tomorrow!");
};

/* ------------------------------- BOOT ------------------------------------ */
function boot(){
  // one-time: force music OFF for existing players (it was annoying); still opt-in via 🎵
  if(state.musicReset!==1){ state.music=false; state.musicReset=1; MUSIC.stop(); save(); }
  refreshTop();
  if(state.music) MUSIC.start();          // only if the player opted in
  setScreen("garage");
  if(state.seenWelcome){
    dailyCheck();                          // returning player -> daily gift
  } else {
    // brand-new player: welcome instead; streak starts tomorrow
    state.lastDaily=dayKey(0); state.streak=1; save();
  }
  if(!state.seenWelcome){
    state.seenWelcome=true; save();
    showModal(`
      <div class="big-emoji">🚜🏗️🛻</div>
      <h3>Welcome to BUILD WORLD!</h3>
      <p style="text-align:left">
        🔧 <b>Garage</b> — pimp out cars, trucks, tractors &amp; bikes.<br>
        🏁 <b>Drive</b> — take your ride off-road, hit ramps &amp; do flips!<br>
        🏗️ <b>Build</b> — design your own farm &amp; town.<br>
        💼 <b>Jobs</b> — earn coins &amp; XP.<br>
        ⭐ <b>Level up</b> to unlock new rides, parts &amp; buildings.<br>
        📤 <b>Share</b> your world with friends!
      </p>
      <button class="btn green" onclick="closeModal()">Let's build! 🚀</button>`);
  }
}
boot();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
